# Both application services run the same image. Declaring it once, here, means
# `docker compose build` describes one build rather than two identical ones, and
# gives the image an explicit name instead of a generated one.
x-app: &app
  image: simplyblock/simplyblock:dev
  build:
    context: .
    dockerfile: docker/Dockerfile
  environment:
    - FLASK_DEBUG=False
    - FLASK_ENV=production
  depends_on:
    - fdb-server

services:
  fdb-server:
    image: foundationdb/foundationdb:7.3.63
    entrypoint: ["/bin/bash", "/var/fdb/scripts/fdb_single.bash"]
    environment:
      FDB_NETWORKING_MODE: 'container'
      FDB_CLUSTER_FILE: '/etc/foundationdb/fdb.cluster'
      FDB_CLUSTER_FILE_CONTENTS: 'docker:4500@fdb-server:4500'
    volumes:
      - "fdb-config:/etc/foundationdb"
      - "fdb-data:/var/fdb/data"
      - "fdb-logs:/var/fdb/logs"

  mgmt-server:
    <<: *app
    command: "python3 simplyblock_web/app.py"
    volumes:
      - "fdb-config:/etc/foundationdb"

  storage-node:
    <<: *app
    command: "python3 simplyblock_web/node_webapp.py storage_node"

volumes:
  fdb-data:
  fdb-logs:
  fdb-config:
