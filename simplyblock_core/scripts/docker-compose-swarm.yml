version: '3.8'

x-service-base: &service-base
  logging:
    driver: gelf
    options:
      gelf-address: "tcp://127.0.0.1:12202"
      mode: "non-blocking"
      max-buffer-size: "40m"


services:

  WebAppAPI:
    <<: *service-base
    image: $SIMPLYBLOCK_DOCKER_IMAGE
    command: "python3 simplyblock_web/app.py"
    networks:
      - localnet
    deploy:
      endpoint_mode: dnsrr
      mode: global
      placement:
        constraints: [node.role == manager]
    volumes:
      - "/etc/foundationdb:/etc/foundationdb"
    environment:
      SIMPLYBLOCK_LOG_LEVEL: "$LOG_LEVEL"
      FLASK_DEBUG: "False"
      FLASK_ENV: "production"
      FLASK_PORT: 5000
    # Swarm replaces a task whose healthcheck fails. Without this a replica
    # whose event loop died stays "Running" with its socket open and hangs
    # every client routed to it.
    healthcheck:
      test: ["CMD", "python3", "-m", "simplyblock_web.healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 4
      start_period: 60s

  StorageNodeMonitor:
    <<: *service-base
    image: $SIMPLYBLOCK_DOCKER_IMAGE
    command: "python3 simplyblock_core/services/storage_node_monitor.py"
    deploy:
      placement:
        constraints: [node.role == manager]
    volumes:
      - "/etc/foundationdb:/etc/foundationdb"
    networks:
      - hostnet
    environment:
      SIMPLYBLOCK_LOG_LEVEL: "$LOG_LEVEL"

  MgmtNodeMonitor:
