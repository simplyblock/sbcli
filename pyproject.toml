[build-system]
requires = ['setuptools>=77']
build-backend = 'setuptools.build_meta'

[project]
name = "sbctl"
dynamic = ["version"]
description = "CLI for managing SimplyBlock cluster"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "simplyblock", email = "developers@simplyblock.io" }]
dependencies = [
    # Any 7.3.x serves the API version db_controller.py requests
    # (constants.KVD_DB_VERSION = 730); 7.4 would not.
    "foundationdb~=7.3.63",
    "hvac",
    "requests",
    "prettytable>=3.10.0",
    "docker",
    "psutil",
    "py-cpuinfo",
    "pytest",
    "mock",
    "flask",
    # 36.0.0 sends no Authorization header in-cluster: load_incluster_config()
    # and the generated client disagreed on the api_key name. Fixed in 36.0.1
    # (kubernetes-client/python#2595).
    "kubernetes>=35,!=36.0.0",
    "PyYAML",
    "urllib3",
    "graypy",
    "boto3",
    "jinja2",
    "argcomplete",
    "jc",
    "prometheus-client",
    "ec2-metadata",
    "flask-swagger-ui",
    "sentry-sdk[flask]>=1.40",
    "flask-openapi3",
    "jsonschema",
    "fastapi",
    "uvicorn",
    "prometheus_api_client",
    "paramiko",
    "pydantic-settings",
    "botocore",
]

[project.urls]
Homepage = "https://www.simplyblock.io/"
Source = "https://github.com/simplyblock/sbcli"

# `sbcli-dev` is a compatibility alias for SBCLI_CMD-based tooling.
[project.scripts]
sbctl = "simplyblock_cli.cli:main"
sbcli-dev = "simplyblock_cli.cli:main"

# setuptools resolves a non-literal `attr:` by importing the module, which is safe
# here only because constants.py imports nothing outside the stdlib.
[tool.setuptools.dynamic]
version = { attr = "simplyblock_core.constants.SIMPLY_BLOCK_VERSION" }

# namespaces = false is not the default for this directive, and without it
# simplyblock_cli/scripts and simplyblock_cli/tests would ship as namespace
# packages.
[tool.setuptools.packages.find]
include = ["simplyblock_cli*", "simplyblock_core*", "simplyblock_web*"]
namespaces = false

# Nothing else ships these: there is no MANIFEST.in, so a resource absent from
# this table is absent from the sdist and therefore from the wheel. workers/ is
# listed as data because it has no __init__.py.
[tool.setuptools.package-data]
simplyblock_core = ["env_var", "scripts/**/*", "services/*", "workers/*"]
simplyblock_web = ["static/*", "templates/*", "api/v1/static/*"]

[tool.ruff]
extend-exclude = ['simplyblock_cli/cli.py']

[tool.mypy]
check_untyped_defs = true
follow_untyped_imports = true
enable_error_code = ["deprecated"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ['simplyblock_core/test', 'tests']
norecursedirs = ['tests/perf']
markers = [
    "slow: long-running integration tests (e.g. live migration); excluded from the default integration run, opt in with -m slow",
]
# Safety net against hung tests: a genuinely stuck test fails with a stack dump
# instead of hanging until an external SIGKILL (which silently masks every other
# failure in the run). 900s is ~3x the slowest legitimate test (the scalability
# throughput migration, ~280s) so it never trips on normal — even unlucky — runs.
# "signal" (SIGALRM, main thread) fails just the offending test and lets the rest
# of the session continue; "thread" would hard-exit the whole process.
timeout = 900
timeout_method = "signal"
