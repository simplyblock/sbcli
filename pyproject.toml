[build-system]
requires = ['setuptools>70']
build-backend = 'setuptools.build_meta'

[tool.ruff]
extend-exclude = ['simplyblock_cli/cli.py']

[tool.ruff.lint]
extend-select = ["FAST"]
ignore = [
    "B006",
    "B008",
    "B009",
    "B012",
    "B017",
    "B018",
    "B023",
    "BLE001",
    "DTZ005",
    "DTZ006",
    "DTZ007",
    "FAST003",  # Reports false-positives due to multi-file dependencies
    "FLY002",  # Prefer joins over format strings 
    "I001",
    "PLC0206",
    "PLR0402",
    "PLR1704",
    "PLR1722",
    "PLR1730",
    "PLW0602",
    "PLW1508",
    "PLW1510",
    "RUF010",
    "RUF012",
    "RUF013",
    "RUF015",
    "RUF019",
    "RUF022",
    "RUF023",
    "RUF046",
    "RUF059",
    "RUF100",
    "S110",
    "S112",
    "SIM101",
    "SIM102",
    "SIM114",
    "SIM115",
    "SIM117",
    "SIM118",
    "TRY002",
    "TRY004",
    "TRY201",
    "TRY203",
    "TRY401",
    "UP007",  # Enable when 3.9 support is dropped
    "UP008",
    "UP031",
    "UP035",
    "UP036",  # Enable when 3.9 support is dropped
    "UP045",  # Enable when 3.9 support is dropped
]

[tool.ruff.lint.per-file-ignores]
"e2e/*" = ["C401", "C408", "C414", "ISC004", "LOG015", "PERF102", "PERF402"]
"scripts/*" = ["ISC004", "LOG015"]

[tool.ruff.lint.flake8-comprehensions]
# Less performant but more readable
allow-dict-calls-with-keyword-arguments = true


[tool.mypy]
check_untyped_defs = true
follow_untyped_imports = true
enable_error_code = ["deprecated"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ['simplyblock_core/test', 'tests']
norecursedirs = ['tests/perf']
markers = [
    "slow: long-running integration tests (e.g. live migration); excluded from the default integration run, opt in with -m slow",
]
# Safety net against hung tests: a genuinely stuck test fails with a stack dump
# instead of hanging until an external SIGKILL (which silently masks every other
# failure in the run). 900s is ~3x the slowest legitimate test (the scalability
# throughput migration, ~280s) so it never trips on normal — even unlucky — runs.
# "signal" (SIGALRM, main thread) fails just the offending test and lets the rest
# of the session continue; "thread" would hard-exit the whole process.
timeout = 900
timeout_method = "signal"
