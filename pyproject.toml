[project]
name = "sbctl"
description = "CLI for managing SimplyBlock cluster"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Hamdy", email = "hamdy@simplyblock.io" }]
dynamic = ["version"]
dependencies = [
    "foundationdb==7.3.63",
    "hvac",
    "requests>=2.33.0",
    "prettytable>=3.10.0",
    "docker",
    "psutil",
    "py-cpuinfo",
    "flask",
    "kubernetes==35.0.0",
    "PyYAML",
    "urllib3>=2.7.0",
    "graypy==2.1.0",
    "boto3",
    "jinja2",
    "jc",
    "prometheus-client",
    "ec2-metadata",
    "flask-swagger-ui",
    "sentry-sdk[flask]>=1.40",
    "flask-openapi3",
    "jsonschema",
    "fastapi",
    "uvicorn",
    "prometheus_api_client",
    "paramiko",
    "pydantic-settings",
    "botocore",
    "tenacity",
    "prometheus_fastapi_instrumentator",
]

[project.urls]
Homepage = "https://www.simplyblock.io/"

# `sbcli-dev` is the value SIMPLY_BLOCK_COMMAND_NAME currently carries
# (simplyblock_core/env_var), and services shell out to it via
# constants.SIMPLY_BLOCK_CLI_NAME. setup.py derived the name from env_var at
# build time; PEP 621 requires static entry points, so both are declared.
[project.scripts]
sbctl = "simplyblock_cli.cli:main"
sbcli-dev = "simplyblock_cli.cli:main"
simplyblock-service = "simplyblock_core.services.__main__:main"

[dependency-groups]
test = [
    "mock",
    "httpx",  # fastapi.testclient
    "pytest>=9.0.3",
    "pytest-randomly",  # per-run seed + per-test reseed; see tests/AGENTS.md
    "pytest-timeout",
    "requests",
    "testcontainers>=4.0",
]
types = [
    "mypy",
    "kubernetes-typed",
    "types-docker",
    "types-boto3",
    "types-urllib3",
]
generate = [
    "jinja2",
    "PyYAML",
    "jsonschema",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

# The version lives in simplyblock_core/env_var, which release.yml rewrites and
# constants.py reads at runtime for `sbctl --version`. _version.py is the single
# reader; it is import-safe at build time because it uses only the stdlib.
[tool.setuptools.dynamic]
version = { attr = "simplyblock_core._version.__version__" }

[tool.setuptools.packages.find]
include = ["simplyblock_core*", "simplyblock_web*", "simplyblock_cli*"]

# Scripts, templates, dashboards and env_var are resolved at runtime relative to
# __file__, so they have to travel inside the packages. Without this setuptools
# ships only *.py and the omission is silent.
[tool.setuptools.package-data]
"*" = ["*"]

[tool.uv]
constraint-dependencies = [
    "cryptography>=50.0.0",
    "starlette>=1.3.1",
    "python-dotenv>=1.2.2",
]

[tool.ruff]
extend-exclude = ['simplyblock_cli/cli.py']

[tool.ruff.lint]
extend-select = ["TID251"]
ignore = [
    "BLE001",
    "DTZ005",
    "DTZ006",
    "DTZ007",
    "FA100",
    "FLY002",
    "G010",
    "G201",
    "I001",
    "ISC004",
    "LOG015",
    "PERF101",
    "PERF102",
    "PERF402",
    "PLC0206",
    "PLR0402",
    "PLR1704",
    "PLR1722",
    "PLR1730",
    "PLW0602",
    "PLW1508",
    "PLW1510",
    "RET501",
    "RUF010",
    "RUF013",
    "RUF015",
    "RUF019",
    "RUF022",
    "RUF023",
    "RUF046",
    "RUF059",
    "RUF100",
    "S110",
    "S112",
    "SIM101",
    "SIM102",
    "SIM103",
    "SIM113",
    "SIM114",
    "SIM115",
    "SIM117",
    "SIM118",
    "SIM210",
    "TRY002",
    "TRY004",
    "TRY201",
    "TRY203",
    "TRY401",
    "UP007",
    "UP022",
    "UP031",
    "UP036",
]

[tool.ruff.lint.per-file-ignores]
# TID251 is flake8-tidy-imports.banned-api, configured below. Test code only —
# production code may seed the global RNG.
"!tests/**" = ["TID251"]
"e2e/**" = ["C401", "C408", "C414"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"random.seed".msg = "Seeding the global RNG breaks seed replay for every later test — pytest-randomly seeds it per test. See tests/AGENTS.md § Randomness and seeds."

[tool.ruff.lint.flake8-comprehensions]
allow-dict-calls-with-keyword-arguments = true

[tool.mypy]
check_untyped_defs = true
follow_untyped_imports = true
enable_error_code = ["deprecated"]

[tool.pytest.ini_options]
pythonpath = "."
testpaths = ['simplyblock_core/test', 'tests']
norecursedirs = ['tests/perf']
# Order randomization stays off for now: tests/conftest.py documents inter-test
# coupling (TTL caches, the DBController singleton, the port-block gate) that
# shuffling would surface all at once. Enabling it is its own change.
addopts = "-p randomly --randomly-dont-reorganize"
markers = [
    "slow: long-running integration tests (e.g. live migration); excluded from the default integration run, opt in with -m slow",
]
# Per-test time BUDGET, not a safety net. The previous 900s ceiling was larger
# than every stall it was meant to catch — a 300s hot-spin in cluster activation
# and a 15s one in the restart-abort path both sailed under it, and the tier took
# ~45min without a single timeout firing. A tight default makes a stall fail
# where it happens, with a stack dump naming the line.
#
# A test that legitimately needs longer overrides it with @pytest.mark.timeout(N)
# and a comment saying why; the migration tier sets its own default in
# tests/integration/migration/conftest.py. See tests/AGENTS.md § Test timeouts.
#
# "signal" (SIGALRM, main thread) fails just the offending test and lets the rest
# of the session continue; "thread" would hard-exit the whole process.
# timeout_func_only stays at its default (false) so a stall in a fixture counts too.
timeout = 30
timeout_method = "signal"
