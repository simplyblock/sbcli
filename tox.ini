[tox]
envlist = lint, types, unit, integration
# integration-slow is intentionally omitted from envlist so `tox run` (no -e)
# skips the long-running migration suite. Invoke it explicitly with
# `tox run -e integration-slow` (CI does this in a dedicated job).
skipsdist = true
requires = tox-uv>=1

# Not pylock.toml: that lock is compiled for the image's interpreter, not these.
[testenv]
basepython = python3.9
deps =
    -e .
    -r test-requirements.txt

[testenv:lint]
# Pinned: ruff 0.16.0 broadened its default rule selection (well beyond the
# classic E4/E7/E9/F baseline) and surfaced ~4700 pre-existing findings across
# the repo, almost all in e2e/ — an unrelated tooling change, not a real
# regression. Pin until those are triaged and the config explicitly opts in.
deps = ruff==0.15.20
commands = ruff check

[testenv:types]
deps =
    -e .
    -r type-requirements.txt
    mypy
commands = mypy simplyblock_web simplyblock_cli simplyblock_core

# Bumps nothing: uv reads the existing pylock.toml as a preference source, so pins
# that still satisfy [project.dependencies] survive. Moving versions is explicit:
#
#   tox run -e lock -- --upgrade                 # bump everything
#   tox run -e lock -- --upgrade-package urllib3 # bump one
#
# 3.12 is the interpreter the image runs, not the 3.13 it installs.
[testenv:lock]
skip_install = true
deps = uv
commands =
    uv pip compile pyproject.toml --format pylock.toml --universal --python-version 3.12 -o pylock.toml {posargs}

# Narrow a run by passing test paths after `--`; with no args the full suite for
# the tier runs (the {posargs:DEFAULT} default).
#   tox run -e integration -- tests/integration/migration          # one subdir
#   tox run -e integration -- tests/integration/migration -k throughput
# NOTE: posargs REPLACE the default path, so always include a tier path when you
# pass args — `-- -k foo` alone drops the path and falls back to pytest's
# testpaths (all of tests/), pulling in tests from other tiers.
#
# To ADD pytest flags without touching the default paths, use PYTEST_ADDOPTS
# (forwarded via passenv) — pytest appends it regardless of posargs:
#   PYTEST_ADDOPTS=-v tox run -e unit                              # verbose, default paths
[testenv:unit]
passenv = PYTEST_ADDOPTS
commands = pytest {posargs:tests/unit/ simplyblock_core/test/}

# The default integration run EXCLUDES slow tests (migration, ~20min) via the
# `slow` marker (registered in pyproject.toml; migration tests are auto-tagged
# in tests/integration/migration/conftest.py). Because posargs REPLACE the
# `{posargs:...}` default, a targeted run still works and is NOT filtered:
#   tox run -e integration -- tests/integration/migration -m slow   # opt back in
[testenv:integration]
passenv = PYTEST_ADDOPTS
commands = pytest {posargs:tests/integration/ -m "not slow"}

# Long-running integration tests only (the `slow`-marked migration suite).
# Kept out of envlist; run explicitly (CI has a dedicated job for it).
[testenv:integration-slow]
passenv = PYTEST_ADDOPTS
commands = pytest {posargs:tests/integration/ -m slow}
