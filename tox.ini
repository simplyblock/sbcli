[tox]
envlist = lint, types, unit, integration, py314t-unit, py314t-integration
# integration-slow is intentionally omitted from envlist so `tox run` (no -e)
# skips the long-running migration suite. Invoke it explicitly with
# `tox run -e integration-slow` (CI does this in a dedicated job).
requires = tox-uv>=1

# The project is installed rather than run from the source tree, so the test
# runs exercise the same package metadata, entry points and package data the
# wheel ships. Editable, so a source edit does not force a reinstall.
[testenv]
package = editable
basepython = python3.11
dependency_groups = test

# The image runs free-threaded 3.14 (docker/Dockerfile), so each test tier has a
# py314t twin. The base version remains the default -- the wheel published to PyPI
# still has to work there. tox-uv fetches both interpreters; neither needs to be
# installed on the host.
#
# `base` makes the twin inherit its tier wholesale, so the tier is defined once:
# adding setenv/deps/commands to [testenv:integration] reaches its twin with no
# edit here. Listing the settings individually (commands = {[testenv:integration]
# commands}) would silently not.
#
# `testenv` must stay first in the list. `base` REPLACES the inheritance chain
# rather than extending it, so `base = testenv:unit` alone drops [testenv] --
# package falls back to sdist and dependency_groups comes out empty, quietly
# running the tier without its test dependencies.
[testenv:py314t-unit]
base = testenv, testenv:unit
basepython = python3.14t

[testenv:py314t-integration]
base = testenv, testenv:integration
basepython = python3.14t

[testenv:lint]
package = skip
deps = ruff
commands = ruff check {posargs}

# Regenerates simplyblock_cli/cli.py from cli-reference.yaml. Kept out of envlist
# because it writes into the source tree; CI runs it and diffs the result to
# verify the checked-in cli.py is up to date.
[testenv:generate]
package = skip
dependency_groups = generate
commands = python {toxinidir}/simplyblock_cli/scripts/cli-wrapper-gen.py {toxinidir}/simplyblock_cli

# `test` as well as `types`: mypy checks simplyblock_core, which contains
# simplyblock_core/test/, so pytest has to be importable for it to resolve.
[testenv:types]
dependency_groups =
    types
    test
commands = mypy simplyblock_web simplyblock_cli simplyblock_core

# Narrow a run by passing test paths after `--`; with no args the full suite for
# the tier runs (the {posargs:DEFAULT} default).
#   tox run -e integration -- tests/integration/migration          # one subdir
#   tox run -e integration -- tests/integration/migration -k throughput
# NOTE: posargs REPLACE the default path, so always include a tier path when you
# pass args — `-- -k foo` alone drops the path and falls back to pytest's
# testpaths (all of tests/), pulling in tests from other tiers.
#
# To ADD pytest flags without touching the default paths, use PYTEST_ADDOPTS
# (forwarded via passenv) — pytest appends it regardless of posargs:
#   PYTEST_ADDOPTS=-v tox run -e unit                              # verbose, default paths
#
# The integration envs always print --durations=10 so a test drifting past its
# budget is visible in every run, not only when it trips the timeout.
[testenv:unit]
passenv = PYTEST_ADDOPTS
commands = pytest {posargs:tests/unit/ simplyblock_core/test/}

# The default integration run EXCLUDES slow tests (migration, ~20min) via the
# `slow` marker (registered in pyproject.toml; migration tests are auto-tagged
# in tests/integration/migration/conftest.py). Because posargs REPLACE the
# `{posargs:...}` default, a targeted run still works and is NOT filtered:
#   tox run -e integration -- tests/integration/migration -m slow   # opt back in
[testenv:integration]
passenv = PYTEST_ADDOPTS
commands = pytest --durations=10 {posargs:tests/integration/ -m "not slow"}

# Long-running integration tests only (the `slow`-marked migration suite).
# Kept out of envlist; run explicitly (CI has a dedicated job for it).
[testenv:integration-slow]
passenv = PYTEST_ADDOPTS
commands = pytest --durations=10 {posargs:tests/integration/ -m slow}
