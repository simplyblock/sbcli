[tox]
envlist = tests, lint, types
skipsdist = true

[testenv]
basepython = python3.13

[testenv:lint]
# Keep this pin in lockstep with .github/workflows/python-checks.yml, so a
# local `tox -e lint` reports what CI will. An unpinned ruff here silently
# diverges from CI as new releases widen the default rule set.
deps = ruff==0.15.16
commands = ruff check

[testenv:types]
deps =
    -r requirements.txt
    -r type-requirements.txt
    mypy
commands = mypy simplyblock_web simplyblock_cli simplyblock_core

[testenv:tests]
deps = -r requirements.txt
commands = pytest {posargs}
