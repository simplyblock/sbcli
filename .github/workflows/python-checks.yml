name: Python checks 

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  clipy-test:
    name: Ensure cli.py is up to date
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Checking cli.py status
      run: |
        ./simplyblock_cli/scripts/generate.sh
        changes="$(git diff simplyblock_cli/cli.py)"
        if [[ "${changes}" ]]; then
          echo "cli.py has changed after regeneration. Stopping."
          echo "${changes}"
          exit 1
        fi


  test:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install test dependencies
      run: pip install -r requirements.txt

    - name: Run tests
      run: pytest -v


  lint:
    name: Linter
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install linter
      # Pinned deliberately. ruff's default rule set grows with each release,
      # so an unpinned install re-lints a frozen release branch against rules
      # that did not exist when it was cut: this job reported 3 errors on
      # 2026-06-08 with ruff 0.15.16 and 3620 on 2026-08-26 with 0.16.3,
      # against essentially the same code. Bump this on purpose, with the
      # resulting findings fixed in the same change -- never implicitly.
      run: pip install ruff==0.15.16

    - name: Execute linter
      run: ruff check


  types:
    name: Type checker
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        cache: 'pip'

    - name: Install type checker
      run: pip install mypy 

    - name: Execute type checker
      run: |
        pip install -r requirements.txt
        pip install -r type-requirements.txt
        mypy simplyblock_web simplyblock_cli simplyblock_core
