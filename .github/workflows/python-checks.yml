name: Python checks 

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - R26.2-PRE

permissions:
  contents: read

jobs:
  clipy-test:
    name: Ensure cli.py is up to date
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install tox
      run: pip install tox tox-uv

    - name: Checking cli.py status
      run: |
        tox run -e generate
        changes="$(git diff simplyblock_cli/cli.py)"
        if [[ "${changes}" ]]; then
          echo "cli.py has changed after regeneration. Stopping."
          echo "${changes}"
          exit 1
        fi


  lock:
    name: Lockfile up to date
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Install uv
      run: pip install uv

    # Fails if uv.lock no longer matches pyproject.toml. The image build uses
    # `uv sync --locked`, so a stale lock breaks the build rather than silently
    # resolving something new -- this reports it on the PR instead.
    - name: Check uv.lock
      run: uv lock --check


  lint:
    name: Linter
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install linter
      run: pip install ruff

    - name: Execute linter
      run: ruff check

    # ruff's target version comes from requires-python (>=3.9); this asserts the
    # sources also parse on the interpreter the image actually runs.
    - name: Check sources parse on the image interpreter
      run: |
        pip install uv
        uv run --python 3.14t --no-project -- \
          python -m compileall -q simplyblock_core simplyblock_web simplyblock_cli


  types:
    name: Type checker
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.9'
        cache: 'pip'

    - name: Install tox
      run: pip install tox tox-uv

    - name: Execute type checker
      run: tox run -e types
