name: K8s Topology Suite - Node Migration (Per-Test Bootstrap)
run-name: "K8s Topology Migration | ${{ inputs.cluster_environment || 'openshift-baremetal' }} | ${{ inputs.TEST_CLASSES }} | ${{ inputs.cluster_params }}"

on:
  workflow_dispatch:
    inputs:
      # =========================
      # Test selection
      # =========================
      TEST_CLASSES:
        description: "Comma-separated migration topology test class names (each gets its own full K8s bootstrap cycle)"
        required: true
        default: "K8sNativeNodeMigrationTest"

      # =========================
      # K8s / Operator inputs
      # =========================
      operator_repo_branch:
        description: 'Branch for simplyblock-operator repo'
        required: true
        default: 'main'
      simplyblock_image:
        description: 'Simplyblock image tag'
        required: true
        default: 'main'
      simplyblock_repository:
        description: 'Simplyblock image repository'
        required: false
        default: 'public.ecr.aws/simply-block/simplyblock'
      operator_repository:
        description: 'Operator image repository'
        required: false
        default: 'simplyblock/simplyblock-operator'
      operator_tag:
        description: 'Operator image tag'
        required: false
        default: 'main'
      csi_repository:
        description: 'CSI driver image repository'
        required: false
        default: 'simplyblock/spdkcsi'
      csi_tag:
        description: 'CSI driver image tag'
        required: false
        default: 'latest'
      spdk_image:
        description: 'SPDK container image'
        required: true
        default: 'simplyblock/spdk:main-latest'

      # =========================
      # Node inputs
      # =========================
      worker_nodes:
        description: 'Comma-separated initial K8s worker node names'
        required: true
      migrate_to_worker:
        description: 'K8s worker node name to migrate a randomly chosen storage node onto'
        required: true
      new_ssd_pcie:
        description: 'Comma-separated PCIe addresses for new SSDs on target worker (e.g. 0000:0b:00.0). Leave empty to keep existing.'
        required: false
        default: ''
      reattach_volume:
        description: 'Reattach volumes after migration'
        required: false
        default: true
        type: boolean

      # =========================
      # Cluster config
      # =========================
      ifc_names:
        description: 'Network interfaces (mgmt_ifc:data_nics)'
        required: false
        default: 'br-ex:enp2s0f0'
      max_lvol:
        description: 'Max logical volume count per storage node'
        required: false
        default: '30'
      cluster_params:
        description: 'Cluster config: ndcs=2,npcs=2,bs=4096,chunk_bs=4096,partitions=1,jm_count=4'
        required: false
        default: 'ndcs=2,npcs=2,bs=4096,chunk_bs=4096,partitions=1,jm_count=4'
      cluster_environment:
        description: 'Target cluster environment'
        required: true
        default: 'openshift-baremetal'
        type: choice
        options:
          - local
          - aws-openshift
          - openshift-local
          - openshift-baremetal
          - gcp

      # =========================
      # SSH / client inputs
      # =========================
      ssh_user:
        description: 'SSH user for client nodes'
        required: false
        default: 'root'
      key_path:
        description: "SSH private key path on runner"
        required: true
        default: "/home/ec2-user/.ssh/simplyblock-us-east-2.pem"
      client_ips:
        description: 'Comma-separated client IPs for external FIO (empty = FIO runs as K8s Jobs)'
        required: false
        default: ''

      # =========================
      # Optional settings
      # =========================
      send_slack_notification:
        description: 'Send Slack notification?'
        required: false
        default: true
        type: boolean
      skip_nfs:
        description: 'Skip NFS mounting (use local logs directory instead)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      use_existing_cluster:
        description: 'Skip cluster cleanup and setup, reuse existing cluster'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      tls_enabled:
        description: 'Enable TLS (installs cert-manager, sets tls.enabled + tls.mutual_enabled)'
        required: false
        default: true
        type: boolean
      nfs_mountpoint:
        description: 'NFS mountpoint on client nodes'
        required: false
        default: '/mnt/nfs_share/'
      preserve_resources_on_failure:
        description: 'Preserve PVCs, FIO pods, snapshots on test failure for debugging'
        required: false
        default: true
        type: boolean
      # cluster_security removed from workflow_dispatch (25 input limit).
      # Backup is auto-enabled when testname contains "Backup".
      # Use workflow_call (via topology suite parent) to pass cluster_security explicitly.

concurrency:
  group: k8s-topology-migration-${{ inputs.cluster_environment || 'openshift-baremetal' }}
  cancel-in-progress: false

# ============================================================================
# JOBS
# ============================================================================
jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Parse TEST_CLASSES into a JSON matrix
  # ─────────────────────────────────────────────────────────────────────────
  setup-matrix:
    name: Parse test list
    runs-on: [self-hosted]
    outputs:
      test_matrix: ${{ steps.parse.outputs.matrix }}
      test_count: ${{ steps.parse.outputs.count }}
    steps:
      - name: Convert TEST_CLASSES to JSON array
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra tests <<< "${{ inputs.TEST_CLASSES }}"
          json="["
          first=true
          for i in "${!tests[@]}"; do
            t=$(echo "${tests[$i]}" | xargs)
            [[ -z "$t" ]] && continue
            [[ "$first" == "true" ]] && first=false || json+=","
            json+="\"$t\""
          done
          json+="]"
          echo "matrix=${json}" >> "$GITHUB_OUTPUT"
          echo "count=${#tests[@]}" >> "$GITHUB_OUTPUT"
          echo "Parsed ${#tests[@]} K8s migration topology tests: ${json}"

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Sequential test runs — full K8s bootstrap + test per entry
  # Each matrix entry calls the reusable k8s-native-e2e-node-migration
  # workflow, which does: cleanup → helm install → CRs → wait active → test
  # ─────────────────────────────────────────────────────────────────────────
  run-tests:
    name: "Migration: ${{ matrix.test }}"
    needs: setup-matrix
    strategy:
      matrix:
        test: ${{ fromJson(needs.setup-matrix.outputs.test_matrix) }}
      max-parallel: 1
      fail-fast: false
    uses: ./.github/workflows/k8s-native-e2e-node-migration.yaml
    with:
      testname: ${{ matrix.test }}
      operator_repo_branch: ${{ inputs.operator_repo_branch }}
      simplyblock_image: ${{ inputs.simplyblock_image }}
      simplyblock_repository: ${{ inputs.simplyblock_repository || 'public.ecr.aws/simply-block/simplyblock' }}
      operator_repository: ${{ inputs.operator_repository || 'simplyblock/simplyblock-operator' }}
      operator_tag: ${{ inputs.operator_tag || 'main' }}
      csi_repository: ${{ inputs.csi_repository || 'simplyblock/spdkcsi' }}
      csi_tag: ${{ inputs.csi_tag || 'latest' }}
      spdk_image: ${{ inputs.spdk_image }}
      worker_nodes: ${{ inputs.worker_nodes }}
      migrate_to_worker: ${{ inputs.migrate_to_worker }}
      new_ssd_pcie: ${{ inputs.new_ssd_pcie || '' }}
      reattach_volume: ${{ inputs.reattach_volume }}
      ifc_names: ${{ inputs.ifc_names || 'br-ex:enp2s0f0' }}
      max_lvol: ${{ inputs.max_lvol || '30' }}
      ssh_user: ${{ inputs.ssh_user || 'root' }}
      key_path: ${{ inputs.key_path }}
      send_slack_notification: false
      cluster_params: ${{ inputs.cluster_params || 'ndcs=2,npcs=2,bs=4096,chunk_bs=4096,partitions=1,jm_count=4' }}
      cluster_environment: ${{ inputs.cluster_environment || 'openshift-baremetal' }}
      skip_nfs: ${{ inputs.skip_nfs || 'false' }}
      use_existing_cluster: ${{ inputs.use_existing_cluster || 'false' }}
      tls_enabled: ${{ inputs.tls_enabled }}
      client_ips: ${{ inputs.client_ips || '' }}
      nfs_mountpoint: ${{ inputs.nfs_mountpoint || '/mnt/nfs_share/' }}
      preserve_resources_on_failure: ${{ inputs.preserve_resources_on_failure }}
      # cluster_security defaults to 'none' in child; backup auto-enabled when testname contains "Backup"
    secrets: inherit

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Combine per-test summaries into a single parent summary
  # ─────────────────────────────────────────────────────────────────────────
  combine-summary:
    name: Combined Summary
    needs: [setup-matrix, run-tests]
    if: always()
    runs-on: [self-hosted]
    steps:
      - name: Download all summary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: test-summary-*
          path: summaries/

      - name: Combine summaries
        shell: bash
        run: |
          {
            echo "# K8s Migration Topology Suite — Combined Results"
            echo ""
            echo "**Tests:** ${{ needs.setup-matrix.outputs.test_count }} | **Overall:** ${{ needs.run-tests.result }}"
            echo ""

            # Extract and display consolidated log directories
            echo "## Log Directories"
            echo ""
            log_found=0
            for dir in summaries/test-summary-*/; do
              [[ -d "$dir" ]] || continue
              [[ -f "${dir}test-summary.md" ]] || continue
              content="$(cat "${dir}test-summary.md")"
              tname="$(echo "$content" | grep -oP 'Summary\s*[—-]\s*\K\S+' | head -1)"
              [[ -z "$tname" ]] && tname="$(basename "$dir")"
              test_log="$(echo "$content" | grep -oP '\*\*Test logs:\*\*\s*`\K[^`]+' | head -1)"
              run_dir="$(echo "$content" | grep -oP '\*\*(RUN_BASE_DIR|Run dir):\*\*\s*`\K[^`]+' | head -1)"
              if [[ -n "$test_log" || -n "$run_dir" ]]; then
                log_found=$((log_found + 1))
                echo "**${tname}**"
                [[ -n "$test_log" ]] && echo "- Test logs: \`${test_log}\`"
                if [[ -n "$run_dir" ]]; then
                  run_dir="${run_dir%/}"
                  echo "- E2E run dir: \`${run_dir}/\`"
                  echo "- Graylog: \`${run_dir}/graylog_collected/\`"
                fi
                echo ""
              fi
            done
            if [[ "$log_found" -eq 0 ]]; then
              echo "> No log directories detected."
              echo ""
            fi

            # Append individual test summaries
            found=0
            for dir in summaries/test-summary-*/; do
              [[ -d "$dir" ]] || continue
              if [[ -f "${dir}test-summary.md" ]]; then
                found=$((found + 1))
                echo "---"
                echo ""
                cat "${dir}test-summary.md"
                echo ""
              fi
            done
            if [[ "$found" -eq 0 ]]; then
              echo "> No individual test summaries were found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send Combined Slack Notification
        if: always() && (inputs.send_slack_notification || true) == true
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          OVERALL_STATUS: ${{ needs.run-tests.result }}
          SLACK_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          GITHUB_REF_NAME: ${{ github.ref_name }}
          TEST_COUNT: ${{ needs.setup-matrix.outputs.test_count }}
          TEST_CLASSES: ${{ inputs.TEST_CLASSES }}
          CLUSTER_ENV: ${{ inputs.cluster_environment || 'openshift-baremetal' }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, sys, urllib.request

          webhook = os.environ.get("SLACK_WEBHOOK_URL", "")
          if not webhook:
              print("No SLACK_WEBHOOK_URL set, skipping.")
              sys.exit(0)

          overall  = os.environ.get("OVERALL_STATUS", "unknown")
          run_url  = os.environ.get("SLACK_RUN_URL", "")
          branch   = os.environ.get("GITHUB_REF_NAME", "?")
          count    = os.environ.get("TEST_COUNT", "?")
          classes  = os.environ.get("TEST_CLASSES", "")
          env_name = os.environ.get("CLUSTER_ENV", "?")

          ok     = overall == "success"
          icon   = ":white_check_mark:" if ok else ":x:"
          status = "SUCCESS" if ok else "FAILURE"
          mention = "" if ok else " <!channel>"

          # Parse per-test results from downloaded summary artifacts
          test_lines = []
          summary_dir = "summaries"
          if os.path.isdir(summary_dir):
              for d in sorted(os.listdir(summary_dir)):
                  md_path = os.path.join(summary_dir, d, "test-summary.md")
                  if not os.path.isfile(md_path):
                      continue
                  content = open(md_path).read()
                  # Extract test name — try "Summary — <Name>" first,
                  # fall back to "Test class: `<Name>`" (e2e-bootstrap format)
                  name_m = re.search(r'Summary\s*[-—]\s*(\S+)', content)
                  if not name_m:
                      name_m = re.search(r'\*\*Test class:\*\*\s*`([^`]+)`', content)
                  tname = name_m.group(1) if name_m else d
                  # Extract result — handle both "SUCCESS"/"FAILED" and emoji prefixed "✅ SUCCESS"
                  res_m = re.search(r'\*\*Result:\*\*\s*(.+?)(?:\s*[&<\n]|$)', content)
                  result = res_m.group(1).strip() if res_m else "?"
                  r_icon = ":white_check_mark:" if "success" in result.lower() else ":x:"
                  # Extract counts — handle both inline "**Total:** N" and
                  # table format "| ✅ Passed | N |" from e2e-bootstrap
                  total_m  = re.search(r'\*\*Total[:\*]*\*?\*?\s*\|?\s*\*?\*?(\d+)', content)
                  passed_m = re.search(r'(?:\*\*Passed:\*\*|[✅] Passed)\s*\|?\s*(\d+)', content)
                  failed_m = re.search(r'(?:\*\*Failed:\*\*|[❌] Failed)\s*\|?\s*(\d+)', content)
                  total  = total_m.group(1) if total_m else "?"
                  passed = passed_m.group(1) if passed_m else "?"
                  failed = failed_m.group(1) if failed_m else "?"
                  # Extract test logs path (from e2e framework)
                  test_log_m = re.search(r'\*\*Test logs:\*\*\s*`([^`]+)`', content)
                  test_log_path = test_log_m.group(1) if test_log_m else None
                  # Extract RUN_BASE_DIR / Run dir path (workflow run directory)
                  log_m = re.search(r'\*\*(?:RUN_BASE_DIR|Run dir):\*\*\s*`([^`]+)`', content)
                  run_dir_path = log_m.group(1).rstrip('/') if log_m else None
                  line = f"  {r_icon} `{tname}` — {passed}/{total} passed, {failed} failed"
                  if test_log_path:
                      line += f"\n        :open_file_folder: `{test_log_path}`"
                  if run_dir_path:
                      line += f"\n        :file_folder: `{run_dir_path}/`"
                      line += f"\n        :scroll: `{run_dir_path}/graylog_collected/`"
                  test_lines.append(line)

          lines = [
              f"{icon} *SimplyBlock K8s Migration Topology Suite*{mention}",
              f"*Status:* {status}  |  *Environment:* `{env_name}`",
              f"*Branch:* `{branch}`  |  *Tests:* {count}",
              "",
          ]
          if test_lines:
              lines.append("*Per-test results:*")
              lines.extend(test_lines)
          else:
              lines.append("_(no per-test summaries found)_")
          lines += [
              "",
              f":link: *Run:* <{run_url}|View on GitHub>",
          ]
          payload = {"text": "\n".join(lines)}
          req = urllib.request.Request(
              webhook,
              data=json.dumps(payload).encode(),
              headers={"Content-Type": "application/json"},
          )
          try:
              urllib.request.urlopen(req, timeout=15)
              print("Combined Slack notification sent.")
          except Exception as exc:
              print(f"WARN: Slack notification failed: {exc}", file=sys.stderr)
          PYEOF
