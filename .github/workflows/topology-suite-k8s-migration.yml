name: K8s Topology Suite - Node Migration (Per-Test Bootstrap)
run-name: "K8s Topology Migration | ${{ inputs.cluster_environment || 'local' }} | ${{ inputs.TEST_CLASSES }} | ${{ inputs.cluster_params }}"

on:
  workflow_dispatch:
    inputs:
      # =========================
      # Test selection
      # =========================
      TEST_CLASSES:
        description: "Comma-separated migration topology test class names (each gets its own full K8s bootstrap cycle)"
        required: true
        default: "K8sNativeNodeMigrationTest"

      # =========================
      # K8s / Operator inputs
      # =========================
      operator_repo_branch:
        description: 'Branch for simplyblock-operator repo'
        required: true
        default: 'main'
      simplyblock_image:
        description: 'Simplyblock image tag'
        required: true
        default: 'main'
      simplyblock_repository:
        description: 'Simplyblock image repository'
        required: false
        default: 'public.ecr.aws/simply-block/simplyblock'
      operator_repository:
        description: 'Operator image repository'
        required: false
        default: 'simplyblock/simplyblock-operator'
      operator_tag:
        description: 'Operator image tag'
        required: false
        default: 'main'
      csi_repository:
        description: 'CSI driver image repository (leave empty for chart default)'
        required: false
      csi_tag:
        description: 'CSI driver image tag (leave empty for chart default)'
        required: false
      spdk_image:
        description: 'SPDK container image'
        required: true
        default: 'simplyblock/spdk:main-latest'

      # =========================
      # Node inputs
      # =========================
      worker_nodes:
        description: 'Comma-separated initial K8s worker node names'
        required: true
      migrate_to_worker:
        description: 'K8s worker node name to migrate a randomly chosen storage node onto'
        required: true
      new_ssd_pcie:
        description: 'Comma-separated PCIe addresses for new SSDs on target worker (e.g. 0000:0b:00.0). Leave empty to keep existing.'
        required: false
        default: ''
      reattach_volume:
        description: 'Reattach volumes after migration'
        required: false
        default: true
        type: boolean

      # =========================
      # Cluster config
      # =========================
      ifc_names:
        description: 'Network interfaces (mgmt_ifc:data_nics)'
        required: false
        default: 'ens18:enp1s0'
      max_lvol:
        description: 'Max logical volume count per storage node'
        required: false
        default: '30'
      cluster_params:
        description: 'Cluster config: ndcs=2,npcs=2,bs=4096,chunk_bs=4096,partitions=1,jm_count=4'
        required: false
        default: 'ndcs=2,npcs=2,bs=4096,chunk_bs=4096,partitions=1,jm_count=4'
      cluster_environment:
        description: 'Target cluster environment'
        required: true
        default: 'local'
        type: choice
        options:
          - local
          - aws-openshift
          - openshift-local
          - openshift-baremetal
          - gcp

      # =========================
      # SSH / client inputs
      # =========================
      ssh_user:
        description: 'SSH user for client nodes'
        required: false
        default: 'root'
      key_path:
        description: "SSH private key path on runner"
        required: true
        default: "/home/ec2-user/.ssh/simplyblock-us-east-2.pem"
      client_ips:
        description: 'Comma-separated client IPs for external FIO (empty = FIO runs as K8s Jobs)'
        required: false
        default: ''

      # =========================
      # Optional settings
      # =========================
      send_slack_notification:
        description: 'Send Slack notification?'
        required: false
        default: true
        type: boolean
      skip_nfs:
        description: 'Skip NFS mounting (use local logs directory instead)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      use_existing_cluster:
        description: 'Skip cluster cleanup and setup, reuse existing cluster'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      tls_enabled:
        description: 'Enable TLS (installs cert-manager, sets tls.enabled + tls.mutual_enabled)'
        required: false
        default: true
        type: boolean
      nfs_mountpoint:
        description: 'NFS mountpoint on client nodes'
        required: false
        default: '/mnt/nfs_share/'

concurrency:
  group: k8s-topology-migration-${{ inputs.cluster_environment || 'local' }}
  cancel-in-progress: false

# ============================================================================
# JOBS
# ============================================================================
jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Job 1: Parse TEST_CLASSES into a JSON matrix
  # ─────────────────────────────────────────────────────────────────────────
  setup-matrix:
    name: Parse test list
    runs-on: [self-hosted]
    outputs:
      test_matrix: ${{ steps.parse.outputs.matrix }}
      test_count: ${{ steps.parse.outputs.count }}
    steps:
      - name: Convert TEST_CLASSES to JSON array
        id: parse
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra tests <<< "${{ inputs.TEST_CLASSES }}"
          json="["
          first=true
          for i in "${!tests[@]}"; do
            t=$(echo "${tests[$i]}" | xargs)
            [[ -z "$t" ]] && continue
            [[ "$first" == "true" ]] && first=false || json+=","
            json+="\"$t\""
          done
          json+="]"
          echo "matrix=${json}" >> "$GITHUB_OUTPUT"
          echo "count=${#tests[@]}" >> "$GITHUB_OUTPUT"
          echo "Parsed ${#tests[@]} K8s migration topology tests: ${json}"

  # ─────────────────────────────────────────────────────────────────────────
  # Job 2: Sequential test runs — full K8s bootstrap + test per entry
  # Each matrix entry calls the reusable k8s-native-e2e-node-migration
  # workflow, which does: cleanup → helm install → CRs → wait active → test
  # ─────────────────────────────────────────────────────────────────────────
  run-tests:
    name: "Migration: ${{ matrix.test }}"
    needs: setup-matrix
    strategy:
      matrix:
        test: ${{ fromJson(needs.setup-matrix.outputs.test_matrix) }}
      max-parallel: 1
      fail-fast: false
    uses: ./.github/workflows/k8s-native-e2e-node-migration.yaml
    with:
      testname: ${{ matrix.test }}
      operator_repo_branch: ${{ inputs.operator_repo_branch }}
      simplyblock_image: ${{ inputs.simplyblock_image }}
      simplyblock_repository: ${{ inputs.simplyblock_repository || 'public.ecr.aws/simply-block/simplyblock' }}
      operator_repository: ${{ inputs.operator_repository || 'simplyblock/simplyblock-operator' }}
      operator_tag: ${{ inputs.operator_tag || 'main' }}
      csi_repository: ${{ inputs.csi_repository || '' }}
      csi_tag: ${{ inputs.csi_tag || '' }}
      spdk_image: ${{ inputs.spdk_image }}
      worker_nodes: ${{ inputs.worker_nodes }}
      migrate_to_worker: ${{ inputs.migrate_to_worker }}
      new_ssd_pcie: ${{ inputs.new_ssd_pcie || '' }}
      reattach_volume: ${{ inputs.reattach_volume }}
      ifc_names: ${{ inputs.ifc_names || 'ens18:enp1s0' }}
      max_lvol: ${{ inputs.max_lvol || '30' }}
      ssh_user: ${{ inputs.ssh_user || 'root' }}
      key_path: ${{ inputs.key_path }}
      send_slack_notification: ${{ inputs.send_slack_notification }}
      cluster_params: ${{ inputs.cluster_params || 'ndcs=2,npcs=2,bs=4096,chunk_bs=4096,partitions=1,jm_count=4' }}
      cluster_environment: ${{ inputs.cluster_environment || 'local' }}
      skip_nfs: ${{ inputs.skip_nfs || 'false' }}
      use_existing_cluster: ${{ inputs.use_existing_cluster || 'false' }}
      tls_enabled: ${{ inputs.tls_enabled }}
      client_ips: ${{ inputs.client_ips || '' }}
      nfs_mountpoint: ${{ inputs.nfs_mountpoint || '/mnt/nfs_share/' }}
    secrets: inherit

  # ─────────────────────────────────────────────────────────────────────────
  # Job 3: Combine per-test summaries into a single parent summary
  # ─────────────────────────────────────────────────────────────────────────
  combine-summary:
    name: Combined Summary
    needs: [setup-matrix, run-tests]
    if: always()
    runs-on: [self-hosted]
    steps:
      - name: Download all summary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: test-summary-*
          path: summaries/

      - name: Combine summaries
        shell: bash
        run: |
          {
            echo "# K8s Migration Topology Suite — Combined Results"
            echo ""
            echo "**Tests:** ${{ needs.setup-matrix.outputs.test_count }} | **Overall:** ${{ needs.run-tests.result }}"
            echo ""
            found=0
            for dir in summaries/test-summary-*/; do
              [[ -d "$dir" ]] || continue
              if [[ -f "${dir}test-summary.md" ]]; then
                found=$((found + 1))
                echo "---"
                echo ""
                cat "${dir}test-summary.md"
                echo ""
              fi
            done
            if [[ "$found" -eq 0 ]]; then
              echo "> No individual test summaries were found."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
