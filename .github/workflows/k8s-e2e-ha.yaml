name: HA E2E K8s Tests

on:

  workflow_dispatch:
    inputs:
      simplyBlockDeploy_branch:
        description: 'Branch for simplyBlockDeploy'
        required: true
        default: 'main'
      operator_repo_branch:
        description: 'Branch for simplyblock-operator repo'
        required: true
        default: 'main'
      testname:
        description: 'Name of test to run. Empty to run all'
        required: false
        default: ''
      send_slack_notification:
        description: 'Send Slack notification?'
        required: false
        default: false
        type: boolean
      ndcs:
        description: 'Number of data chunks'
        required: false
        default: 2
      npcs:
        description: 'Number of parity chunks'
        required: false
        default: 1
      bs:
        description: 'Block size'
        required: false
        default: 4096
      chunk_bs:
        description: 'Chunk block size'
        required: false
        default: 4096

jobs:
  e2e:
    runs-on: self-hosted
    concurrency:
      group: ${{ github.workflow }}
      cancel-in-progress: false
    steps:
      - name: Fix workspace permissions
        run: sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE" 2>/dev/null || true

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set send_slack_notification for scheduled and push events
        if: github.event_name == 'schedule' || github.event_name == 'push'
        run: echo "send_slack_notification=true" >> $GITHUB_ENV

      - name: Set send_slack_notification for manual workflow_dispatch
        if: github.event_name == 'workflow_dispatch'
        run: echo "send_slack_notification=${{ github.event.inputs.send_slack_notification }}" >> $GITHUB_ENV

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
      - run: go version

      - name: Install Helm v3.15.4
        run: |
          curl -L https://get.helm.sh/helm-v3.15.4-linux-amd64.tar.gz -o helm-v3.15.4-linux-amd64.tar.gz
          tar -zxvf helm-v3.15.4-linux-amd64.tar.gz
          sudo mv linux-amd64/helm /usr/local/bin/helm
          helm version

      - name: Install kubectl v1.31.0
        run: |
          curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
          chmod +x kubectl
          sudo mv kubectl /usr/local/bin/
          kubectl version --client

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - uses: actions/checkout@master
        name: Checkout code simplyBlockDeploy
        with:
          repository: simplyblock-io/simplyBlockDeploy
          ref: refs/heads/${{ github.event.inputs.simplyBlockDeploy_branch || 'main'}}
          path: 'simplyBlockDeploy'
          token: ${{ secrets.GH_ACCESS_KEY_ID_RAUNAK }}

      - uses: actions/checkout@master
        name: Checkout simplyblock-operator
        with:
          repository: simplyblock/simplyblock-operator
          ref: refs/heads/${{ github.event.inputs.operator_repo_branch || 'main'}}
          path: 'simplyblock-operator'
          token: ${{ secrets.GH_ACCESS_KEY_ID_RAUNAK }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_wrapper: false

      - name: Initialize Terraform
        run: |
          cd $GITHUB_WORKSPACE/simplyBlockDeploy
          export TFSTATE_BUCKET=simplyblock-terraform-state-bucket
          export TFSTATE_KEY=csi
          export TFSTATE_REGION=us-east-2
          export TFSTATE_DYNAMODB_TABLE=terraform-up-and-running-locks

          terraform init -reconfigure \
              -backend-config="bucket=${TFSTATE_BUCKET}" \
              -backend-config="key=${TFSTATE_KEY}" \
              -backend-config="region=${TFSTATE_REGION}" \
              -backend-config="dynamodb_table=${TFSTATE_DYNAMODB_TABLE}" \
              -backend-config="encrypt=true"

      - name: Select or create workspace
        run: |
          cd $GITHUB_WORKSPACE/simplyBlockDeploy
          terraform workspace select -or-create ghiaction-sbclie2ek8s

      - name: Validate Terraform Configuration
        run: |
          cd $GITHUB_WORKSPACE/simplyBlockDeploy
          terraform validate

      - name: Set parameters based on branch and input
        run: |
          echo "SBCLI_CMD=sbctl" >> $GITHUB_ENV
          echo "NDCS=${{ github.event.inputs.ndcs || 2 }}" >> $GITHUB_ENV
          echo "NPCS=${{ github.event.inputs.npcs || 1 }}" >> $GITHUB_ENV
          echo "BS=${{ github.event.inputs.bs || 4096 }}" >> $GITHUB_ENV
          echo "CHUNK_BS=${{ github.event.inputs.chunk_bs || 4096 }}" >> $GITHUB_ENV
        shell: bash

      - name: Plan Terraform Changes
        run: |
          cd $GITHUB_WORKSPACE/simplyBlockDeploy
          terraform plan \
            -var "mgmt_nodes=1" -var "storage_nodes=4" -var "volumes_per_storage_nodes=1" \
            -var storage_nodes_instance_type="m6g.2xlarge" \
            -var "storage_nodes_arch=arm64" -var "snode_deploy_on_k8s=true" \
            -var "extra_nodes=1" -var "extra_nodes_instance_type=m6gd.xlarge" \
            -var storage_nodes_ebs_size2=100 -var "region=us-east-2" \
            -var "extra_nodes_arch=arm64" -var "sec_storage_nodes=1" -var "sec_storage_nodes_instance_type=m6g.4xlarge" \
            -var "sbcli_cmd=$SBCLI_CMD" -out=tfplan
        env:
          SBCLI_CMD: sbctl

      - name: Apply Terraform Changes
        run: |
          cd $GITHUB_WORKSPACE/simplyBlockDeploy
          terraform apply tfplan

      - name: Get Terraform Outputs
        id: terraform_outputs
        run: |
          cd $GITHUB_WORKSPACE/simplyBlockDeploy
          output_bastion_public_ip=$(terraform output -raw bastion_public_ip)
          echo "::set-output name=bastion_public_ip::$output_bastion_public_ip"
          output_key_name=$(terraform output -raw key_name)
          echo "::set-output name=key_name::$output_key_name"
          output_extra_node_public_ip=$(terraform output -raw extra_nodes_public_ips)
          echo "::set-output name=extra_node_public_ip::$output_extra_node_public_ip"
          output_mgmt_private_ip=$(terraform output -raw mgmt_private_ips)
          echo "::set-output name=mgmt_private_ip::$output_mgmt_private_ip"

      - name: Bootstrap Cluster
        run: |
          cd $GITHUB_WORKSPACE/simplyBlockDeploy
          ./bootstrap-cluster.sh --sbcli-cmd "$SBCLI_CMD" \
            --max-lvol 10 --max-snap 10 --max-prov 500G --number-of-devices 1 \
            --distr-ndcs $NDCS \
            --distr-npcs $NPCS \
            --distr-bs $BS \
            --distr-chunk-bs $CHUNK_BS \
            --k8s-snode --partitions 0 --ha-type ha
        id: bootstrap_cluster
        env:
          SBCLI_CMD: sbctl
          NDCS: ${{ env.NDCS }}
          NPCS: ${{ env.NPCS }}
          BS: ${{ env.BS }}
          CHUNK_BS: ${{ env.CHUNK_BS }}

      - name: Bootstrap k3s
        run: |
          echo "Sleeping for 30 seconds before bootstrap-k3s"
          sleep 30
          cd $GITHUB_WORKSPACE/simplyBlockDeploy
          ./bootstrap-k3s.sh --k8s-snode
        id: bootstrap_k3s

      - name: Configure Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          KUBECONFIG_FILE="$HOME/.kube/config-${{ github.run_id }}"
          scp -i "$HOME/.ssh/${{ steps.terraform_outputs.outputs.key_name }}" ec2-user@${{ steps.terraform_outputs.outputs.extra_node_public_ip }}:/etc/rancher/k3s/k3s.yaml "$KUBECONFIG_FILE"
          sed -i "s/server: https:\/\/\(localhost\|127.0.0.1\)\(:[0-9]*\)/server: https:\/\/${{ steps.terraform_outputs.outputs.extra_node_public_ip }}\2/" "$KUBECONFIG_FILE"
          echo "KUBECONFIG=$KUBECONFIG_FILE" >> $GITHUB_ENV

      - name: Install Helm Chart for simplyblock-operator
        run: |
          cd $GITHUB_WORKSPACE/simplyblock-operator/helm-charts/charts/simplyblock-operator/
          echo "Sleeping for 30 seconds before helm install"
          sleep 30
          helm install spdk-csi ./ \
            --namespace spdk-csi \
            --create-namespace \
            --set csiConfig.simplybk.uuid="${{ steps.bootstrap_cluster.outputs.cluster_id }}" \
            --set csiConfig.simplybk.ip="${{ steps.bootstrap_cluster.outputs.cluster_api_gateway_endpoint }}" \
            --set csiSecret.simplybk.secret="${{ steps.bootstrap_cluster.outputs.cluster_secret }}" \
            --set logicalVolume.pool_name="testing1" \
            --set logicalVolume.snapshot="True" \
            --set image.spdkcsi.tag=latest \
            --set image.simplyblock.tag=main-ha \
            --set storagenode.spdkImage=simplyblock/spdk:main-latest \
            --set logicalVolume.distr_ndcs="${NDCS}" \
            --set logicalVolume.distr_npcs="${NPCS}" \
            --set storagenode.create=true \
            --set logicalVolume.encryption=true
        env:
          NDCS: ${{ env.NDCS }}
          NPCS: ${{ env.NPCS }}

      # - name: Wait for Storage Nodes to Become Online
      #   run: |
      #     echo "Sleeping for 120 seconds before helm install"
      #     sleep 120
      #     while true; do
      #       echo "Checking storage node status..."
            
      #       NODE_STATUS=$(ssh -i "$HOME/.ssh/${{ steps.terraform_outputs.outputs.key_name }}" \
      #         -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no \
      #         -o ProxyCommand="ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -i \"$HOME/.ssh/${{ steps.terraform_outputs.outputs.key_name }}\" -W %h:%p ec2-user@${{ steps.terraform_outputs.outputs.bastion_public_ip }}" \
      #         ec2-user@${{ steps.terraform_outputs.outputs.mgmt_private_ip }} \
      #         "sbcli-dev sn list | grep -Eo 'online|offline'" || echo "SSH command failed")

      #       SSH_EXIT_CODE=$?
      #       if [ $SSH_EXIT_CODE -ne 0 ]; then
      #         echo "SSH command failed with exit code $SSH_EXIT_CODE. Retrying..."
      #         sleep 30
      #         continue
      #       fi

      #       if [ -z "$NODE_STATUS" ]; then
      #         echo "No output from sbcli-dev sn list. Retrying..."
      #         sleep 30
      #         continue
      #       fi

      #       echo "Node Status: $NODE_STATUS"
      #       ONLINE_NODES=$(echo "$NODE_STATUS" | grep -c "online")
            
      #       if [ "$ONLINE_NODES" -ge 3 ]; then
      #         echo "All 3 storage nodes are online."
      #         break
      #       else
      #         echo "$ONLINE_NODES nodes online. Waiting for more nodes to come online..."
      #         sleep 30
      #       fi
      #     done
      #   shell: /usr/bin/bash -e {0}
      
      - name: Sleep after Helm Installation
        run: sleep 600

      - name: Check Cluster Status
        run: |
          CLUSTER_API_GATEWAY_ENDPOINT=${{ steps.bootstrap_cluster.outputs.cluster_api_gateway_endpoint }}
          CLUSTER_UUID=${{ steps.bootstrap_cluster.outputs.cluster_id }}
          CLUSTER_SECRET=${{ steps.bootstrap_cluster.outputs.cluster_secret }}
          BASTION_IP=${{ steps.terraform_outputs.outputs.bastion_public_ip }}
          MGMT_IP=${{ steps.terraform_outputs.outputs.mgmt_private_ip }}
          KEY_NAME=${{ steps.terraform_outputs.outputs.key_name }}

          n=0
          until [ "$n" -ge 60 ]
          do
            response=$(curl -s -X GET "$CLUSTER_API_GATEWAY_ENDPOINT/cluster/$CLUSTER_UUID" \
              -H "Content-Type: application/json" \
              -H "Authorization: $CLUSTER_UUID $CLUSTER_SECRET")

            status=$(echo $response | jq -r '.results[0].status')

            if [ "$status" != "active" ]; then
                echo "Cluster status is not active, current status: $status, retrying"
                n=$((n+1))
                sleep 10
            else
                echo "Cluster status is active"
                exit 0
            fi
          done

          echo "Cluster is not active after polling, attempting forced activation..."
          ssh -i "$HOME/.ssh/${KEY_NAME}" \
            -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no \
            -o ProxyCommand="ssh -o UserKnownHostsFile=/dev/null -o StrictHostKeyChecking=no -i \"$HOME/.ssh/${KEY_NAME}\" -W %h:%p ec2-user@${BASTION_IP}" \
            ec2-user@${MGMT_IP} "sbctl -d cluster activate ${CLUSTER_UUID}" || true

          echo "Waiting 30s for activation to take effect..."
          sleep 30

          response=$(curl -s -X GET "$CLUSTER_API_GATEWAY_ENDPOINT/cluster/$CLUSTER_UUID" \
            -H "Content-Type: application/json" \
            -H "Authorization: $CLUSTER_UUID $CLUSTER_SECRET")
          status=$(echo $response | jq -r '.results[0].status')

          if [ "$status" = "active" ]; then
            echo "Cluster is now active after forced activation"
            exit 0
          fi

          echo "ERROR: Cluster is still not active after forced activation, status: $status"
          exit 1

      - name: Record Test Start Time
        run: echo "TEST_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Setup Tests & Run Tests
        timeout-minutes: 120
        run: |
          cd $GITHUB_WORKSPACE/e2e
          sudo apt-get install -y python3.12-venv
          python3 -m venv myenv
          source myenv/bin/activate
          python3 -m pip install -r requirements.txt
          echo "Running tests in namespace ${{ steps.get-namespace.outputs.namespace }}"
          export CLUSTER_ID=${{ steps.bootstrap_cluster.outputs.cluster_id }}
          export CLUSTER_SECRET=${{ steps.bootstrap_cluster.outputs.cluster_secret }}
          export CLUSTER_IP=${{ steps.bootstrap_cluster.outputs.cluster_ip }}
          export API_BASE_URL=${{ steps.bootstrap_cluster.outputs.cluster_api_gateway_endpoint }}
          export BASTION_SERVER=${{ steps.terraform_outputs.outputs.bastion_public_ip }}
          export KEY_NAME=${{ steps.terraform_outputs.outputs.key_name }}
          export AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          export AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          export AWS_REGION=${{ secrets.AWS_REGION }}
          export SBCLI_CMD=${SBCLI_CMD}
          TESTNAME="--testname TestSingleNodeFailureHA"
#          if [ -n "${{ github.event.inputs.testname }}" ]; then
#            TESTNAME="--testname ${{ github.event.inputs.testname }}"
#          fi
          
          python3 e2e.py $TESTNAME \
                  --ndcs $NDCS --npcs $NPCS --bs $BS --chunk_bs $CHUNK_BS \
                  --run_k8s True --run_ha True
        env:
          SBCLI_CMD: sbctl
          NDCS: ${{ env.NDCS }}
          NPCS: ${{ env.NPCS }}
          BS: ${{ env.BS }}
          CHUNK_BS: ${{ env.CHUNK_BS }}

      - name: Record Test End Time
        if: always() 
        run: echo "TEST_END_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Calculate Total Time Taken
        if: always()
        run: |
          TEST_TIME=$(($TEST_END_TIME - $TEST_START_TIME))
          TEST_TIME_HOURS=$(($TEST_TIME / 3600))
          TEST_TIME_MINS=$((($TEST_TIME % 3600) / 60))
          TEST_TIME_SECS=$(($TEST_TIME % 60))
          echo "Test runtime: ${TEST_TIME_HOURS}h ${TEST_TIME_MINS}m ${TEST_TIME_SECS}s"
          echo "TEST_TIME_HOURS=$TEST_TIME_HOURS" >> $GITHUB_ENV
          echo "TEST_TIME_MINS=$TEST_TIME_MINS" >> $GITHUB_ENV
          echo "TEST_TIME_SECS=$TEST_TIME_SECS" >> $GITHUB_ENV

      - name: Parse test results
        if: always() && (github.event_name == 'schedule' || env.send_slack_notification == 'true')
        id: parse_results
        run: |
          cd $GITHUB_WORKSPACE/e2e/logs
          echo "Looking for the latest non-empty log file..."
          # Find the latest non-empty log file
          COUNTER=0
          MAX_ATTEMPTS=10
          while [ $COUNTER -lt $MAX_ATTEMPTS ]; do
            LATEST_LOG=$(ls -t *.log | head -n 1)
            if [ -s "$LATEST_LOG" ]; then
              echo "Found non-empty log file: $LATEST_LOG"
              break
            fi
            echo "Attempt $((COUNTER + 1)): No non-empty log file found. Retrying..."
            COUNTER=$((COUNTER + 1))
            sleep 1  # Add a small delay to avoid rapid looping
          done
          if [ ! -s "$LATEST_LOG" ]; then
            echo "No non-empty log file found after $MAX_ATTEMPTS attempts"
            exit 1
          fi
          echo "Parsing the identified log file: $LATEST_LOG"
          # Parse the identified log file
          echo "Total tests"
          TOTAL_TESTS=$(grep -i "Number of Total Cases" "$LATEST_LOG" | awk '{print $NF}')
          echo "number Passed tests"
          PASSED_TESTS=$(grep -i "Number of Passed Cases" "$LATEST_LOG" | awk '{print $NF}')
          echo "number Failed tests"
          FAILED_TESTS=$(grep -i "Number of Failed Cases" "$LATEST_LOG" | awk '{print $NF}')
          echo "List Passed tests"
          PASSED_CASES=$(grep "PASSED CASE" "$LATEST_LOG" | awk -F 'INFO - | FAILED CASE' '{print $2}')
          echo "List Failed tests"
          FAILED_CASES=$(grep "FAILED CASE" "$LATEST_LOG" | awk -F 'INFO - | FAILED CASE' '{print $2}')
          # Format passed and failed cases as bullet points
          echo "Adding PASSED cases with bullets: $PASSED_CASES"
          echo "Adding FAILED cases with bullets: $PASSED_CASES"
          PASSED_CASES_BULLETS=$(echo "$PASSED_CASES" | awk '{printf "    • %s\n", $0}')
          FAILED_CASES_BULLETS=$(echo "$FAILED_CASES" | awk '{printf "    • %s\n", $0}')
          echo "PASSED cases with bullets: $PASSED_CASES_BULLETS"
          echo "FAILED cases with bullets: $FAILED_CASES_BULLETS"
          echo "TOTAL_TESTS=${TOTAL_TESTS}"
          echo "PASSED_TESTS=${PASSED_TESTS}"
          echo "FAILED_TESTS=${FAILED_TESTS}"
          echo "PASSED_CASES=${PASSED_CASES}"
          echo "FAILED_CASES=${FAILED_CASES}"
          echo "PASSED_TESTS=${PASSED_TESTS}" >> $GITHUB_ENV
          echo "FAILED_TESTS=${FAILED_TESTS}" >> $GITHUB_ENV
          echo "TOTAL_TESTS=${TOTAL_TESTS}" >> $GITHUB_ENV
          echo "PASSED_CASES<<EOF" >> $GITHUB_ENV
          echo "${PASSED_CASES}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "FAILED_CASES<<EOF" >> $GITHUB_ENV
          echo "${FAILED_CASES}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "PASSED_CASES_BULLETS<<EOF" >> $GITHUB_ENV
          echo "${PASSED_CASES_BULLETS}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV
          echo "FAILED_CASES_BULLETS<<EOF" >> $GITHUB_ENV
          echo "${FAILED_CASES_BULLETS}" >> $GITHUB_ENV
          echo "EOF" >> $GITHUB_ENV

      - name: Write Job Summary
        if: always()
        shell: bash
        run: |
          set -euxo pipefail

          dur_fmt="${TEST_TIME_HOURS:-0}h ${TEST_TIME_MINS:-0}m ${TEST_TIME_SECS:-0}s"

          # --- Parse test counts ---
          total_cases="${TOTAL_TESTS:-0}"
          passed_cases="${PASSED_TESTS:-0}"
          failed_cases="${FAILED_TESTS:-0}"
          skipped_cases=0

          pass_pct=0; fail_pct=0
          if [[ "${total_cases}" =~ ^[0-9]+$ && "${total_cases}" -gt 0 ]]; then
            pass_pct=$(( (passed_cases  * 100) / total_cases ))
            fail_pct=$(( (failed_cases  * 100) / total_cases ))
          fi

          # --- Parse per-test status from log ---
          test_details_table=""
          log_file=""
          for f in $GITHUB_WORKSPACE/e2e/logs/*.log; do
            [ -s "$f" ] && log_file="$f"
          done
          if [[ -n "${log_file}" ]]; then
            while IFS= read -r line; do
              clean="$(printf '%s' "${line}" | sed 's/\x1b\[[0-9;]*m//g')"
              test_name="$(printf '%s' "${clean}" | grep -oE 'Test[A-Za-z0-9_]+' | head -n1 || true)"
              [[ -z "${test_name}" ]] && continue
              if   printf '%s' "${clean}" | grep -qi 'PASSED CASE';  then icon="✅"; status="PASSED"
              elif printf '%s' "${clean}" | grep -qi 'FAILED CASE';  then icon="❌"; status="FAILED"
              elif printf '%s' "${clean}" | grep -qi 'SKIPPED CASE'; then icon="⏭"; status="SKIPPED"
              else continue
              fi
              test_details_table+="| \`${test_name}\` | ${icon} ${status} |"$'\n'
            done < <(grep -iE 'PASSED CASE|FAILED CASE|SKIPPED CASE' "${log_file}" 2>/dev/null || true)
          fi

          # --- Failure reason ---
          failure_reason=""
          if [[ -n "${log_file}" ]]; then
            multi="$(grep 'MultipleExceptions:' "${log_file}" | sed 's/\x1b\[[0-9;]*m//g' || true)"
            if [[ -n "${multi}" ]]; then
              failure_reason="${multi}"
            elif grep -Eqi 'Traceback \(most recent call last\)|Exception:|AssertionError|Input/output error' "${log_file}"; then
              failure_reason="$(grep -Ei 'Traceback \(most recent call last\)|Exception:|AssertionError|Input/output error' "${log_file}" | tail -n 3 | sed 's/\x1b\[[0-9;]*m//g' || true)"
            fi
          fi

          # --- Overall result ---
          conclusion="✅ SUCCESS"
          if [[ "${{ job.status }}" != "success" ]]; then
            conclusion="❌ FAILED"
          fi

          {
            echo "## SimplyBlock K8s E2E HA Run Summary"
            echo ""
            echo "**Result:** ${conclusion} &nbsp;|&nbsp; **Duration:** ${dur_fmt}"
            echo ""

            echo "### Test Results"
            echo "| | Count | % |"
            echo "|---|---|---|"
            echo "| ✅ Passed  | ${passed_cases}  | ${pass_pct}% |"
            echo "| ❌ Failed  | ${failed_cases}  | ${fail_pct}% |"
            echo "| **Total**  | **${total_cases}** | |"
            echo ""

            if [[ -n "${test_details_table}" ]]; then
              echo "### Test Case Details"
              echo "| Test | Result |"
              echo "|---|---|"
              printf '%s' "${test_details_table}"
              echo ""
            fi

            echo "### Run Info"
            echo "- **Test class:** \`${TESTNAME:-all}\`"
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **NDCS/NPCS:** \`${NDCS}/${NPCS}\`"
            echo "- **BS/Chunk BS:** \`${BS}/${CHUNK_BS}\`"
            echo ""

            if [[ -n "${failure_reason}" ]]; then
              echo "### Failure Reason"
              echo '```'
              printf '%s\n' "${failure_reason}"
              echo '```'
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TESTNAME: ${{ github.event.inputs.testname || '' }}
          NDCS: ${{ env.NDCS }}
          NPCS: ${{ env.NPCS }}
          BS: ${{ env.BS }}
          CHUNK_BS: ${{ env.CHUNK_BS }}

      - name: Send Slack Notification
        if: always() && (github.event_name == 'schedule' || env.send_slack_notification == 'true')
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          JOB_STATUS: ${{ job.status }}
          SLACK_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          GITHUB_REF_NAME: ${{ github.ref_name }}
          SLACK_WF_NAME: "K8s E2E HA"
          TESTNAME: ${{ github.event.inputs.testname || 'all' }}
          NDCS: ${{ env.NDCS }}
          NPCS: ${{ env.NPCS }}
          BS: ${{ env.BS }}
          CHUNK_BS: ${{ env.CHUNK_BS }}
          TEST_START_TIME: ${{ env.TEST_START_TIME }}
          TEST_END_TIME: ${{ env.TEST_END_TIME }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, sys, urllib.request, urllib.error, glob

          bot_token = os.environ.get("SLACK_BOT_TOKEN", "")
          channel   = os.environ.get("SLACK_CHANNEL_ID", "")
          webhook   = os.environ.get("SLACK_WEBHOOK_URL", "")
          if not bot_token and not webhook:
              print("No SLACK_BOT_TOKEN or SLACK_WEBHOOK_URL set, skipping.")
              sys.exit(0)

          # Find latest log file
          log_dir = os.path.join(os.environ.get("GITHUB_WORKSPACE", "."), "e2e", "logs")
          log_files = sorted(glob.glob(os.path.join(log_dir, "*.log")), key=os.path.getmtime, reverse=True)
          content = ""
          for lf in log_files:
              if os.path.getsize(lf) > 0:
                  content = open(lf).read()
                  break

          # --- Counts (e2e.py format) ---
          def px(pat):
              m = re.search(pat, content)
              return int(m.group(1)) if m else 0
          total   = px(r'Number of Total Cases:\s*(\d+)')
          passed  = px(r'Number of Passed Cases:\s*(\d+)')
          failed  = px(r'Number of Failed Cases:\s*(\d+)')
          skipped = px(r'Number of Skipped Cases:\s*(\d+)')
          pass_pct = (passed * 100 // total) if total > 0 else 0

          # --- Per-test results ---
          ansi = re.compile(r'\x1b\[[0-9;]*m')
          test_results = []
          for line in content.splitlines():
              clean = ansi.sub('', line)
              if not re.search(r'(PASSED|FAILED|SKIPPED) CASE', clean):
                  continue
              m = re.search(r'Test[A-Za-z0-9_]+', clean)
              if not m:
                  continue
              name = m.group(0)
              if   'PASSED CASE'  in clean: test_results.append(('PASSED',  name))
              elif 'FAILED CASE'  in clean: test_results.append(('FAILED',  name))
              elif 'SKIPPED CASE' in clean: test_results.append(('SKIPPED', name))

          # --- Failure reason ---
          failure_reason = ""
          multi = [ansi.sub('', l) for l in content.splitlines() if 'MultipleExceptions:' in l]
          if multi:
              failure_reason = multi[0][:2000]
          elif content:
              exc_lines = [ansi.sub('', l) for l in content.splitlines()
                           if re.search(r'(Exception:|AssertionError|Input/output error)', l)]
              if exc_lines:
                  failure_reason = '\n'.join(exc_lines[-5:])[:2000]

          # --- Env ---
          s    = int(os.environ.get("TEST_START_TIME", "0") or "0")
          e    = int(os.environ.get("TEST_END_TIME",   "0") or "0")
          secs = max(0, e - s) if e >= s > 0 else 0
          dur  = f"{secs//3600}h {(secs%3600)//60}m {secs%60}s"
          run_url  = os.environ.get("SLACK_RUN_URL",   "")
          ndcs     = os.environ.get("NDCS",            "?")
          npcs     = os.environ.get("NPCS",            "?")
          bs       = os.environ.get("BS",              "?")
          chunk_bs = os.environ.get("CHUNK_BS",        "?")
          test_cls = os.environ.get("TESTNAME",        "") or "all"
          branch   = os.environ.get("GITHUB_REF_NAME", "?")
          wf_name  = os.environ.get("SLACK_WF_NAME",   "Run")
          ok       = os.environ.get("JOB_STATUS",      "") == "success"

          icon    = ":white_check_mark:" if ok else ":x:"
          status  = "SUCCESS" if ok else "FAILURE"
          mention = "" if ok else " <!channel>"

          lines = [
              f"{icon} *SimplyBlock {wf_name}*{mention}",
              f"*Status:* {status}  |  *Duration:* {dur}",
              f"*Branch:* `{branch}`  |  *Test class:* `{test_cls}`",
              f"*Config:* NDCS={ndcs} NPCS={npcs} BS={bs} ChunkBS={chunk_bs}",
              "",
          ]

          if total > 0:
              lines += [
                  f":white_check_mark: *Passed:*  {passed}/{total}  ({pass_pct}%)",
                  f":x: *Failed:*  {failed}",
                  f":fast_forward: *Skipped:*  {skipped}",
              ]
          else:
              lines.append("_(test counts not found in log)_")

          if test_results:
              lines.append("")
              lines.append("*Test Results:*")
              icons = {'PASSED': ':white_check_mark:', 'FAILED': ':x:', 'SKIPPED': ':fast_forward:'}
              for st, nm in test_results:
                  lines.append(f"{icons.get(st, ':grey_question:')} `{nm}`")

          if failure_reason:
              lines += ["", "*Failure:*", f"```{failure_reason}```"]

          lines += [
              "",
              f":link: *Run:* <{run_url}|View on GitHub>",
          ]

          # --- Send ---
          gh_env = os.environ.get("GITHUB_ENV", "")
          text   = "\n".join(lines)

          if bot_token and channel:
              api_payload = json.dumps({"channel": channel, "text": text}).encode()
              req = urllib.request.Request(
                  "https://slack.com/api/chat.postMessage",
                  data=api_payload,
                  headers={
                      "Content-Type": "application/json; charset=utf-8",
                      "Authorization": f"Bearer {bot_token}",
                  },
              )
              try:
                  resp = urllib.request.urlopen(req, timeout=15)
                  body = json.loads(resp.read().decode())
                  if body.get("ok"):
                      ts = body.get("ts", "")
                      print(f"Slack notification sent via Bot API (ts={ts}).")
                      if gh_env and ts:
                          with open(gh_env, "a") as f:
                              f.write(f"SLACK_MSG_TS={ts}\n")
                  else:
                      print(f"WARN: Slack API error: {body.get('error')}", file=sys.stderr)
              except Exception as exc:
                  print(f"WARN: Slack Bot API failed: {exc}", file=sys.stderr)
          elif webhook:
              req = urllib.request.Request(
                  webhook,
                  data=json.dumps({"text": text}).encode(),
                  headers={"Content-Type": "application/json"},
              )
              try:
                  urllib.request.urlopen(req, timeout=15)
                  print("Slack notification sent via webhook (no thread support).")
              except Exception as exc:
                  print(f"WARN: Slack webhook failed: {exc}", file=sys.stderr)
          else:
              print("No SLACK_BOT_TOKEN or SLACK_WEBHOOK_URL set, skipping.")
          PYEOF


      - name: Upload automation and docker logs to s3
        run: |
          cd $GITHUB_WORKSPACE/e2e/logs
          ./upload_logs.sh
          cd $GITHUB_WORKSPACE/simplyBlockDeploy
          ./upload_docker_logs_to_s3.sh --k8s --namespace "spdk-csi"
        if: always()
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          S3_BUCKET_NAME: "simplyblock-e2e-test-logs"
          RUN_ID: ${{ github.run_id }}
      - name: Collect Graylog/OpenSearch logs
        if: '!cancelled()'
        timeout-minutes: 60
        run: |
          set +e
          echo "=== Collecting Graylog/OpenSearch logs ==="

          MGMT_IP="${{ steps.terraform_outputs.outputs.mgmt_private_ip }}"
          BASTION_IP="${{ steps.terraform_outputs.outputs.bastion_public_ip }}"
          KEY_NAME="${{ steps.terraform_outputs.outputs.key_name }}"
          CLUSTER_ID="${{ steps.bootstrap_cluster.outputs.cluster_id }}"

          if [ -z "${MGMT_IP}" ] || [ -z "${BASTION_IP}" ]; then
            echo "WARN: MGMT_IP or BASTION_IP not available, skipping"
            exit 0
          fi
          if [ -z "${TEST_START_TIME:-}" ] || [ -z "${TEST_END_TIME:-}" ]; then
            echo "WARN: TEST_START_TIME or TEST_END_TIME not set, skipping"
            exit 0
          fi

          ELAPSED=$((TEST_END_TIME - TEST_START_TIME))
          [ "${ELAPSED}" -le 0 ] && exit 0

          SSH_OPTS=(-i "$HOME/.ssh/${KEY_NAME}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=10)
          PROXY_CMD="ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i $HOME/.ssh/${KEY_NAME} -W %h:%p ec2-user@${BASTION_IP}"
          SSH_CMD=(ssh "${SSH_OPTS[@]}" -o "ProxyCommand=${PROXY_CMD}" "ec2-user@${MGMT_IP}")

          WINDOW_START=$((TEST_START_TIME - 3600))
          WINDOW_END=$((TEST_END_TIME + 3600))

          OUTPUT_DIR="$GITHUB_WORKSPACE/e2e/logs/graylog_collected"
          mkdir -p "${OUTPUT_DIR}" 2>/dev/null || true

          epoch_to_iso() {
            python3 -c "from datetime import datetime,timezone; print(datetime.fromtimestamp($1,tz=timezone.utc).strftime('%Y-%m-%dT%H:%M:%S'))"
          }

          _CHUNK_STARTS=()
          _C=${WINDOW_START}
          while [ ${_C} -lt ${WINDOW_END} ]; do
            _CHUNK_STARTS+=(${_C})
            _C=$((_C + 3600))
          done
          NUM_CHUNKS=${#_CHUNK_STARTS[@]}

          run_collect() {
            local iso=$1 mins=$2 outdir=$3 extra_flag=${4:-}
            "${SSH_CMD[@]}" \
              "python3 -m simplyblock_core.scripts.collect_logs \
                '${iso}' '${mins}' \
                --mode docker \
                --output-dir '${outdir}' \
                ${extra_flag} \
                ${CLUSTER_ID:+--cluster-id '${CLUSTER_ID}'}" \
            2>&1
            local rc=$?
            [ $rc -ne 0 ] && return $rc
            local has_content
            has_content=$("${SSH_CMD[@]}" "find '${outdir}' -name '*.tar.gz' -size +0 2>/dev/null | head -1")
            [ -z "${has_content}" ] && return 1
          }

          collect_adaptive() {
            local start_epoch=$1 end_epoch=$2 outdir=$3 extra_flag=${4:-}
            local duration=$((end_epoch - start_epoch))
            local mins=$(( (duration + 59) / 60 ))
            local iso=$(epoch_to_iso ${start_epoch})
            if run_collect "${iso}" "${mins}" "${outdir}" "${extra_flag}"; then
              return 0
            fi
            echo "  WARN: ${mins}m window failed, retrying with 5-min sub-windows..."
            local sub_start=${start_epoch}
            while [ ${sub_start} -lt ${end_epoch} ]; do
              local sub_end=$((sub_start + 300))
              [ ${sub_end} -gt ${end_epoch} ] && sub_end=${end_epoch}
              local sub_mins=$(( ((sub_end - sub_start) + 59) / 60 ))
              local sub_iso=$(epoch_to_iso ${sub_start})
              run_collect "${sub_iso}" "${sub_mins}" "${outdir}" "${extra_flag}" || \
                echo "  WARN: 5-min sub-window at ${sub_iso} failed"
              sub_start=${sub_end}
            done
          }

          SCP_OPTS=(-i "$HOME/.ssh/${KEY_NAME}" -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o "ProxyCommand=${PROXY_CMD}")

          PREFER_OPENSEARCH=""
          CHUNK=0
          for (( _IDX=NUM_CHUNKS-1; _IDX>=0; _IDX-- )); do
            CHUNK=$((CHUNK + 1))
            CHUNK_START=${_CHUNK_STARTS[$_IDX]}
            CHUNK_END=$((CHUNK_START + 3600))
            [ ${CHUNK_END} -gt ${WINDOW_END} ] && CHUNK_END=${WINDOW_END}
            CHUNK_MINUTES=$(( ((CHUNK_END - CHUNK_START) + 59) / 60 ))
            CHUNK_ISO=$(epoch_to_iso ${CHUNK_START})
            echo "--- Chunk ${CHUNK}/${NUM_CHUNKS}: ${CHUNK_ISO} for ${CHUNK_MINUTES}m ---"

            REMOTE_DIR="/tmp/graylog_collect_chunk${CHUNK}"
            "${SSH_CMD[@]}" "mkdir -p '${REMOTE_DIR}'" 2>/dev/null || true

            if [ -z "${PREFER_OPENSEARCH}" ]; then
              if run_collect "${CHUNK_ISO}" "${CHUNK_MINUTES}" "${REMOTE_DIR}" "--use-opensearch"; then
                PREFER_OPENSEARCH=true
                echo "  OpenSearch works — using it for all chunks"
              else
                PREFER_OPENSEARCH=false
                echo "  OpenSearch unavailable — using Graylog"
                "${SSH_CMD[@]}" "rm -rf '${REMOTE_DIR}'; mkdir -p '${REMOTE_DIR}'" 2>/dev/null || true
                collect_adaptive ${CHUNK_START} ${CHUNK_END} "${REMOTE_DIR}" || true
              fi
            elif [ "${PREFER_OPENSEARCH}" = "true" ]; then
              collect_adaptive ${CHUNK_START} ${CHUNK_END} "${REMOTE_DIR}" "--use-opensearch" || \
                collect_adaptive ${CHUNK_START} ${CHUNK_END} "${REMOTE_DIR}" || true
            else
              collect_adaptive ${CHUNK_START} ${CHUNK_END} "${REMOTE_DIR}" || \
                collect_adaptive ${CHUNK_START} ${CHUNK_END} "${REMOTE_DIR}" "--use-opensearch" || true
            fi

            TARBALLS=$("${SSH_CMD[@]}" "find '${REMOTE_DIR}' -name '*.tar.gz' -type f 2>/dev/null") || true
            if [ -n "${TARBALLS}" ]; then
              for TB in ${TARBALLS}; do
                scp "${SCP_OPTS[@]}" "ec2-user@${MGMT_IP}:${TB}" "${OUTPUT_DIR}/$(basename ${TB})" 2>&1 || true
              done
              for TB_FILE in "${OUTPUT_DIR}"/*.tar.gz; do
                [ -f "${TB_FILE}" ] && tar -xzf "${TB_FILE}" -C "${OUTPUT_DIR}/" 2>/dev/null || true
              done
            fi
            "${SSH_CMD[@]}" "rm -rf '${REMOTE_DIR}'" 2>/dev/null || true
          done
          echo "=== Log collection complete (${CHUNK} chunks): ${OUTPUT_DIR} ==="

      - name: Notify Slack log collection complete
        if: always() && (github.event_name == 'schedule' || env.send_slack_notification == 'true')
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_MSG_TS: ${{ env.SLACK_MSG_TS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SLACK_WF_NAME: "K8s E2E HA"
        run: |
          MSG=":white_check_mark: *Log collection complete* for *SimplyBlock ${SLACK_WF_NAME}*\n:link: <${SLACK_RUN_URL}|View Run>"
          if [ -n "${SLACK_BOT_TOKEN:-}" ] && [ -n "${SLACK_CHANNEL_ID:-}" ] && [ -n "${SLACK_MSG_TS:-}" ]; then
            curl -s -X POST "https://slack.com/api/chat.postMessage" \
              -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "{\"channel\":\"${SLACK_CHANNEL_ID}\",\"thread_ts\":\"${SLACK_MSG_TS}\",\"text\":\"${MSG}\"}" || true
          elif [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            curl -s -X POST "${SLACK_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"${MSG}\"}" || true
          fi

      - name: Destroy Cluster
        if: always()
        run: |
          cd $GITHUB_WORKSPACE/simplyBlockDeploy
          terraform destroy --auto-approve

      - name: Cleanup build folder
        run: |
          ls -la ./
          rm -rf ./* || true
          rm -rf ./.??* || true
          ls -la ./
          rm -f "$HOME/.kube/config-${{ github.run_id }}"
