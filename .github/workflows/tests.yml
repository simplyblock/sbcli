name: Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main
      - R26.2-PRE
      - R26.3-PRE

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install tox
        run: pip install tox
      - name: Run unit tests
        run: tox run -e unit
        env:
          PYTEST_ADDOPTS: -v

  integration:
    name: Integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install FoundationDB client library
        run: |
          curl -fsSL https://github.com/apple/foundationdb/releases/download/7.3.63/foundationdb-clients_7.3.63-1_amd64.deb -o /tmp/fdb-clients.deb
          sudo dpkg -i /tmp/fdb-clients.deb
      - name: Install tox
        run: pip install tox
      - name: Run integration tests
        run: tox run -e integration
        env:
          PYTEST_ADDOPTS: -v

  integration-slow:
    name: Integration tests (slow)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install FoundationDB client library
        run: |
          curl -fsSL https://github.com/apple/foundationdb/releases/download/7.3.63/foundationdb-clients_7.3.63-1_amd64.deb -o /tmp/fdb-clients.deb
          sudo dpkg -i /tmp/fdb-clients.deb
      - name: Install tox
        run: pip install tox
      - name: Run slow integration tests
        run: tox run -e integration-slow
        env:
          PYTEST_ADDOPTS: -v
