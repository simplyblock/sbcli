name: Release

on:
  release:
    types: [created]

jobs:
  # Single source of truth for the release identifier: the PyPI version and
  # every published image tag are derived from this job's output, so they
  # can't drift apart the way they could when each publish job re-derived it
  # independently.
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
    steps:
      - name: Resolve release identifier
        id: resolve
        env:
          tag: ${{ github.event.release.tag_name }}
        run: |
          # Published as both the PyPI version and every image tag, so a
          # shape nothing downstream can parse must fail here rather than
          # publish. The trailing "(.<hotfix>)?" on the suffix mirrors the
          # hotfix-on-prerelease shape _to_pep440() in simplyblock_core/
          # _version.py normalizes for PyPI (e.g. 26.4.0-beta6.1) -- keep
          # the two in sync if either grows a new shape.
          if [[ ! "$tag" =~ ^[0-9]+(\.[0-9]+){1,3}(-[A-Za-z0-9]+(\.[0-9]+)?)?$ ]]; then
            echo "Release tag '$tag' does not match <major>.<minor>[.<patch>[.<hotfix>]][-<suffix>[.<hotfix>]]." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(echo "$GITHUB_SHA" | head -c 8)" >> "$GITHUB_OUTPUT"

  get_spdk_hash:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      short_sha: ${{ steps.get_current_hash.outputs.short_sha }}
    steps:
    - name: Checkout repository at specified branch
      uses: actions/checkout@v4
      with:
        repository: simplyblock-io/ultra
        ref: R25.6-Hotfix
        fetch-depth: 1
        token: ${{ secrets.GH_ACCESS_KEY_ID_MANOHAR }}
    - name: Get short commit hash
      id: get_current_hash
      run: |
        SHORT_SHA=$(git rev-parse --short=8 HEAD)
        echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
      shell: bash

  publish-pypi:
    needs: [resolve, get_spdk_hash]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # actions/setup-python requires a prebuilt interpreter for the exact
      # (python-version, runner-OS) pair from GitHub's manifest; those get
      # dropped once a runner image ages out (e.g. no 3.9 build for
      # ubuntu-latest once it moved to 26.04 -- see the 26.3.4 release
      # failure). uv provisions its own interpreters from
      # python-build-standalone, independent of the runner OS, so pin uv
      # instead of a Python version here.
      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install build tooling
        run: uv tool install tox --with tox-uv

      - name: Checking cli.py status
        run: |
          tox run -e generate
          changes="$(git diff simplyblock_cli/cli.py)"
          if [[ "${changes}" ]]; then
            echo "cli.py has changed after regeneration. Stopping."
            echo "${changes}"
            exit 1
          fi

      - name: Update simplyblock_core/env_var
        run: |
          sed -i 's/sbcli-dev/sbctl/g' simplyblock_core/env_var

          echo "Replacing SIMPLY_BLOCK_VERSION with $version"
          sed -i "s|^SIMPLY_BLOCK_VERSION=.*|SIMPLY_BLOCK_VERSION=${version}|" simplyblock_core/env_var

          echo "Replacing SIMPLY_BLOCK_DOCKER_IMAGE with $version"
          sed -i "s|^SIMPLY_BLOCK_DOCKER_IMAGE=.*|SIMPLY_BLOCK_DOCKER_IMAGE=simplyblock/simplyblock:${version}|" simplyblock_core/env_var

          #echo "Replacing SIMPLY_BLOCK_SPDK_ULTRA_IMAGE with R25.6-Hotfix-$spdk_tag"
          #sed -i "s|^SIMPLY_BLOCK_SPDK_ULTRA_IMAGE=.*|SIMPLY_BLOCK_SPDK_ULTRA_IMAGE=simplyblock/spdk:R25.6-Hotfix-${spdk_tag}|" simplyblock_core/env_var

          echo "----- Updated env_var -----"
          cat simplyblock_core/env_var
        env:
          version: ${{ needs.resolve.outputs.tag }}
          spdk_tag: ${{ needs.get_spdk_hash.outputs.short_sha }}

      # sdist + wheel. `sbctl` is the distribution name in pyproject.toml now;
      # the sed above no longer affects it, but SIMPLY_BLOCK_VERSION still drives
      # the version (via simplyblock_core/_version.py) and
      # SIMPLY_BLOCK_COMMAND_NAME is still read at runtime.
      - name: Build package
        run: uv build

      - name: Publish package to pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  # Releases publish to every public registry plus the internal one, so the
  # internal registry always carries a copy of what shipped.
  publish-image:
    needs: resolve
    uses: ./.github/workflows/_build_image.yml
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      short_sha: ${{ needs.resolve.outputs.short_sha }}
      push_dockerhub: true
      push_ecr: true
      push_quay: true
      push_internal: true
    secrets: inherit
