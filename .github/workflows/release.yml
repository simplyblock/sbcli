name: Release

on:
  release:
    types: [created]

env:
  IMAGE_NAME: simplyblock/simplyblock
  ECR_IMAGE_NAME: public.ecr.aws/simply-block/simplyblock
  QUAY_IMAGE_NAME: quay.io/simplyblock-io/simplyblock

jobs:
  # Single source of truth for the release identifier: the PyPI version and
  # every published image tag are derived from this job's output, so they
  # can't drift apart the way they could when each publish job re-derived it
  # independently.
  resolve:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      short_sha: ${{ steps.resolve.outputs.short_sha }}
    steps:
      - name: Resolve release identifier
        id: resolve
        env:
          tag: ${{ github.event.release.tag_name }}
        run: |
          # Published as both the PyPI version and every image tag, so a
          # shape nothing downstream can parse must fail here rather than
          # publish.
          if [[ ! "$tag" =~ ^[0-9]+(\.[0-9]+){1,3}(-[A-Za-z0-9]+)?$ ]]; then
            echo "Release tag '$tag' does not match <major>.<minor>[.<patch>[.<hotfix>]][-<suffix>]." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "short_sha=$(echo "$GITHUB_SHA" | head -c 8)" >> "$GITHUB_OUTPUT"

  get_spdk_hash:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      short_sha: ${{ steps.get_current_hash.outputs.short_sha }}
    steps:
    - name: Checkout repository at specified branch
      uses: actions/checkout@v4
      with:
        repository: simplyblock-io/ultra
        ref: R25.6-Hotfix
        fetch-depth: 1
        token: ${{ secrets.GH_ACCESS_KEY_ID_MANOHAR }}
    - name: Get short commit hash
      id: get_current_hash
      run: |
        SHORT_SHA=$(git rev-parse --short=8 HEAD)
        echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
      shell: bash

  publish-pypi:
    needs: [resolve, get_spdk_hash]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'

      - name: Install build tooling
        run: pip install uv tox tox-uv

      - name: Checking cli.py status
        run: |
          tox run -e generate
          changes="$(git diff simplyblock_cli/cli.py)"
          if [[ "${changes}" ]]; then
            echo "cli.py has changed after regeneration. Stopping."
            echo "${changes}"
            exit 1
          fi

      - name: Update simplyblock_core/env_var
        run: |
          sed -i 's/sbcli-dev/sbctl/g' simplyblock_core/env_var

          echo "Replacing SIMPLY_BLOCK_VERSION with $version"
          sed -i "s|^SIMPLY_BLOCK_VERSION=.*|SIMPLY_BLOCK_VERSION=${version}|" simplyblock_core/env_var

          echo "Replacing SIMPLY_BLOCK_DOCKER_IMAGE with $version"
          sed -i "s|^SIMPLY_BLOCK_DOCKER_IMAGE=.*|SIMPLY_BLOCK_DOCKER_IMAGE=simplyblock/simplyblock:${version}|" simplyblock_core/env_var

          #echo "Replacing SIMPLY_BLOCK_SPDK_ULTRA_IMAGE with R25.6-Hotfix-$spdk_tag"
          #sed -i "s|^SIMPLY_BLOCK_SPDK_ULTRA_IMAGE=.*|SIMPLY_BLOCK_SPDK_ULTRA_IMAGE=simplyblock/spdk:R25.6-Hotfix-${spdk_tag}|" simplyblock_core/env_var

          echo "----- Updated env_var -----"
          cat simplyblock_core/env_var
        env:
          version: ${{ needs.resolve.outputs.tag }}
          spdk_tag: ${{ needs.get_spdk_hash.outputs.short_sha }}

      # sdist + wheel. `sbctl` is the distribution name in pyproject.toml now;
      # the sed above no longer affects it, but SIMPLY_BLOCK_VERSION still drives
      # the version (via simplyblock_core/_version.py) and
      # SIMPLY_BLOCK_COMMAND_NAME is still read at runtime.
      - name: Build package
        run: uv build

      - name: Publish package to pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-image:
    needs: resolve
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      TAG: ${{ needs.resolve.outputs.tag }}
      SHORT_SHA: ${{ needs.resolve.outputs.short_sha }}
    steps:
    - uses: actions/checkout@v7

    # UTC date, so the OS-package layers are rebuilt from scratch once a day
    # and an upstream security fix reaches the image within 24 hours.
    - name: Set base layer cache key
      run: echo "CACHE_KEY=$(date -u +%F)" >> $GITHUB_ENV

    - name: Login to Quay.io
      uses: docker/login-action@v4
      with:
        username:  ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_PASSWORD }}
        registry: quay.io

    - name: Login to Docker Hub
      uses: docker/login-action@v4
      with:
        username: hamdysimplyblock
        password: ${{ secrets.DOCKER_PASS }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_HAMDI }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_HAMDI }}
        aws-region: us-east-1

    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registry-type: public

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ env.IMAGE_NAME }}
          ${{ env.ECR_IMAGE_NAME }}
          ${{ env.QUAY_IMAGE_NAME }}
        tags: |
          type=raw,value=${{ env.TAG }}
          type=raw,value=${{ env.TAG }}-${{ env.SHORT_SHA }}

    # One build, fanned out to every registry — the image is identical across
    # them, so building it once per registry only burns runner time.
    - name: Build & Push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: CACHE_KEY=${{ env.CACHE_KEY }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Report published tags
      run: |
        echo "::notice title=Docker.com::$IMAGE_NAME:$TAG"
        echo "::notice title=AWS-ECR::$ECR_IMAGE_NAME:$TAG"
        echo "::notice title=Quay.io::$QUAY_IMAGE_NAME:$TAG"
