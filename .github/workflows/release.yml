name: Release
on:
  release:
    types: [created]
env:
  IMAGE_NAME: simplyblock/simplyblock
  ECR_IMAGE_NAME: public.ecr.aws/simply-block/simplyblock
  QUAY_IMAGE_NAME: quay.io/simplyblock-io/simplyblock
jobs:
  get_spdk_hash:
    runs-on: ubuntu-latest
    outputs:
      short_sha: ${{ steps.get_current_hash.outputs.short_sha }}
    steps:
    - name: Checkout repository at specified branch
      uses: actions/checkout@v4
      with:
        repository: simplyblock-io/ultra
        ref: R25.6-Hotfix
        fetch-depth: 1
        token: ${{ secrets.GH_ACCESS_KEY_ID_MANOHAR }}
    - name: Get short commit hash
      id: get_current_hash
      run: |
        SHORT_SHA=$(git rev-parse --short=8 HEAD)
        echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
      shell: bash

  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel twine build tox

      - name: Checking cli.py status
        run: |
          tox run -e generate
          changes="$(git diff simplyblock_cli/cli.py)"
          if [[ "${changes}" ]]; then
            echo "cli.py has changed after regeneration. Stopping."
            echo "${changes}"
            exit 1
          fi

      - name: Update simplyblock_core/env_var
        run: |
          sed -i 's/sbcli-dev/sbctl/g' simplyblock_core/env_var

          echo "Replacing SIMPLY_BLOCK_VERSION with $version"
          sed -i "s|^SIMPLY_BLOCK_VERSION=.*|SIMPLY_BLOCK_VERSION=${version}|" simplyblock_core/env_var

          echo "Replacing SIMPLY_BLOCK_DOCKER_IMAGE with $version"
          sed -i "s|^SIMPLY_BLOCK_DOCKER_IMAGE=.*|SIMPLY_BLOCK_DOCKER_IMAGE=simplyblock/simplyblock:${version}|" simplyblock_core/env_var

          #echo "Replacing SIMPLY_BLOCK_SPDK_ULTRA_IMAGE with R25.6-Hotfix-$spdk_tag"
          #sed -i "s|^SIMPLY_BLOCK_SPDK_ULTRA_IMAGE=.*|SIMPLY_BLOCK_SPDK_ULTRA_IMAGE=simplyblock/spdk:R25.6-Hotfix-${spdk_tag}|" simplyblock_core/env_var

          echo "----- Updated env_var -----"
          cat simplyblock_core/env_var
        env:
          version: ${{ github.event.release.tag_name }}
          spdk_tag: ${{ needs.get_spdk_hash.outputs.short_sha }}

      - name: Build package
        run: python setup.py sdist

      - name: Publish package to pypi
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

  publish-image:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name }}
    steps:
    - uses: actions/checkout@v4

    - name: Set short SHA
      run: echo "SHORT_SHA=$(echo $GITHUB_SHA | head -c 8)" >> "$GITHUB_ENV"

    - name: Login to Quay.io
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_PASSWORD }}
        registry: quay.io

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: hamdysimplyblock
        password: ${{ secrets.DOCKER_PASS }}

    - name: Configure AWS Credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_HAMDI }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_HAMDI }}
        aws-region: us-east-1

    - name: Login to ECR
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registry-type: public

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: |
          ${{ env.IMAGE_NAME }}
          ${{ env.ECR_IMAGE_NAME }}
          ${{ env.QUAY_IMAGE_NAME }}
        tags: |
          type=raw,value=${{ env.TAG }}
          type=raw,value=${{ env.TAG }}-${{ env.SHORT_SHA }}

    - name: Build & Push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Report published tags
      run: |
        echo "::notice title=Docker.com::$IMAGE_NAME:$TAG"
        echo "::notice title=AWS-ECR::$ECR_IMAGE_NAME:$TAG"
        echo "::notice title=Quay.io::$QUAY_IMAGE_NAME:$TAG"
