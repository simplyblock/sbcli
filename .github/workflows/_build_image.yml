name: Build Image

# Reusable: builds and pushes the control-plane image to whichever
# registries the caller toggles on. docker-image.yml (push trigger) enables
# Docker Hub, ECR and the internal registry, same as before this workflow was
# extracted; release.yml enables Docker Hub, ECR, Quay and the internal
# registry, so the internal registry also gets a copy of every released
# image.

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      short_sha:
        required: true
        type: string
      push_dockerhub:
        required: false
        type: boolean
        default: false
      push_ecr:
        required: false
        type: boolean
        default: false
      push_quay:
        required: false
        type: boolean
        default: false
      push_internal:
        required: false
        type: boolean
        default: false
    secrets:
      DOCKER_PASS:
        required: false
      AWS_ACCESS_KEY_ID_HAMDI:
        required: false
      AWS_SECRET_ACCESS_KEY_HAMDI:
        required: false
      QUAY_USERNAME:
        required: false
      QUAY_PASSWORD:
        required: false
      INTERNAL_USERNAME:
        required: false
      INTERNAL_PASSWORD:
        required: false

env:
  IMAGE_NAME: simplyblock/simplyblock
  ECR_IMAGE_NAME: public.ecr.aws/simply-block/simplyblock
  QUAY_IMAGE_NAME: quay.io/simplyblock-io/simplyblock
  INTERNAL_IMAGE_NAME: registry.simplyblock.ai/simplyblock/simplyblock

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@v7

    # UTC date, so the OS-package layers are rebuilt from scratch once a day
    # and an upstream security fix reaches the image within 24 hours.
    - name: Set base layer cache key
      run: echo "CACHE_KEY=$(date -u +%F)" >> $GITHUB_ENV

    - name: Login to Docker Hub
      if: inputs.push_dockerhub
      uses: docker/login-action@v4
      with:
        username: hamdysimplyblock
        password: ${{ secrets.DOCKER_PASS }}

    - name: Login to Quay.io
      if: inputs.push_quay
      uses: docker/login-action@v4
      with:
        username: ${{ secrets.QUAY_USERNAME }}
        password: ${{ secrets.QUAY_PASSWORD }}
        registry: quay.io

    - name: Login to Internal Registry
      if: inputs.push_internal
      uses: docker/login-action@v4
      with:
        registry: registry.simplyblock.ai
        username: ${{ secrets.INTERNAL_USERNAME }}
        password: ${{ secrets.INTERNAL_PASSWORD }}

    - name: Configure AWS Credentials
      if: inputs.push_ecr
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID_HAMDI }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY_HAMDI }}
        aws-region: us-east-1

    - name: Login to ECR
      if: inputs.push_ecr
      id: login-ecr
      uses: aws-actions/amazon-ecr-login@v2
      with:
        registry-type: public

    - name: Set up QEMU
      uses: docker/setup-qemu-action@v3

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v3

    # metadata-action takes one newline-separated image list; which image
    # names are in it is the only thing that varies between callers.
    - name: Collect target image names
      id: images
      run: |
        {
          echo "list<<IMAGE_LIST_EOF"
          if [[ "${{ inputs.push_dockerhub }}" == "true" ]]; then
            echo "${{ env.IMAGE_NAME }}"
          fi
          if [[ "${{ inputs.push_ecr }}" == "true" ]]; then
            echo "${{ env.ECR_IMAGE_NAME }}"
          fi
          if [[ "${{ inputs.push_quay }}" == "true" ]]; then
            echo "${{ env.QUAY_IMAGE_NAME }}"
          fi
          if [[ "${{ inputs.push_internal }}" == "true" ]]; then
            echo "${{ env.INTERNAL_IMAGE_NAME }}"
          fi
          echo "IMAGE_LIST_EOF"
        } >> "$GITHUB_OUTPUT"

    - name: Extract metadata
      id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ steps.images.outputs.list }}
        tags: |
          type=raw,value=${{ inputs.tag }}
          type=raw,value=${{ inputs.tag }}-${{ inputs.short_sha }}

    - name: Build & Push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: docker/Dockerfile
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        build-args: CACHE_KEY=${{ env.CACHE_KEY }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

    - name: Report published tags
      run: |
        if [[ "${{ inputs.push_dockerhub }}" == "true" ]]; then
          echo "::notice title=Docker.com::${{ env.IMAGE_NAME }}:${{ inputs.tag }}"
        fi
        if [[ "${{ inputs.push_ecr }}" == "true" ]]; then
          echo "::notice title=AWS-ECR::${{ env.ECR_IMAGE_NAME }}:${{ inputs.tag }}"
        fi
        if [[ "${{ inputs.push_quay }}" == "true" ]]; then
          echo "::notice title=Quay.io::${{ env.QUAY_IMAGE_NAME }}:${{ inputs.tag }}"
        fi
        if [[ "${{ inputs.push_internal }}" == "true" ]]; then
          echo "::notice title=Internal::${{ env.INTERNAL_IMAGE_NAME }}:${{ inputs.tag }}"
        fi
