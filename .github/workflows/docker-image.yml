name: Docker Image Build

on:
  workflow_dispatch:
  push:
    branches:
      - '**'

jobs:

  resolve:
    runs-on: ubuntu-latest
    permissions: {}
    outputs:
      tag: ${{ steps.get_info.outputs.tag }}
      short_sha: ${{ steps.get_info.outputs.short_sha }}
    steps:
    - name: Set docker image tag
      id: get_info
      run: |
        if [[ "${{github.ref}}" == refs/pull/* ]]; then
          tag=${GITHUB_REF/\/merge/}
          tag=$(echo pr-${tag:10})
        else
          tag=$(echo ${GITHUB_REF#refs/*/} | sed 's/\//-/g')
        fi
        sha=$([ -z '${{ github.event.pull_request.head.sha }}' ] && echo $GITHUB_SHA || echo '${{ github.event.pull_request.head.sha }}')
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
        echo "short_sha=$(echo $sha | head -c 8)" >> "$GITHUB_OUTPUT"

  build:
    needs: resolve
    uses: ./.github/workflows/_build_image.yml
    permissions:
      contents: read
    with:
      tag: ${{ needs.resolve.outputs.tag }}
      short_sha: ${{ needs.resolve.outputs.short_sha }}
      push_dockerhub: true
      push_ecr: true
      push_internal: true
    secrets: inherit
