name: K8s Native Stress Tests
run-name: "K8s Native Stress Tests | ${{ inputs.testname || 'K8sNativeFailoverTest' }} | ${{ inputs.cluster_environment || 'local' }} | ${{ inputs.cluster_params || 'ndcs=2,npcs=2,bs=4096,chunk_bs=4096,partitions=1,jm_count=4,vcpu_count=0' }}"

on:
  workflow_dispatch:
    inputs:
      operator_repo_branch:
        description: 'Branch for simplyblock-operator repo'
        required: true
        default: 'main'
      simplyblock_image:
        description: 'Simplyblock image tag'
        required: true
        default: 'main'
      simplyblock_repository:
        description: 'Simplyblock image repository'
        required: false
        default: 'public.ecr.aws/simply-block/simplyblock'
      operator_repository:
        description: 'Operator image repository'
        required: false
        default: 'simplyblock/simplyblock-operator'
      operator_tag:
        description: 'Operator image tag'
        required: false
        default: 'main'
      csi_repository:
        description: 'CSI driver image repository (leave empty for chart default)'
        required: false
        default: 'simplyblock/spdkcsi'
      csi_tag:
        description: 'CSI driver image tag (leave empty for chart default)'
        required: false
        default: 'latest'
      spdk_image:
        description: 'SPDK container image'
        required: true
        default: 'simplyblock/spdk:main-latest'
      worker_nodes:
        description: 'Comma-separated K8s worker node names'
        required: true
        default: 'worker-0.ocp.simplyblock.ai,worker-1.ocp.simplyblock.ai,worker-2.ocp.simplyblock.ai,worker-3.ocp.simplyblock.ai,worker-4.ocp.simplyblock.ai,worker-5.ocp.simplyblock.ai'
      ifc_names:
        description: 'Network interfaces (mgmt_ifc:data_nics)'
        required: false
        default: 'br-ex:enp2s0f0'
      max_subsys:
        description: 'Max logical volume count per storage node'
        required: false
        default: '30'
      ssh_user:
        description: 'SSH user for client nodes'
        required: false
        default: 'root'
      key_path:
        description: "SSH private key path on runner (default: /home/ec2-user/.ssh/simplyblock-us-east-2.pem)"
        required: true
        default: "/home/ec2-user/.ssh/simplyblock-us-east-2.pem"
      client_ips:
        description: 'Space-separated client IPs for external FIO (empty = FIO runs as K8s Jobs)'
        required: false
        default: ''
      nfs_mountpoint:
        description: 'NFS mountpoint on client nodes'
        required: false
        default: '/mnt/nfs_share/'
      testname:
        description: 'Test to run'
        required: false
        default: 'K8sNativeFailoverTest'
      send_slack_notification:
        description: 'Send Slack notification?'
        required: false
        default: true
        type: boolean
      cluster_params:
        description: 'Cluster config. vcpu_count=0 derives vcpuCount from the node CPU count; any other value is used as-is'
        required: false
        default: 'ndcs=2,npcs=2,bs=4096,chunk_bs=4096,partitions=1,jm_count=4,vcpu_count=0'
      cluster_environment:
        description: 'Target cluster environment'
        required: true
        default: 'openshift-baremetal'
        type: choice
        options:
          - local
          - aws-openshift
          - openshift-local
          - openshift-baremetal
          - gcp
      skip_nfs:
        description: 'Skip NFS mounting (use local logs directory instead)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      test_case:
        description: 'Case id for matrix tests (--case), e.g. dual_graceful_shutdown_with_container_stop_secondary_await_migration_allpaths. Leave empty for non-matrix tests.'
        required: false
        default: ''

      resume:
        description: 'Continue the previous run on this cluster instead of wiping its objects. Requires use_existing_cluster=true, since recreating the setup destroys exactly what resume would adopt.'
        required: false
        type: boolean
        default: false

      use_existing_cluster:
        description: 'Skip cluster cleanup and setup, reuse existing cluster'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      preserve_resources_on_failure:
        description: 'Preserve PVCs, FIO pods, snapshots on test failure for debugging'
        required: false
        default: true
        type: boolean
      cluster_security:
        description: "Cluster setup mode. 'backup' deploys MinIO and enables backup on StorageCluster. Auto-enabled when testname contains 'backup'."
        required: false
        type: choice
        default: "none"
        options:
          - none
          - backup

jobs:
  stress-test:
    runs-on: ${{ github.event.inputs.cluster_environment == 'aws-openshift' && 'vm-runner-43' || 'self-hosted' }}
    timeout-minutes: 4320
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.inputs.cluster_environment || 'local' }}
      cancel-in-progress: false
    env:
      TESTNAME: ${{ github.event.inputs.testname || 'K8sNativeFailoverTest' }}
      KEY_PATH: ${{ github.event.inputs.key_path || '/home/ec2-user/.ssh/simplyblock-us-east-2.pem' }}
      CLIENT_IPS: ${{ github.event.inputs.client_ips || '' }}
      NFS_MOUNTPOINT: ${{ github.event.inputs.nfs_mountpoint || '/mnt/nfs_share/' }}
      SSH_USER: ${{ github.event.inputs.ssh_user || 'root' }}
      SSH_PASSWORD: ${{ secrets.SSH_PASSWORD }}
    steps:
      - name: Fix workspace permissions and reset a dirty tree
        run: |
          # Errors are NOT swallowed here. The previous version ended every
          # command with "2>/dev/null || true", so a chown that failed on
          # root-owned files looked identical to one that worked -- and the
          # reset that followed could not rewrite those files either, printed
          # its complaint to the discarded stderr, and still logged
          # "HEAD is now at ...". The run then failed in an unrelated step.
          sudo chown -R "$(id -u):$(id -g)" "$GITHUB_WORKSPACE"             || echo "::warning::chown of the workspace failed"

          if [ -d "$GITHUB_WORKSPACE/.git" ]; then
            git -C "$GITHUB_WORKSPACE" reset --hard               || echo "::warning::git reset --hard failed"
            git -C "$GITHUB_WORKSPACE" clean -ffdx               || echo "::warning::git clean -ffdx failed"

            # If anything survives that, git cannot reconcile this tree and
            # actions/checkout will not either: it reports
            #   "error: Path 'x' not uptodate; will not remove from working tree"
            # and STILL EXITS 0, leaving HEAD on the new ref with files from it
            # never written. Wipe instead and let checkout clone fresh -- the
            # fetch is --depth=1, so this costs seconds.
            dirty="$(git -C "$GITHUB_WORKSPACE" status --porcelain 2>/dev/null)"
            if [ -n "${dirty}" ]; then
              echo "::warning::workspace still dirty after reset; wiping it"
              echo "${dirty}" | head -20
              sudo rm -rf "$GITHUB_WORKSPACE"/* "$GITHUB_WORKSPACE"/.[!.]* || true
            fi
          fi

      - name: Checkout code
        uses: actions/checkout@v4

      # A checkout that could not fully update the tree still exits 0, so the
      # only way to know is to look. Cheap, and it turns a confusing exit 127
      # hundreds of lines later into a failure that names the cause.
      - name: Verify the checkout is complete
        run: |
          missing=""
          for f in e2e/scripts/cleanup_upgrade_test.sh e2e/e2e.py e2e/requirements.txt; do
            [ -f "$GITHUB_WORKSPACE/$f" ] || missing="${missing} ${f}"
          done
          if [ -n "${missing}" ]; then
            echo "::error::Checkout left an incomplete tree. Missing:${missing}"
            echo "HEAD is $(git -C "$GITHUB_WORKSPACE" rev-parse HEAD 2>/dev/null)"
            echo "This means actions/checkout hit 'not uptodate' on some paths"
            echo "and could not finish. The workspace reset before it should"
            echo "have prevented that; check its warnings above."
            exit 1
          fi
          echo "checkout complete"

      # resume adopts the objects a previous run left behind. Recreating the
      # setup deletes exactly those, so the combination cannot do what it says
      # and is far more likely a mistake than an intent. Failing here costs
      # seconds; discovering it after the wipe costs the run.
      - name: Validate resume inputs
        if: ${{ github.event.inputs.resume == 'true' }}
        run: |
          if [ "${{ github.event.inputs.use_existing_cluster }}" != "true" ]; then
            echo "::error::resume=true needs use_existing_cluster=true."
            echo "::error::This run would recreate the cluster and delete the objects resume is meant to adopt."
            exit 1
          fi
          echo "resume=true with use_existing_cluster=true -- the previous run's objects will be adopted."
          echo "If no checkpoint exists for this test class on this cluster, the run starts fresh and says so."

      - uses: actions/checkout@master
        name: Checkout simplyblock-operator
        with:
          repository: simplyblock/simplyblock-operator
          ref: ${{ github.event.inputs.operator_repo_branch || 'main' }}
          path: 'simplyblock-operator'
      
      - name: Resolve KEY_PATH (handles .ssh/, ~/.ssh/, quoted ~) and validate key exists
        shell: bash
        run: |
          set -euxo pipefail

          kp="${KEY_PATH}"

          # Strip wrapping quotes if user typed "~/.ssh/..." with quotes
          kp="${kp%\"}"; kp="${kp#\"}"
          kp="${kp%\'}"; kp="${kp#\'}"

          # Normalize ".ssh/..." -> "$HOME/.ssh/..."
          if [[ "$kp" == .ssh/* ]]; then
            kp="${HOME}/${kp}"
          fi

          # Normalize "~/" -> "$HOME/"
          if [[ "$kp" == ~/* ]]; then
            kp="${HOME}/${kp#~/}"
          fi

          # Also handle "~.ssh/.." (unlikely, but safe)
          if [[ "$kp" == "~.ssh/"* ]]; then
            kp="${HOME}/.${kp#~.}"
          fi

          echo "Resolved KEY_PATH=$kp"
          echo "KEY_PATH=$kp" >> "$GITHUB_ENV"

          test -f "$kp" || (echo "ERROR: SSH key not found at $kp" && exit 1)
          chmod 600 "$kp" || true

      - name: Export KEY_NAME from KEY_PATH
        shell: bash
        run: |
          set -euxo pipefail
          # KEY_PATH is already resolved and exported to $GITHUB_ENV in previous step
          key_name="$(basename "${KEY_PATH}")"
          echo "KEY_NAME=${key_name}" >> "$GITHUB_ENV"
          echo "Exported KEY_NAME=${key_name}"

      # ============================================================
      # PRE-BOOTSTRAP CLEANUP (remote ops only)
      # Targets = CLIENTNODES
      # ============================================================
      - name: Pre-clean kill fio/tmux and unmount NFS on clients
        timeout-minutes: 15
        shell: bash
        run: |
          set -euxo pipefail

          run_remote() {
            local ip="$1"
            local script="$2"
            timeout 120 sshpass -p "${SSH_PASSWORD}" ssh \
              -o ConnectTimeout=15 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
              -o StrictHostKeyChecking=no \
              -o UserKnownHostsFile=/dev/null \
              "${SSH_USER}@${ip}" "bash -s" <<< "$script"
          }

          run_remote_with_retry() {
            local ip="$1"
            local script="$2"
            local max=5
            for attempt in $(seq 1 $max); do
              run_remote "$ip" "$script" && return 0
              echo "Attempt $attempt/$max failed for $ip, retrying in 5s..."
              sleep 5
            done
            echo "All $max attempts failed for $ip, continuing..."
            return 0
          }

          # Support comma-separated and/or space-separated input
          normalized_targets="$(echo "${CLIENT_IPS}" | tr ',' ' ' | xargs -n1 | sort -u | xargs || true)"

          if [ -z "${normalized_targets}" ]; then
            echo "No client IPs provided, skipping client cleanup."
            exit 0
          fi

          for ip in ${normalized_targets}; do
            echo "---- ${ip}: kill fio/tmux + umount + disconnect NVMe + umount NFS ----"
            run_remote_with_retry "${ip}" "set -euxo pipefail;
              pkill -9 fio || true;
              pkill -9 tmux || true;
              # Unmount test mount dirs BEFORE NVMe disconnect (device busy otherwise).
              # Try umount unconditionally — if not mounted it just fails silently.
              for mp in /mnt/test_location/*; do
                [ -e \"\$mp\" ] || continue;
                timeout 10 umount -f \"\$mp\" 2>/dev/null || umount -l \"\$mp\" 2>/dev/null || true;
              done;
              rm -rf /mnt/test_location/* 2>/dev/null || true;
              # Disconnect stale NVMe-oF connections from previous runs
              for nqn in \$(nvme list-subsys -o json 2>/dev/null | jq -r '.Subsystems[]?.NQN // empty' | grep lvol || true); do
                nvme disconnect -n \"\$nqn\" || true;
              done;
              # Unmount NFS
              mp='${NFS_MOUNTPOINT}';
              timeout 10 umount -f \"\$mp\" 2>/dev/null || umount -l \"\$mp\" 2>/dev/null || true"
          done

      - name: Setup kubeconfig
        run: |
          mkdir -p $HOME/.kube
          KUBECONFIG_FILE="$HOME/.kube/config-${{ github.run_id }}"
          echo "${KUBECONFIG_DATA}" > "$KUBECONFIG_FILE"
          chmod 600 "$KUBECONFIG_FILE"
          echo "KUBECONFIG=$KUBECONFIG_FILE" >> $GITHUB_ENV
        env:
          KUBECONFIG_DATA: ${{
            github.event.inputs.cluster_environment == 'aws-openshift' && secrets.KUBECONFIG_AWS_OPENSHIFT ||
            github.event.inputs.cluster_environment == 'openshift-local' && secrets.KUBECONFIG_OPENSHIFT_LOCAL ||
            github.event.inputs.cluster_environment == 'openshift-baremetal' && secrets.KUBECONFIG_OPENSHIFT_BM ||
            github.event.inputs.cluster_environment == 'gcp' && secrets.KUBECONFIG_GCP ||
            secrets.KUBECONFIG_LOCAL || secrets.KUBECONFIG_CONTENT
            }}

      - name: Resolve the openshift-local API server
        if: ${{ github.event.inputs.cluster_environment == 'openshift-local' }}
        run: |
          set +e
          # openshift-local publishes its API under a name only the lab
          # resolver knows. A runner that cannot resolve it fails every
          # kubectl call with "no such host", which reads like a dead cluster
          # rather than a DNS gap, and the run then fails several steps later
          # with something unrelated-looking.
          #
          # Deliberately scoped to NAME RESOLUTION, not general reachability:
          # a check like `kubectl cluster-info` also fails on an expired
          # token, and rewriting /etc/resolv.conf would not fix that while
          # making the real cause harder to see.
          API_HOST="$(kubectl config view --minify -o jsonpath='{.clusters[0].cluster.server}' 2>/dev/null \
            | sed -E 's#^https?://##; s#[:/].*##')"
          if [ -z "$API_HOST" ]; then
            echo "::warning::could not read the API server host from the kubeconfig; skipping the DNS check"
            exit 0
          fi
          echo "API server host: $API_HOST"

          if getent hosts "$API_HOST" >/dev/null 2>&1; then
            echo "$API_HOST already resolves; leaving /etc/resolv.conf alone"
            exit 0
          fi

          echo "$API_HOST does not resolve — adding the lab resolver"
          grep -qs "nameserver ${OCP_LOCAL_DNS}" /etc/resolv.conf \
            || echo "nameserver ${OCP_LOCAL_DNS}" | sudo tee -a /etc/resolv.conf >/dev/null
          grep -qs "search ${OCP_LOCAL_SEARCH}" /etc/resolv.conf \
            || echo "search ${OCP_LOCAL_SEARCH}" | sudo tee -a /etc/resolv.conf >/dev/null
          echo "--- /etc/resolv.conf ---"; cat /etc/resolv.conf

          for i in 1 2 3 4 5 6; do
            getent hosts "$API_HOST" >/dev/null 2>&1 && { echo "$API_HOST resolves now"; exit 0; }
            sleep 5
          done
          echo "::error::$API_HOST still does not resolve after adding ${OCP_LOCAL_DNS} to /etc/resolv.conf."
          echo "Every kubectl call in this run would fail with 'no such host'. Failing here rather than"
          echo "letting a later step report it as a cluster problem."
          exit 1
        env:
          # Hardcoded rather than added as workflow inputs: several of these
          # lanes are already at GitHub's 25-input ceiling.
          OCP_LOCAL_DNS: 192.168.10.34
          OCP_LOCAL_SEARCH: simplyblock1.localdomain

      - name: Install Helm v3.15.4
        run: |
          if ! helm version 2>/dev/null | grep -q 'v3.15'; then
            curl -L https://get.helm.sh/helm-v3.15.4-linux-amd64.tar.gz -o helm-v3.15.4-linux-amd64.tar.gz
            tar -zxvf helm-v3.15.4-linux-amd64.tar.gz
            sudo mv linux-amd64/helm /usr/local/bin/helm
            rm -rf linux-amd64 helm-v3.15.4-linux-amd64.tar.gz
          fi
          helm version

      - name: Install kubectl v1.31.0
        run: |
          if ! kubectl version --client 2>/dev/null | grep -q 'v1.31'; then
            curl -LO "https://dl.k8s.io/release/v1.31.0/bin/linux/amd64/kubectl"
            chmod +x kubectl
            sudo mv kubectl /usr/local/bin/
          fi
          kubectl version --client

      - name: Set parameters
        run: |
          PARAMS="${{ github.event.inputs.cluster_params || 'ndcs=2,npcs=2,bs=4096,chunk_bs=4096,partitions=1,jm_count=4,vcpu_count=0' }}"
          # Parse key=value pairs from cluster_params
          for pair in $(echo "$PARAMS" | tr ',' ' '); do
            key=$(echo "$pair" | cut -d= -f1)
            val=$(echo "$pair" | cut -d= -f2)
            case "$key" in
              ndcs)       echo "NDCS=$val" >> $GITHUB_ENV ;;
              npcs)       echo "NPCS=$val" >> $GITHUB_ENV ;;
              bs)         echo "BS=$val" >> $GITHUB_ENV ;;
              chunk_bs)   echo "CHUNK_BS=$val" >> $GITHUB_ENV ;;
              partitions) echo "PARTITIONS=$val" >> $GITHUB_ENV ;;
              jm_count)   echo "JM_COUNT=$val" >> $GITHUB_ENV ;;
              device_mode) echo "DEVICE_MODE=$val" >> $GITHUB_ENV ;;
              vcpu_count) echo "VCPU_COUNT_PARAM=$val" >> $GITHUB_ENV ;;
            esac
          done

      - name: Verify kubectl connectivity
        run: kubectl get nodes

      - name: Ensure OVN-Kubernetes routingViaHost is enabled
        if: ${{ github.event.inputs.cluster_environment == 'aws-openshift' || github.event.inputs.cluster_environment == 'openshift-local' }}
        run: |
          CURRENT=$(oc get network.operator.openshift.io cluster \
            -o jsonpath='{.spec.defaultNetwork.ovnKubernetesConfig.gatewayConfig.routingViaHost}' 2>/dev/null || echo "")
          if [ "$CURRENT" = "true" ]; then
            echo "routingViaHost is already enabled, skipping patch"
          else
            echo "routingViaHost is not enabled (current: '$CURRENT'), applying patch..."
            oc patch network.operator.openshift.io cluster --type=merge \
              -p '{"spec":{"defaultNetwork":{"ovnKubernetesConfig":{"gatewayConfig":{"routingViaHost":true}}}}}'
            echo "Waiting 30s for OVN-Kubernetes to reconcile..."
            sleep 30
          fi

      # ── Cleanup old deployment ──────────────────────────────────────────────

      - name: Cleanup old CSI deployment
        if: ${{ github.event.inputs.use_existing_cluster != 'true' }}
        run: |
          set +e
          NAMESPACE=simplyblock

          # Ours first, the operator's second -- same order as
          # k8s-native-e2e.yaml, which this lane did not have.
          #
          # cleanup_upgrade_test.sh is the 12-phase one: Helm R25+R26, CRs,
          # CRDs, cert-manager, kube-system, snapshots, PVCs/PVs, node
          # cleanup, labels, CSI hostpath data, namespace finalization. It
          # auto-detects Talos and skips node debug operations.
          #
          # Running it first means the operator's script sees whatever ours
          # could not resolve, rather than ours inheriting half-removed state
          # from the operator's. This lane had the order the other way round
          # AND only ran cleanup_k8s.sh, which does not touch CRDs, node
          # labels, hugepages or CSI hostpath data -- so stale CRDs survived
          # into the next run and the apiserver silently pruned unknown
          # fields from the CRs.
          CLUSTER_ENV="${{ github.event.inputs.cluster_environment || 'local' }}"
          bash $GITHUB_WORKSPACE/e2e/scripts/cleanup_upgrade_test.sh \
            -n "$NAMESPACE" \
            -e "$CLUSTER_ENV" \
            -w "${{ github.event.inputs.worker_nodes }}" \
            -c "$GITHUB_WORKSPACE/simplyblock-operator/helm-charts/charts/simplyblock-operator/crds/"

          # The operator's own cleanup, second: it picks up anything the
          # 12-phase pass above could not resolve.
          if [ -x "$GITHUB_WORKSPACE/simplyblock-operator/helm-charts/scripts/cleanup-simplyblock.sh" ]; then
            bash $GITHUB_WORKSPACE/simplyblock-operator/helm-charts/scripts/cleanup-simplyblock.sh -f $NAMESPACE || true
          fi

          # Kept as a final sweep. By now the namespace should be empty, so
          # this is cheap; it stays because it is the one pass tuned for a
          # cluster with hundreds of thousands of objects, which is the state
          # a stress run can genuinely leave behind.
          bash $GITHUB_WORKSPACE/e2e/scripts/cleanup_k8s.sh $NAMESPACE

          echo "=== Phase 7: Delete Released PVs from simplyblock ==="
          for pv in $(kubectl get pv --no-headers 2>/dev/null | grep 'simplyblock/' | awk '{print $1}'); do
            echo "Deleting PV $pv"
            kubectl delete pv "$pv" --ignore-not-found 2>/dev/null || true
          done

          echo "=== Phase 8: Delete CRDs ==="
          # Clear finalizers on all remaining CR instances so CRD deletion doesn't hang
          for crd in $(kubectl get crd -o name 2>/dev/null | grep simplyblock); do
            crd_name="${crd#customresourcedefinition.apiextensions.k8s.io/}"
            for cr in $(kubectl get "$crd_name" -A --no-headers -o custom-columns=NS:.metadata.namespace,NAME:.metadata.name 2>/dev/null); do
              IFS=' ' read -r ns name <<< "$cr"
              kubectl patch "$crd_name" "$name" -n "$ns" --type=merge -p '{"metadata":{"finalizers":null}}' 2>/dev/null || true
            done
            kubectl patch crd "$crd_name" --type=merge -p '{"metadata":{"finalizers":null}}' 2>/dev/null || true
          done
          kubectl delete -f $GITHUB_WORKSPACE/simplyblock-operator/helm-charts/charts/simplyblock-operator/crds/ --ignore-not-found --timeout=60s 2>/dev/null || true
          # Force-delete any CRDs that survived the timeout
          for crd in $(kubectl get crd -o name 2>/dev/null | grep simplyblock); do
            crd_name="${crd#customresourcedefinition.apiextensions.k8s.io/}"
            kubectl patch crd "$crd_name" --type=merge -p '{"metadata":{"finalizers":null}}' 2>/dev/null || true
            kubectl delete crd "$crd_name" --ignore-not-found --timeout=30s 2>/dev/null || true
          done

          echo "=== Phase 9: Reset hugepages and restart kubelet on worker nodes ==="
          CLUSTER_ENV="${{ github.event.inputs.cluster_environment || 'local' }}"
          IFS=',' read -ra NODES <<< "${{ github.event.inputs.worker_nodes }}"
          for NODE in "${NODES[@]}"; do
            echo "Disconnecting stale NVMe-oF and resetting hugepages on $NODE..."
            if [[ "$CLUSTER_ENV" == *"openshift"* ]]; then
              oc debug node/"$NODE" -- chroot /host bash -c \
                "nvme disconnect-all 2>/dev/null; echo 0 > /sys/kernel/mm/hugepages/hugepages-2048kB/nr_hugepages" 2>/dev/null || true
              echo "Restarting kubelet on $NODE..."
              oc debug node/"$NODE" -- chroot /host systemctl restart kubelet 2>/dev/null || true
            else
              kubectl debug node/"$NODE" -q --image=busybox:latest -- chroot /host sh -c \
                "echo 0 > /sys/kernel/mm/hugepages/hugepages-2048kB/nr_hugepages" 2>/dev/null || true
              echo "Restarting kubelet on $NODE..."
              kubectl debug node/"$NODE" -q --image=busybox:latest -- chroot /host sh -c \
                "systemctl restart kubelet" 2>/dev/null || true
            fi
            echo "Done with $NODE"
          done

          echo "=== Cleanup complete ==="

      - name: Cleanup old cert-manager deployment
        if: ${{ github.event.inputs.use_existing_cluster != 'true' }}
        run: |
          set +e
          echo "=== Uninstalling cert-manager ==="
          helm uninstall cert-manager -n cert-manager 2>/dev/null || true
          kubectl delete namespace cert-manager --wait=false 2>/dev/null || true
          echo "Waiting for cert-manager namespace to be deleted..."
          kubectl wait --for=delete namespace/cert-manager --timeout=120s 2>/dev/null || true
          echo "=== Deleting cert-manager CRDs (Helm does not remove CRDs on uninstall) ==="
          kubectl delete crd \
            certificaterequests.cert-manager.io \
            certificates.cert-manager.io \
            challenges.acme.cert-manager.io \
            clusterissuers.cert-manager.io \
            issuers.cert-manager.io \
            orders.acme.cert-manager.io \
            --ignore-not-found 2>/dev/null || true
          echo "=== cert-manager cleanup complete ==="

      - name: Cleanup old KMS deployment
        if: ${{ github.event.inputs.use_existing_cluster != 'true' }}
        run: |
          set +e
          echo "=== Uninstalling KMS (openbao) ==="
          helm uninstall openbao -n vault 2>/dev/null || true
          # Remove Helm release secrets in case uninstall left a broken/pending state
          kubectl delete secret -n vault -l name=openbao,owner=helm 2>/dev/null || true
          kubectl delete namespace vault --wait=false 2>/dev/null || true

          # Orphaned aggregated APIServices are WHY this namespace hangs.
          # The namespace controller will not finalize while it cannot
          # enumerate every API group, and helm uninstall leaves
          # simplyblock's own metrics APIService behind because it is
          # cluster-scoped. One dead APIService blocks EVERY namespace
          # deletion on the cluster, not just this one -- vault sat
          # Terminating for 25h on exactly that.
          for a in $(kubectl get apiservice -o json 2>/dev/null \
            | jq -r '.items[] | select((.status.conditions // [])
                | map(select(.type=="Available" and .status!="True"))
                | length > 0) | .metadata.name'); do
            echo "Removing unavailable APIService: ${a}"
            kubectl delete apiservice "${a}" --timeout=30s 2>/dev/null || true
          done

          echo "Waiting for vault namespace to be deleted..."
          kubectl wait --for=delete namespace/vault --timeout=120s 2>/dev/null

          # Last resort. Everything above addresses why it hangs; this makes
          # sure it does not STAY hung, because a Terminating vault blocks
          # the next run's KMS install and someone ends up clearing it by
          # hand every time.
          if kubectl get namespace vault >/dev/null 2>&1; then
            echo "vault still Terminating; force-finalizing"
            kubectl get namespace vault -o json \
              | jq 'del(.spec.finalizers[])' \
              | kubectl replace --raw /api/v1/namespaces/vault/finalize -f - || true
            kubectl wait --for=delete namespace/vault --timeout=60s 2>/dev/null || true
          fi
          echo "=== KMS cleanup complete ==="

      # ── Remove stale labels from previous runs ──────────────────────────────

      - name: Remove stale storagenodeset labels from all worker nodes
        if: ${{ github.event.inputs.use_existing_cluster != 'true' }}
        run: |
          echo "Removing stale io.simplyblock.storagenodeset label from all worker nodes..."
          IFS=',' read -ra NODES <<< "${{ github.event.inputs.worker_nodes }}"
          for NODE in "${NODES[@]}"; do
            echo "Removing storagenodeset label from $NODE"
            kubectl label node "$NODE" io.simplyblock.storagenodeset- 2>/dev/null || true
          done
          echo "Stale label cleanup complete."

      # ── Label nodes (after cluster is active) ───────────────────────────────

      - name: Label worker nodes
        if: ${{ github.event.inputs.use_existing_cluster != 'true' }}
        run: |
          CLUSTER_ENV="${{ github.event.inputs.cluster_environment || 'local' }}"
          IFS=',' read -ra NODES <<< "${{ github.event.inputs.worker_nodes }}"
          for NODE in "${NODES[@]}"; do
            if [ "$CLUSTER_ENV" = "local" ] || [ "$CLUSTER_ENV" = "openshift-local" ]; then
              echo "Labeling node $NODE with zone=default (local cluster)"
              kubectl label node "$NODE" topology.kubernetes.io/zone=default --overwrite
            else
              echo "Skipping zone label for $NODE (cloud cluster: $CLUSTER_ENV)"
            fi
            kubectl label node "$NODE" simplyblock.io/role=mgmt-plane --overwrite
          done

      # ── Prepare namespace ─────────────────────────────────────────────────

      - name: Create namespace and set pod-security labels
        if: ${{ github.event.inputs.use_existing_cluster != 'true' }}
        run: |
          kubectl create namespace simplyblock --dry-run=client -o yaml | kubectl apply -f -
          kubectl label namespace simplyblock \
            pod-security.kubernetes.io/enforce=privileged \
            pod-security.kubernetes.io/warn=privileged \
            pod-security.kubernetes.io/audit=privileged \
            --overwrite

      # ── Deploy MinIO for backup tests (conditional) ────────────────────────

      - name: Setup MinIO for backup tests
        if: >-
          ${{
            github.event.inputs.use_existing_cluster != 'true' &&
            (github.event.inputs.cluster_security == 'backup' ||
             contains(github.event.inputs.testname, 'Backup') ||
             contains(github.event.inputs.testname, 'backup'))
          }}
        run: |
          set -euxo pipefail
          NAMESPACE=simplyblock
          EXTERNAL_MINIO="http://192.168.10.164:9000"
          MINIO_ACCESS_KEY="minioadmin"
          MINIO_SECRET_KEY="minioadmin"

          # Check if external MinIO is reachable FROM INSIDE the cluster
          if kubectl run minio-check --rm -i --restart=Never --image=busybox:latest \
              --timeout=30s -- wget -q -O /dev/null -T 5 "${EXTERNAL_MINIO}/minio/health/live" >/dev/null 2>&1; then
            echo "=== External MinIO at ${EXTERNAL_MINIO} is reachable from cluster ==="
            MINIO_ENDPOINT="${EXTERNAL_MINIO}"
            echo "MINIO_SOURCE=external" >> "$GITHUB_ENV"
          else
            echo "=== External MinIO unreachable, deploying in-cluster MinIO ==="
            kubectl create namespace minio --dry-run=client -o yaml | kubectl apply -f -
            kubectl label namespace minio \
              pod-security.kubernetes.io/enforce=privileged \
              pod-security.kubernetes.io/warn=privileged \
              pod-security.kubernetes.io/audit=privileged \
              --overwrite

            # On OpenShift, grant the default SA the anyuid SCC so MinIO can run
            if kubectl api-resources | grep -q securitycontextconstraints; then
              oc adm policy add-scc-to-user anyuid -z default -n minio 2>/dev/null || true
            fi

            cat <<'MINIOYAML' | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: minio
            namespace: minio
          spec:
            replicas: 1
            selector:
              matchLabels:
                app: minio
            template:
              metadata:
                labels:
                  app: minio
              spec:
                containers:
                - name: minio
                  image: minio/minio:latest
                  args: ["server", "/data"]
                  ports:
                  - containerPort: 9000
                  env:
                  - name: MINIO_ROOT_USER
                    value: minioadmin
                  - name: MINIO_ROOT_PASSWORD
                    value: minioadmin
                  volumeMounts:
                  - name: data
                    mountPath: /data
                volumes:
                - name: data
                  emptyDir: {}
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: minio
            namespace: minio
          spec:
            selector:
              app: minio
            ports:
            - port: 9000
              targetPort: 9000
          MINIOYAML

            echo "Waiting for MinIO pod to appear..."
            for i in $(seq 1 30); do
              if kubectl get pod -l app=minio -n minio --no-headers 2>/dev/null | grep -q .; then
                echo "MinIO pod found"
                break
              fi
              if [ "$i" -eq 30 ]; then
                echo "ERROR: MinIO pod never appeared. Deployment status:"
                kubectl -n minio describe deployment minio
                kubectl -n minio get events --sort-by='.lastTimestamp' | tail -20
                exit 1
              fi
              echo "  Waiting for pod ($i/30)..."
              sleep 5
            done
            echo "Waiting for MinIO pod to be ready..."
            kubectl wait --for=condition=ready pod -l app=minio -n minio --timeout=120s

            # Port-forward to make MinIO accessible from the runner
            kubectl port-forward -n minio svc/minio 9000:9000 &
            echo "MC_PORT_FWD_PID=$!" >> "$GITHUB_ENV"
            sleep 3

            MINIO_ENDPOINT="http://minio.minio.svc.cluster.local:9000"
            echo "MINIO_SOURCE=in-cluster" >> "$GITHUB_ENV"
          fi

          echo "MINIO_ENDPOINT=${MINIO_ENDPOINT}" >> "$GITHUB_ENV"

          # Create backup-credentials K8s Secret in cluster namespace
          cat <<CREDEOF | kubectl apply -f -
          apiVersion: v1
          kind: Secret
          metadata:
            name: backup-credentials
            namespace: ${NAMESPACE}
          type: Opaque
          stringData:
            access_key_id: ${MINIO_ACCESS_KEY}
            secret_access_key: ${MINIO_SECRET_KEY}
          CREDEOF

          echo "=== MinIO setup complete (source=${MINIO_SOURCE:-external}, endpoint=${MINIO_ENDPOINT}) ==="

      - name: Start MinIO trace logging
        if: >-
          ${{
            github.event.inputs.use_existing_cluster != 'true' &&
            (github.event.inputs.cluster_security == 'backup' ||
             contains(github.event.inputs.testname, 'Backup') ||
             contains(github.event.inputs.testname, 'backup'))
          }}
        run: |
          set -euxo pipefail

          # This VM hosts multiple parallel runners, so every path/alias/
          # process used here MUST be scoped to this run — a shared
          # /tmp/mc or a pattern-matching pkill would race with, corrupt,
          # or kill another job's in-flight mc install/trace.
          MC_BIN="/tmp/mc-${GITHUB_RUN_ID}"
          MC_ALIAS="myminio-${GITHUB_RUN_ID}"
          echo "MC_BIN=${MC_BIN}" >> "$GITHUB_ENV"
          echo "MC_ALIAS=${MC_ALIAS}" >> "$GITHUB_ENV"

          # 1. Install mc (MinIO Client) to our own per-run path
          curl -fsSL https://dl.min.io/client/mc/release/linux-amd64/mc -o "${MC_BIN}"
          chmod +x "${MC_BIN}"

          # 2. Configure our own mc alias — for in-cluster MinIO use localhost (port-forward)
          if [ "${MINIO_SOURCE:-external}" = "in-cluster" ]; then
            "${MC_BIN}" alias set "${MC_ALIAS}" http://localhost:9000 minioadmin minioadmin
          else
            "${MC_BIN}" alias set "${MC_ALIAS}" http://192.168.10.164:9000 minioadmin minioadmin
          fi

          # 3. Start admin trace in background
          MINIO_TRACE_LOG="/tmp/minio-trace-${GITHUB_RUN_ID}.log"
          echo "MINIO_TRACE_LOG=${MINIO_TRACE_LOG}" >> "$GITHUB_ENV"
          nohup "${MC_BIN}" admin trace -v --all "${MC_ALIAS}" > "${MINIO_TRACE_LOG}" 2>&1 &
          echo "MC_TRACE_PID=$!" >> "$GITHUB_ENV"

          echo "=== MinIO trace logging started (PID=$!, log=${MINIO_TRACE_LOG}) ==="

      - name: Create Docker registry secret
        if: ${{ github.event.inputs.use_existing_cluster != 'true' }}
        run: |
          kubectl create secret docker-registry regcred \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username=${DOCKER_USER} \
            --docker-password=${DOCKER_PASSWORD} \
            --docker-email=a@b.com \
            -n simplyblock || true
        env:
          DOCKER_USER: ${{ secrets.DOCKER_USER }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}

      - name: Configure OpenShift SCC policies
        if: ${{ github.event.inputs.use_existing_cluster != 'true' && (github.event.inputs.cluster_environment == 'aws-openshift' || github.event.inputs.cluster_environment == 'openshift-local') }}
        run: |
          oc adm policy add-scc-to-user privileged -z default -n simplyblock
          oc adm policy add-scc-to-user anyuid -z default -n simplyblock
          oc label namespace simplyblock \
            pod-security.kubernetes.io/enforce=privileged \
            pod-security.kubernetes.io/audit=privileged \
            pod-security.kubernetes.io/warn=privileged \
            --overwrite

      - name: Wait before helm install
        if: ${{ github.event.inputs.use_existing_cluster != 'true' }}
        run: sleep 30

      # ── Deploy CSI stack ────────────────────────────────────────────────────

      - name: Install cert-manager (TLS prerequisite)
        if: ${{ github.event.inputs.use_existing_cluster != 'true' }}
        run: |
          helm repo add jetstack https://charts.jetstack.io
          helm repo update
          helm upgrade --install cert-manager jetstack/cert-manager \
            --namespace cert-manager --create-namespace \
            --version v1.13.0 --set installCRDs=true

          echo "Waiting for cert-manager pods to be ready..."
          kubectl wait --for=condition=Ready pods --all -n cert-manager --timeout=120s
          echo "cert-manager is ready."

      - name: Install Helm Chart for simplyblock-operator
        if: ${{ github.event.inputs.use_existing_cluster != 'true' }}
        run: |
          set -euxo pipefail
          cd $GITHUB_WORKSPACE/simplyblock-operator/helm-charts/charts/simplyblock-operator/

          # TLS is always on: the tls_enabled input was removed when this
          # workflow hit the 25-input workflow_dispatch limit, and true was
          # already its default.
          TLS_FLAGS="--set tls.enabled=true --set tls.mutual_enabled=true"

          CSI_FLAGS=""
          if [ -n "${{ github.event.inputs.csi_repository }}" ]; then
            CSI_FLAGS="$CSI_FLAGS --set driver.image.repository=${{ github.event.inputs.csi_repository }}"
          fi
          if [ -n "${{ github.event.inputs.csi_tag }}" ]; then
            CSI_FLAGS="$CSI_FLAGS --set driver.image.tag=${{ github.event.inputs.csi_tag }}"
          fi

          helm upgrade --install spdk-csi ./ \
            --namespace simplyblock \
            --create-namespace \
            --debug \
            --timeout 10m \
            --set deployment.profile=standalone \
            --set controlplane.csiHostpathDriver.enabled=true \
            --set controlplane.storageclass.name=local-hostpath \
            --set image.simplyblock.repository="${{ github.event.inputs.simplyblock_repository || 'public.ecr.aws/simply-block/simplyblock' }}" \
            --set image.simplyblock.tag="${{ github.event.inputs.simplyblock_image }}" \
            --set image.operator.repository="${{ github.event.inputs.operator_repository || 'simplyblock/simplyblock-operator' }}" \
            --set image.operator.tag="${{ github.event.inputs.operator_tag || 'main' }}" \
            --set csiConfig.simplybk.ip="http://simplyblock-webappapi.simplyblock:5000" \
            --set prometheus.server.persistentVolume.storageClass=local-hostpath \
            --set controlplane.observability.enabled=true \
            --set opensearch.persistence.storageClass=local-hostpath \
            --set controlplane.observability.minio.storageClass=local-hostpath \
            $TLS_FLAGS $CSI_FLAGS

      - name: Grant OpenShift SCC to all service accounts (post-helm)
        if: ${{ github.event.inputs.use_existing_cluster != 'true' && (github.event.inputs.cluster_environment == 'aws-openshift' || github.event.inputs.cluster_environment == 'openshift-local') }}
        run: |
          for sa in $(oc get sa -n simplyblock -o name | cut -d/ -f2); do
            oc adm policy add-scc-to-user privileged -z $sa -n simplyblock
            echo "Granted privileged SCC to $sa"
          done

      - name: Patch fluent-bit daemonset (post-helm)
        if: ${{ github.event.inputs.use_existing_cluster != 'true' }}
        run: |
          NAMESPACE=simplyblock
          echo "=== Waiting for simplyblock-fluent-bit daemonset (up to 5 min) ==="
          PATCHED=false
          for i in $(seq 1 30); do
            if kubectl get daemonset simplyblock-fluent-bit -n $NAMESPACE &>/dev/null; then
              echo "fluent-bit daemonset found, patching affinity..."
              kubectl patch daemonset simplyblock-fluent-bit -n $NAMESPACE \
                --type=merge -p '{"spec":{"template":{"spec":{"affinity":null}}}}'
              echo "fluent-bit daemonset patched successfully"
              # Also patch CSI node daemonset with client toleration
              if kubectl get daemonset simplyblock-csi-node -n $NAMESPACE &>/dev/null; then
                kubectl patch daemonset simplyblock-csi-node -n $NAMESPACE \
                  --type=merge -p '{"spec":{"template":{"spec":{"tolerations":[{"key":"node-role","operator":"Equal","value":"client","effect":"NoSchedule"}]}}}}'
                echo "csi-node daemonset patched with client toleration"
              fi
              PATCHED=true
              break
            fi
            echo "fluent-bit daemonset not found yet ($i/30), waiting 10s..."
            sleep 10
          done
          echo "FLUENTBIT_PATCHED=$PATCHED" >> $GITHUB_ENV

      - name: Patch service accounts with imagePullSecrets
        if: ${{ github.event.inputs.use_existing_cluster != 'true' }}
        run: |
          for sa in $(kubectl get serviceaccounts -n simplyblock --no-headers | awk '{print $1}'); do
            kubectl patch serviceaccount "$sa" -n simplyblock \
              --patch '{"imagePullSecrets": [{"name": "regcred"}]}'
          done
          for deploy in $(kubectl get deployments -n simplyblock --no-headers -o custom-columns=:metadata.name 2>/dev/null); do
            kubectl patch deployment "$deploy" -n simplyblock \
              --type=merge -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"regcred"}]}}}}' || true
          done

      - name: Delete ImagePullBackOff pods and wait for Running (pre-CRD)
        if: ${{ github.event.inputs.use_existing_cluster != 'true' }}
        run: |
          NAMESPACE=simplyblock
          for pod in $(kubectl get pods -n $NAMESPACE --no-headers 2>/dev/null | grep ImagePullBackOff | awk '{print $1}'); do
            kubectl delete pod -n $NAMESPACE "$pod" || true
          done

          echo "=== Waiting for all pods to be Running ==="
          for i in $(seq 1 10); do
            BAD_PODS=$(kubectl get pods -n $NAMESPACE --no-headers 2>/dev/null | grep -vE 'Running|Completed' | wc -l)
            if [ "$BAD_PODS" -eq 0 ]; then
              echo "All pods are Running"
              break
            fi
            echo "Still $BAD_PODS pod(s) not ready ($i/10)..."
            kubectl get pods -n $NAMESPACE --no-headers 2>/dev/null | grep -vE 'Running|Completed' || true
            sleep 10
          done

      # ── Apply custom resources ────────────────────────────────────────────

      - name: Wait for operator pod to be ready
        if: ${{ github.event.inputs.use_existing_cluster != 'true' }}
        run: |
          NAMESPACE=simplyblock
          echo "=== Waiting for operator pod ==="
          for i in $(seq 1 60); do
            POD=$(kubectl -n $NAMESPACE get pods \
              -l app=simplyblock-admin-control \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null) || true
            if [ -n "$POD" ]; then
              PHASE=$(kubectl -n $NAMESPACE get pod "$POD" \
                -o jsonpath='{.status.phase}' 2>/dev/null) || true
              if [ "$PHASE" = "Running" ]; then
                echo "Operator pod $POD is Running"
                break
              fi
            fi
            echo "Waiting for operator pod ($i/60)..."
            sleep 10
          done

      - name: Setup KMS (vault) for encryption
        if: ${{ github.event.inputs.use_existing_cluster != 'true' }}
        run: |
          # Ensure vault namespace from previous run is fully terminated before installing.
          echo "Checking if vault namespace is still terminating..."
          for i in $(seq 1 60); do
            NS_STATUS=$(kubectl get namespace vault -o jsonpath='{.status.phase}' 2>/dev/null || echo "gone")
            if [ "$NS_STATUS" = "gone" ]; then
              echo "vault namespace does not exist — ready to install."
              break
            fi
            if [ "$NS_STATUS" = "Terminating" ]; then
              echo "vault namespace still Terminating ($i/60), clearing stuck finalizers..."
              kubectl get all -n vault --no-headers -o name 2>/dev/null | while read -r res; do
                kubectl patch "$res" -n vault --type=merge -p '{"metadata":{"finalizers":null}}' 2>/dev/null || true
              done
              kubectl patch namespace vault --type=merge -p '{"spec":{"finalizers":[]}}' 2>/dev/null || true
            else
              echo "vault namespace in phase '$NS_STATUS' ($i/60), waiting..."
            fi
            sleep 5
          done
          if kubectl get namespace vault &>/dev/null; then
            echo "WARNING: vault namespace still exists after 300s, force-deleting resources..."
            kubectl delete all --all -n vault --force --grace-period=0 2>/dev/null || true
            kubectl delete namespace vault --force --grace-period=0 2>/dev/null || true
            sleep 10
          fi

          # Auto-detect default StorageClass for vault PVCs
          STORAGE_CLASS=$(kubectl get sc -o jsonpath='{.items[?(@.metadata.annotations.storageclass\.kubernetes\.io/is-default-class=="true")].metadata.name}' | awk '{print $1}')
          if [ -z "$STORAGE_CLASS" ]; then
            STORAGE_CLASS=$(kubectl get sc -o jsonpath='{.items[0].metadata.name}')
          fi
          echo "Using StorageClass for KMS: $STORAGE_CLASS"

          export STORAGE_CLASS
          UNSEAL_KEYS_FILE=./openbao-init.txt bash $GITHUB_WORKSPACE/simplyblock-operator/helm-charts/scripts/setup-kms.sh

          echo "Waiting for vault pods to be ready..."
          kubectl wait --for=condition=Ready pods -l app.kubernetes.io/name=openbao -n vault --timeout=300s
          echo "openbao is unsealed and ready."

          # ── Keep it that way ────────────────────────────────────────────
          # setup-kms.sh unseals exactly once. The seal type is shamir with no
          # auto-unseal, so ANY fresh openbao process comes up sealed again --
          # a reschedule, an eviction, a node drain. It then answers every
          # request with an auth failure, the control plane turns that into
          # POST 500, and each encrypted volume fails to provision with
          # nothing in the CSI error naming vault. On 2026-09-20 the pod was
          # recreated after setup, came back sealed, and every crypto volume
          # failed from that point on.
          #
          # There is no cloud KMS to auto-unseal against on bare metal, and
          # transit auto-unseal would need a second openbao to hold the key.
          # So: keep the unseal keys in a Secret and run a tiny watcher that
          # re-unseals whenever it finds the seal closed. The keys stay on the
          # cluster rather than only in a file on the runner, which is also
          # what makes the vault survivable across a multi-hour run.
          #
          # NOT dev mode: that auto-unseals but keeps everything in memory, so
          # a restart would lose the transit keys and silently break every
          # volume already encrypted with them.
          K1=$(grep -E '^Unseal Key 1:' ./openbao-init.txt | awk '{print $NF}')
          K2=$(grep -E '^Unseal Key 2:' ./openbao-init.txt | awk '{print $NF}')
          K3=$(grep -E '^Unseal Key 3:' ./openbao-init.txt | awk '{print $NF}')
          if [ -z "$K1" ] || [ -z "$K2" ] || [ -z "$K3" ]; then
            echo "::error::could not read 3 unseal keys from openbao-init.txt;"
            echo "the auto-unsealer cannot be deployed and KMS will stay sealed"
            echo "the first time this pod is rescheduled."
            exit 1
          fi
          kubectl create secret generic openbao-unseal-keys -n vault \
            --from-literal=KEY1="$K1" --from-literal=KEY2="$K2" --from-literal=KEY3="$K3" \
            --dry-run=client -o yaml | kubectl apply -f -

          BAO_IMAGE=$(kubectl get pod openbao-0 -n vault -o jsonpath='{.spec.containers[0].image}')
          echo "Deploying openbao-unsealer using $BAO_IMAGE"
          # Quoted heredoc: nothing is expanded by the runner's shell, so
          # $KEY1..$KEY3 reach the container intact for IT to expand. With an
          # unquoted heredoc they had to be written \$KEY1, which lands in the
          # manifest as a literal and makes the unsealer try the string '$KEY1'
          # as a key. The image is the one thing that must come from the runner,
          # so it goes in by sed rather than by expansion.
          cat <<'UNSEALER' | sed "s|BAO_IMAGE_PLACEHOLDER|${BAO_IMAGE}|" | kubectl apply -f -
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: openbao-unsealer
            namespace: vault
          spec:
            replicas: 1
            selector:
              matchLabels: { app: openbao-unsealer }
            template:
              metadata:
                labels: { app: openbao-unsealer }
              spec:
                containers:
                - name: unsealer
                  image: BAO_IMAGE_PLACEHOLDER
                  env:
                  # The server certificate carries no IP SAN, so a verified
                  # connection fails with "cannot validate certificate for
                  # 127.0.0.1 because it doesn't contain any IP SANs".
                  - { name: BAO_SKIP_VERIFY, value: "true" }
                  - { name: BAO_ADDR, value: "https://openbao-0.openbao-internal.vault.svc:8200" }
                  envFrom:
                  - secretRef: { name: openbao-unseal-keys }
                  command: ["/bin/sh","-c"]
                  args:
                  - |
                    while true; do
                      if bao status 2>/dev/null | grep -qE '^Sealed +true'; then
                        echo "$(date -Is) openbao is sealed, unsealing"
                        for k in "$KEY1" "$KEY2" "$KEY3"; do
                          bao operator unseal "$k" >/dev/null 2>&1 || true
                        done
                        bao status 2>/dev/null | grep -E '^Sealed' || true
                      fi
                      sleep 10
                    done
                  resources:
                    requests: { cpu: 10m, memory: 32Mi }
                    limits: { cpu: 100m, memory: 128Mi }
          UNSEALER
          kubectl rollout status deploy/openbao-unsealer -n vault --timeout=120s || true
          echo "KMS setup complete (auto-unseal watcher running)."

      - name: Cleanup stale CSI hostpath data on worker nodes
        if: ${{ github.event.inputs.use_existing_cluster != 'true' }}
        run: |
          CLUSTER_ENV="${{ github.event.inputs.cluster_environment || 'local' }}"
          IFS=',' read -ra NODES <<< "${{ github.event.inputs.worker_nodes }}"
          for NODE in "${NODES[@]}"; do
            echo "Cleaning stale CSI hostpath data on $NODE..."
            if [[ "$CLUSTER_ENV" == *"openshift"* ]]; then
              oc debug node/"$NODE" -- chroot /host bash -c \
                "find /var/lib/csi-hostpath-data -mindepth 1 -maxdepth 1 -type d -mtime +2 -exec rm -rf {} \;" 2>/dev/null || true
            else
              kubectl debug node/"$NODE" -q --image=busybox:latest -- chroot /host sh -c \
                "find /var/lib/csi-hostpath-data -mindepth 1 -maxdepth 1 -type d -mtime +2 -exec rm -rf {} \;" 2>/dev/null || true
            fi
          done
          echo "CSI hostpath data cleanup complete."

      - name: Apply operator custom resources
        if: ${{ github.event.inputs.use_existing_cluster != 'true' }}
        run: |
          NAMESPACE=simplyblock
          IFC_NAMES="${{ github.event.inputs.ifc_names || 'br-ex:enp2s0f0' }}"
          MGMT_IFC="${IFC_NAMES%%:*}"
          DATA_NICS="${IFC_NAMES#*:}"
          MAX_SUBSYS="${{ github.event.inputs.max_subsys || '30' }}"
          SB_REPO="${{ github.event.inputs.simplyblock_repository || 'public.ecr.aws/simply-block/simplyblock' }}"
          SB_TAG="${{ github.event.inputs.simplyblock_image }}"
          SPDK_IMAGE="${{ github.event.inputs.spdk_image }}"
          # spdkImage and spdkProxyImage were StorageNodeSet fields. In v1alpha2
          # they survive only as a per-StorageNode override
          # (StorageNode.spec.config.spdkImage), and a ClusterDeploymentConfig
          # has no field that sets them -- the nodes it creates leave the image
          # empty and the control plane picks its own default.
          #
          # There is no non-racy way to pin it from here: the nodes are created
          # and added by the expansion, so anything this job patched afterwards
          # would land after the image had already been chosen. Rather than
          # patch and hope, the run says the pin did not happen, because an
          # lblk run silently testing the default SPDK build instead of the one
          # it named is a wrong green.
          if [ -n "${SPDK_IMAGE}" ]; then
            echo "::warning title=spdk_image not applied::spdk_image=${SPDK_IMAGE} was requested, but a ClusterDeploymentConfig cannot set the SPDK image; the cluster will run the control plane's default. Pinning it needs an operator-side field."
          fi
          PARTITIONS="${PARTITIONS:-0}"
          JM_COUNT="${JM_COUNT:-3}"
          # 0 (the default) means derive vcpuCount from the node's CPU count below;
          # any other value in cluster_params is used verbatim.
          VCPU_COUNT_PARAM=$(echo "${VCPU_COUNT_PARAM:-0}" | tr -d '[:space:]')
          OPENSHIFT_CLUSTER="${{ (github.event.inputs.cluster_environment == 'aws-openshift' || github.event.inputs.cluster_environment == 'openshift-local' || github.event.inputs.cluster_environment == 'openshift-baremetal') && 'true' || 'false' }}"
          CORE_PERCENTAGE="${{ github.event.inputs.cluster_environment == 'aws-openshift' && '50' || github.event.inputs.cluster_environment == 'openshift-local' && '50' || github.event.inputs.cluster_environment == 'openshift-baremetal' && '50' || github.event.inputs.cluster_environment == 'local' && '35' || '65' }}"
          FORCE_FORMAT_4K="${{ (github.event.inputs.cluster_environment == 'aws-openshift' || github.event.inputs.cluster_environment == 'openshift-local' || github.event.inputs.cluster_environment == 'openshift-baremetal') && 'true' || 'false' }}"
          DRIVE_SIZE_RANGE="${{ github.event.inputs.cluster_environment == 'openshift-baremetal' && '1500G-2000G' || '1.7T-2T' }}"
          CLUSTER_ENV="${{ github.event.inputs.cluster_environment || 'local' }}"
          if [ "$CLUSTER_ENV" = "local" ]; then
            :
          fi

          # Convert partitions to enableJournalDevice (inverted: 0→true, 1→false)
          if [ "${PARTITIONS}" = "0" ]; then
            ENABLE_JOURNAL_DEVICE="true"
          else
            ENABLE_JOURNAL_DEVICE="false"
          fi

          # vcpuCount: an explicit vcpu_count in cluster_params wins; 0 means calculate it
          # from CORE_PERCENTAGE by querying the actual CPU count on a worker node.
          if [ "${VCPU_COUNT_PARAM}" -gt 0 ] 2>/dev/null; then
            VCPU_COUNT="${VCPU_COUNT_PARAM}"
            echo "Using vcpuCount=${VCPU_COUNT} from cluster_params (skipping CPU-count query)"
          else
            FIRST_WORKER="${{ github.event.inputs.worker_nodes }}"
            FIRST_WORKER="${FIRST_WORKER%%,*}"
            if [ "$OPENSHIFT_CLUSTER" = "true" ]; then
              TOTAL_CPUS=$(oc debug node/"${FIRST_WORKER}" -- chroot /host nproc 2>/dev/null || echo "0")
            else
              TOTAL_CPUS=$(kubectl get node "${FIRST_WORKER}" -o jsonpath='{.status.capacity.cpu}' 2>/dev/null || echo "0")
            fi
            TOTAL_CPUS=$(echo "${TOTAL_CPUS}" | tr -d '[:space:]')
            if [ "${TOTAL_CPUS}" -gt 0 ] 2>/dev/null; then
              VCPU_COUNT=$(( TOTAL_CPUS * CORE_PERCENTAGE / 100 ))
              [ "${VCPU_COUNT}" -lt 1 ] && VCPU_COUNT=1
            else
              echo "WARNING: Could not determine CPU count, defaulting vcpuCount to 6"
              VCPU_COUNT=6
            fi
            echo "Calculated vcpuCount=${VCPU_COUNT} (${TOTAL_CPUS} CPUs * ${CORE_PERCENTAGE}%)"
          fi

          RESERVED_SYSTEM_CPU=""
          if [ "${{ github.event.inputs.cluster_environment }}" = "openshift-baremetal" ]; then
            RESERVED_SYSTEM_CPU="0,1,10,11,16,17,26,27"
          fi

          PCIE_MODEL=""
          CLUSTER_ENV="${{ github.event.inputs.cluster_environment }}"
          if [ "$CLUSTER_ENV" != "openshift-baremetal" ] && [ "$CLUSTER_ENV" != "openshift-local" ]; then
            PCIE_MODEL="SAMSUNG MZQLB1T9HAJR-00007"
          fi

          # Which distribution the operator is deploying onto. It is a
          # shorthand: naming OpenShift once sets openShiftCluster,
          # enableCpuTopology and enableKubeletConfiguration together, so the
          # three flags this workflow used to compute individually are now one
          # word (expansion.go buildWorkload).
          case "$CLUSTER_ENV" in
            aws-openshift|openshift-local|openshift-baremetal) ENVIRONMENT="OpenShift" ;;
            talos)                                             ENVIRONMENT="Talos" ;;
            *)                                                 ENVIRONMENT="Vanilla" ;;
          esac

          # nvme unless cluster_params says otherwise. Defaulted where it

          # is used, so it holds however the value arrived.

          DEVICE_MODE="${DEVICE_MODE:-nvme}"

          #

          # lblk selectors and the NVMe PCIe selectors are mutually

          # exclusive under the StorageNodeSet CEL rule, which tests

          # size(...) > 0 -- so blanking is enough, the keys may stay.

          if [ "${DEVICE_MODE}" = "lblk" ]; then
            # Mandatory on lblk: add-node refuses with "lblk device mode
            # requires --enable-journal-device; partitioned journal mode is not
            # supported".
            ENABLE_JOURNAL_DEVICE="true"
            # Both are NVMe selectors, and discovery scans one class per run.
            # Sending them with enableLogicalBlockDevices selects nothing.
            DRIVE_SIZE_RANGE=""
            PCIE_MODEL=""
            echo "lblk mode: block-device discovery, journal device on, PCIe selectors blanked"
          fi

          # Conditionally build backup spec block
          BACKUP_SPEC=""
          CLUSTER_SEC="${{ github.event.inputs.cluster_security || 'none' }}"
          TESTNAME_INPUT="${{ github.event.inputs.testname || '' }}"
          TESTNAME_LOWER="$(echo "$TESTNAME_INPUT" | tr '[:upper:]' '[:lower:]')"
          if [ "$CLUSTER_SEC" = "backup" ] || echo "$TESTNAME_LOWER" | grep -q "backup"; then
            BACKUP_SPEC="  backup:
              credentialsSecretRef:
                name: backup-credentials
              localEndpoint: ${MINIO_ENDPOINT}
              localTesting: true
              secondaryTarget: 0
              snapshotBackups: true
              withCompression: false"
          fi

          # Build vault settings and encryption pool blocks (conditional on TLS)
          # Always configured, for the same reason as TLS_FLAGS above.
          VAULT_SETTINGS=""
          ENCRYPTION_POOL_YAML=""
          if true; then
            VAULT_SETTINGS="  hashicorpVaultSettings:
              baseURL: \"https://openbao.vault:8200\""
            ENCRYPTION_POOL_YAML="---
          apiVersion: storage.simplyblock.io/v1alpha1
          kind: StoragePool
          metadata:
            name: encryption-pool
            namespace: ${NAMESPACE}
          spec:
            clusterName: simplyblock-cluster
            storageClassParameters:
              encryption: true"
          fi

          echo "=== Bringing the cluster up through the deployment config ==="
          # StorageNodeSet is not reconciled any more. operator/cmd/main.go
          # registers no reconciler for it and deployment/expansion.go is the
          # only thing that creates a StorageNode, so applying a set succeeded
          # and produced nothing -- the cluster then waited forever for storage
          # nodes nobody had asked for.
          #
          # The supported path is a ClusterDeploymentConfig: discovery inspects
          # the workers and writes a draft, we write our parameters into it, and
          # approving it builds the StorageCluster and its StorageNodes. The
          # draft is immutable once approved, so everything has to be set first;
          # the script does that in order.
          export NAMESPACE
          export CLUSTER_NAME="simplyblock-cluster"
          export DEVICE_MODE NDCS NPCS VCPU_COUNT MAX_SUBSYS
          export MGMT_IFC DATA_NICS
          export JM_COUNT
          export JM_PERCENT="3"
          export ENABLE_JOURNAL_DEVICE
          export ENVIRONMENT
          export DRIVE_SIZE_RANGE PCIE_MODEL
          # One field, two operations: the operator resolves it to a 4K reformat
          # on an NVMe cluster and a wipefs on a block one.
          export FORCE_DRIVE_FORMAT="${FORCE_FORMAT_4K}"
          export WORKER_NODES="${{ github.event.inputs.worker_nodes }}"
          # On lblk the workers boot from /dev/sda; without this the draft
          # offers the root disk as storage and the approval gate is the only
          # thing standing between that and a reformat.
          if [ "${DEVICE_MODE}" = "lblk" ]; then
            export BLOCK_DENY_LIST="${LBLK_DENY_LIST:-/dev/sda}"
          fi

          python3 $GITHUB_WORKSPACE/e2e/scripts/k8s_cluster_bringup.py

          echo "=== Settings the deployment config does not carry ==="
          # A deployment config describes a deployment, not every knob of a
          # cluster: thresholds, node affinity, backup and vault have no field
          # on it. They are mutable on the StorageCluster, so they are patched
          # onto the cluster the expansion just created.
          #
          # Patched through v1alpha1 deliberately. That version is still served
          # and carries these in exactly the shapes this workflow already
          # builds -- backup's localEndpoint/localTesting/secondaryTarget among
          # them -- and the conversion webhook translates. Rewriting them into
          # v1alpha2's own backup shape by hand would be a silent guess, and a
          # wrong guess reads as a backup test failing for its own reasons.
          cat > /tmp/cluster-extra.yaml <<EOF
          spec:
            enableNodeAffinity: true
            warningThreshold:
              capacity: 95
              provisionedCapacity: 97
            criticalThreshold:
              capacity: 96
              provisionedCapacity: 98
          ${BACKUP_SPEC}
          ${VAULT_SETTINGS}
          EOF
          echo "--- cluster patch ---"; cat /tmp/cluster-extra.yaml
          kubectl -n ${NAMESPACE} patch \
            storageclusters.v1alpha1.storage.simplyblock.io simplyblock-cluster \
            --type=merge --patch-file /tmp/cluster-extra.yaml

          # reservedSystemCPU was a StorageNodeSet field and is now part of the
          # cluster's storage-node workload, so it has no v1alpha1 home and is
          # patched on v1alpha2 directly.
          if [ -n "${RESERVED_SYSTEM_CPU}" ]; then
            kubectl -n ${NAMESPACE} patch storagecluster simplyblock-cluster \
              --type=merge \
              -p "{\"spec\":{\"storageNodes\":{\"reservedSystemCPU\":\"${RESERVED_SYSTEM_CPU}\"}}}"
          fi

          echo "=== Applying pools ==="
          cat <<EOF | kubectl apply -f -
          apiVersion: storage.simplyblock.io/v1alpha1
          kind: StoragePool
          metadata:
            name: simplyblock-pool
            namespace: ${NAMESPACE}
          spec:
            clusterName: simplyblock-cluster
          ${ENCRYPTION_POOL_YAML}
          EOF

          echo "Custom resources applied"
          sleep 10
        env:
          NDCS: ${{ env.NDCS }}
          NPCS: ${{ env.NPCS }}

      - name: Patch service accounts with imagePullSecrets (post-CRD)
        if: ${{ github.event.inputs.use_existing_cluster != 'true' }}
        run: |
          for sa in $(kubectl get serviceaccounts -n simplyblock --no-headers | awk '{print $1}'); do
            kubectl patch serviceaccount "$sa" -n simplyblock \
              --patch '{"imagePullSecrets": [{"name": "regcred"}]}'
          done
          for deploy in $(kubectl get deployments -n simplyblock --no-headers -o custom-columns=:metadata.name 2>/dev/null); do
            kubectl patch deployment "$deploy" -n simplyblock \
              --type=merge -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"regcred"}]}}}}' || true
          done

      - name: Delete ImagePullBackOff pods and wait for Running (post-CRD)
        if: ${{ github.event.inputs.use_existing_cluster != 'true' }}
        run: |
          NAMESPACE=simplyblock
          for pod in $(kubectl get pods -n $NAMESPACE --no-headers 2>/dev/null | grep ImagePullBackOff | awk '{print $1}'); do
            kubectl delete pod -n $NAMESPACE "$pod" || true
          done

          echo "=== Waiting for all pods to be Running ==="
          for i in $(seq 1 10); do
            BAD_PODS=$(kubectl get pods -n $NAMESPACE --no-headers 2>/dev/null | grep -vE 'Running|Completed' | wc -l)
            if [ "$BAD_PODS" -eq 0 ]; then
              echo "All pods are Running"
              break
            fi
            echo "Still $BAD_PODS pod(s) not ready ($i/10)..."
            kubectl get pods -n $NAMESPACE --no-headers 2>/dev/null | grep -vE 'Running|Completed' || true
            sleep 10
          done

      - name: Wait for storage SA, patch secrets, grant SCC and restart daemonset
        if: ${{ github.event.inputs.use_existing_cluster != 'true' }}
        run: |
          NAMESPACE=simplyblock
          echo "Waiting for simplyblock-storage-node-sa service account..."
          for i in $(seq 1 60); do
            if kubectl get sa simplyblock-storage-node-sa -n $NAMESPACE &>/dev/null; then
              echo "Service account simplyblock-storage-node-sa found"
              break
            fi
            echo "Attempt $i/60: SA not found yet, waiting 10s..."
            sleep 10
          done

          echo "Patching service accounts and deployments with imagePullSecrets..."
          for sa in $(kubectl get serviceaccounts -n $NAMESPACE --no-headers | awk '{print $1}'); do
            kubectl patch serviceaccount "$sa" -n $NAMESPACE \
              --patch '{"imagePullSecrets": [{"name": "regcred"}]}'
          done
          for deploy in $(kubectl get deployments -n $NAMESPACE --no-headers -o custom-columns=:metadata.name 2>/dev/null); do
            kubectl patch deployment "$deploy" -n $NAMESPACE \
              --type=merge -p '{"spec":{"template":{"spec":{"imagePullSecrets":[{"name":"regcred"}]}}}}' || true
          done

          if [ "$CLUSTER_ENV" = "aws-openshift" ] || [ "$CLUSTER_ENV" = "openshift-local" ]; then
            echo "Granting privileged SCC to all service accounts..."
            for sa in $(oc get sa -n $NAMESPACE -o name | cut -d/ -f2); do
              oc adm policy add-scc-to-user privileged -z $sa -n $NAMESPACE
              echo "Granted privileged SCC to $sa"
            done
          fi

          echo "=== Waiting for storage node daemonset ==="
          for i in $(seq 1 60); do
            if kubectl get daemonset simplyblock-storage-node-ds-simplyblock-cluster -n $NAMESPACE &>/dev/null; then
              echo "Daemonset found, waiting for rollout to complete..."
              kubectl rollout status daemonset simplyblock-storage-node-ds-simplyblock-cluster -n $NAMESPACE --timeout=100s || true
              kubectl get pods -n $NAMESPACE
              echo "Restarting daemonset..."
              kubectl rollout restart -n $NAMESPACE ds simplyblock-storage-node-ds-simplyblock-cluster
              break
            fi
            echo "Daemonset not found yet ($i/60), waiting 10s..."
            sleep 10
          done
        env:
          CLUSTER_ENV: ${{ github.event.inputs.cluster_environment }}

      # ── Wait for cluster readiness ──────────────────────────────────────────

      - name: Wait for cluster to become active
        timeout-minutes: ${{ github.event.inputs.cluster_environment == 'local' && 40 || 80 }}
        id: cluster_status
        run: |
          NAMESPACE=simplyblock
          ADMIN_POD=""
          MAX_POLL=300

          echo "=== Waiting for admin pod to be ready ==="
          for i in $(seq 1 60); do
            ADMIN_POD=$(kubectl -n $NAMESPACE get pods \
              -l app=simplyblock-admin-control \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null) || true

            if [ -n "$ADMIN_POD" ]; then
              PHASE=$(kubectl -n $NAMESPACE get pod "$ADMIN_POD" \
                -o jsonpath='{.status.phase}' 2>/dev/null) || true
              if [ "$PHASE" = "Running" ]; then
                echo "Admin pod $ADMIN_POD is Running"
                break
              fi
              echo "Admin pod $ADMIN_POD phase=$PHASE ($i/60)"
            else
              echo "Admin pod not found yet ($i/60)"
            fi
            sleep 10
          done

          if [ -z "$ADMIN_POD" ]; then
            echo "ERROR: Admin pod never appeared"
            kubectl -n $NAMESPACE get pods
            exit 1
          fi

          # Expected number of snode-spdk pods = number of worker nodes
          IFS=',' read -ra NODES <<< "${{ github.event.inputs.worker_nodes }}"
          EXPECTED_SNODES=${#NODES[@]}
          echo "=== Waiting for $EXPECTED_SNODES snode-spdk pods to be ready (MAX_POLL=$MAX_POLL) ==="

          for i in $(seq 1 $MAX_POLL); do
            TOTAL=$(kubectl -n $NAMESPACE get pods -l role=simplyblock-storage-node --no-headers 2>/dev/null | wc -l)
            READY=$(kubectl -n $NAMESPACE get pods -l role=simplyblock-storage-node --no-headers 2>/dev/null | grep -c "Running" || true)

            if [ "$READY" -ge "$EXPECTED_SNODES" ]; then
              echo "All $READY/$EXPECTED_SNODES snode-spdk pods are Running"
              break
            fi

            echo "snode-spdk pods: $READY/$EXPECTED_SNODES Running (total=$TOTAL) ($i/$MAX_POLL)"
            if [ "$i" -eq "$MAX_POLL" ]; then
              echo "ERROR: snode-spdk pods did not become ready within timeout"
              kubectl -n $NAMESPACE get pods
              exit 1
            fi
            sleep 10
          done

          echo "=== Re-resolving admin pod before cluster status polling ==="
          ADMIN_POD=""
          for i in $(seq 1 30); do
            ADMIN_POD=$(kubectl -n $NAMESPACE get pods \
              -l app=simplyblock-admin-control \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null) || true
            if [ -n "$ADMIN_POD" ]; then
              PHASE=$(kubectl -n $NAMESPACE get pod "$ADMIN_POD" \
                -o jsonpath='{.status.phase}' 2>/dev/null) || true
              if [ "$PHASE" = "Running" ]; then
                echo "Admin pod resolved: $ADMIN_POD (Running)"
                break
              fi
              echo "Admin pod $ADMIN_POD phase=$PHASE, retrying ($i/30)..."
              ADMIN_POD=""
            else
              echo "Admin pod not found, retrying ($i/30)..."
            fi
            sleep 10
          done
          if [ -z "$ADMIN_POD" ]; then
            echo "ERROR: Could not find running admin pod before polling"
            kubectl -n $NAMESPACE get pods
            exit 1
          fi

          echo "=== Polling cluster status (MAX_POLL=$MAX_POLL) ==="
          for i in $(seq 1 $MAX_POLL); do
            # Re-resolve admin pod each iteration in case it gets recreated
            NEW_POD=$(kubectl -n $NAMESPACE get pods \
              -l app=simplyblock-admin-control \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null) || true
            NEW_PHASE=$(kubectl -n $NAMESPACE get pod "$NEW_POD" \
              -o jsonpath='{.status.phase}' 2>/dev/null) || true
            if [ -n "$NEW_POD" ] && [ "$NEW_PHASE" = "Running" ] && [ "$NEW_POD" != "$ADMIN_POD" ]; then
              echo "Admin pod changed: $ADMIN_POD -> $NEW_POD"
              ADMIN_POD="$NEW_POD"
            fi

            echo "[poll $i/$MAX_POLL] Using admin pod: $ADMIN_POD"
            OUTPUT=$(kubectl -n $NAMESPACE exec "$ADMIN_POD" -- \
              sbctl cluster list) || true
            echo "[poll $i/$MAX_POLL] sbctl cluster list output:"
            echo "$OUTPUT"

            if echo "$OUTPUT" | grep -qi "active"; then
              echo "Cluster is active!"

              # Match the UUID by its shape, not by its position. Parsing
              # `NR==4{print $2}` broke the moment sbctl prefixed the table
              # with an index-building WARNING: every row shifted down one, so
              # line 4 became the +---+ separator and this came out empty and
              # the run died before the test started. A UUID cannot be confused
              # with a separator, a warning or a column heading, and the same
              # expression works on a table or on JSON.
              CLUSTER_ID=$(printf '%s\n' "$OUTPUT" | tr -d '\r' \
                | grep -oiE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' \
                | head -1)

              # NOT from `cluster list`: it has no secret column, so the old
              # `{print $NF}` was reading the blank Replicate field. This is
              # the command that has one, as the docker and upgrade workflows
              # already do. Timestamped log lines are dropped first: the
              # warning lands here too.
              CLUSTER_SECRET=""
              if [ -n "$CLUSTER_ID" ]; then
                CLUSTER_SECRET=$(kubectl -n $NAMESPACE exec "$ADMIN_POD" -- \
                  sbctl cluster get-secret "$CLUSTER_ID" 2>/dev/null \
                  | tr -d '\r' | grep -vE '^[0-9]{4}-[0-9]{2}-[0-9]{2} ' \
                  | tail -n 1 | xargs) || true
              fi

              if [ -z "$CLUSTER_ID" ]; then
                echo "ERROR: no cluster UUID in sbctl output:" >&2
                echo "$OUTPUT" >&2
                exit 1
              fi


              # Backfill the secondary indices now the cluster is up. The
              # warning sbctl emits without them says what it costs: reads of
              # StorageNode.cluster_id FALL BACK TO A FULL SCAN, and these
              # suites poll node status constantly -- wait_for_storage_node_status
              # alone is hundreds of lookups per run. An upgrade runs this
              # automatically, so this just puts a fresh cluster where an
              # upgraded one already is. Documented idempotent and safe on a
              # live cluster.
              #
              # Never fatal: a cluster that cannot backfill is worth knowing
              # about, but it is not a reason to refuse to run the tests.
              echo "Backfilling database indices..."
              kubectl -n $NAMESPACE exec "$ADMIN_POD" -- \
                sbctl cluster build-indices 2>&1 | tail -5 || true

              echo "Parsed CLUSTER_ID=${CLUSTER_ID}"
              echo "CLUSTER_ID=${CLUSTER_ID}" >> $GITHUB_ENV
              echo "CLUSTER_SECRET=${CLUSTER_SECRET}" >> $GITHUB_ENV
              exit 0
            fi

            echo "Cluster not active yet ($i/$MAX_POLL)..."
            sleep 10
          done

          echo "WARNING: Cluster did not become active within timeout — will attempt force-activate"
          kubectl -n $NAMESPACE get pods
          kubectl -n $NAMESPACE exec "$ADMIN_POD" -- sbctl cluster list 2>&1 || true

      - name: Verify and force-activate cluster if needed
        if: ${{ github.event.inputs.use_existing_cluster != 'true' }}
        run: |
          NAMESPACE=simplyblock
          ADMIN_POD=$(kubectl -n $NAMESPACE get pods \
            -l app=simplyblock-admin-control \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null) || true

          if [ -z "$ADMIN_POD" ]; then
            echo "ERROR: No admin pod found"
            exit 1
          fi

          # Helper: extract cluster ID and secret from sbctl output and export to GITHUB_ENV
          extract_cluster_info() {
            local output="$1"
            local cid csecret
            # Match the UUID by its shape, not its position -- sbctl now
            # prefixes its output with an index-building WARNING, which
            # shifted every table row down one and made positional parsing
            # return the separator line.
            cid=$(printf '%s\n' "$output" | tr -d '\r' \
              | grep -oiE '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}' \
              | head -1)
            csecret=""
            if [ -n "$cid" ]; then
              csecret=$(kubectl -n $NAMESPACE exec "$ADMIN_POD" -- \
                sbctl cluster get-secret "$cid" 2>/dev/null \
                | tr -d '\r' | grep -vE '^[0-9]{4}-[0-9]{2}-[0-9]{2} ' \
                | tail -n 1 | xargs) || true
            fi
            if [ -n "$cid" ] && [ "$cid" != "+" ]; then
              echo "CLUSTER_ID=${cid}" >> $GITHUB_ENV
              echo "CLUSTER_SECRET=${csecret}" >> $GITHUB_ENV
              echo "Extracted CLUSTER_ID=${cid}" >&2
            fi
            echo "$cid"
          }

          echo "=== Verifying cluster activation ==="
          OUTPUT=$(kubectl -n $NAMESPACE exec "$ADMIN_POD" -- \
            sbctl cluster list) || true
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -qi "active"; then
            echo "Cluster is active, ensuring env vars are set"
            extract_cluster_info "$OUTPUT"
            exit 0
          fi

          echo "Cluster is NOT active, attempting forced activation..."
          # Extract cluster ID for the activate command
          CID=$(extract_cluster_info "$OUTPUT")
          if [ -n "$CID" ] && [ "$CID" != "+" ]; then
            kubectl -n $NAMESPACE exec "$ADMIN_POD" -- \
              sbctl -d cluster activate "${CID}" 2>&1 || true
          else
            echo "WARNING: Could not extract cluster ID, trying activate without ID..."
            kubectl -n $NAMESPACE exec "$ADMIN_POD" -- \
              sbctl -d cluster activate 2>&1 || true
          fi

          echo "Waiting 60s for activation to take effect..."
          sleep 60

          OUTPUT=$(kubectl -n $NAMESPACE exec "$ADMIN_POD" -- \
            sbctl cluster list) || true
          echo "$OUTPUT"

          if echo "$OUTPUT" | grep -qi "active"; then
            echo "Cluster is now active after forced activation"
            extract_cluster_info "$OUTPUT"
            exit 0
          fi

          echo "ERROR: Cluster is still not active after forced activation"
          exit 1

      - name: Patch fluent-bit daemonset (post-cluster-active)
        if: ${{ env.FLUENTBIT_PATCHED != 'true' }}
        run: |
          NAMESPACE=simplyblock
          echo "=== fluent-bit was not patched after helm install, retrying now ==="
          for i in $(seq 1 30); do
            if kubectl get daemonset simplyblock-fluent-bit -n $NAMESPACE &>/dev/null; then
              kubectl patch daemonset simplyblock-fluent-bit -n $NAMESPACE \
                --type=merge -p '{"spec":{"template":{"spec":{"affinity":null}}}}'
              echo "fluent-bit daemonset patched successfully"
              # Also patch CSI node daemonset with client toleration
              if kubectl get daemonset simplyblock-csi-node -n $NAMESPACE &>/dev/null; then
                kubectl patch daemonset simplyblock-csi-node -n $NAMESPACE \
                  --type=merge -p '{"spec":{"template":{"spec":{"tolerations":[{"key":"node-role","operator":"Equal","value":"client","effect":"NoSchedule"}]}}}}'
                echo "csi-node daemonset patched with client toleration"
              fi
              break
            fi
            echo "fluent-bit daemonset not found yet ($i/30), waiting 10s..."
            sleep 10
          done

      # ── Run tests ───────────────────────────────────────────────────────────

      - name: Set RUN_DIR_FILE
        run: echo "RUN_DIR_FILE=/tmp/sb_k8s_run_dir_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}.txt" >> "$GITHUB_ENV"

      - name: Record Test Start Time
        run: echo "TEST_START_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Setup and Run Tests
        if: ${{ github.event.inputs.testname != 'NONE' }}
        run: |
          set -o pipefail
          cd $GITHUB_WORKSPACE/e2e
          # 3.11, not whatever the runner has. These workflows built their
          # own venv from the system python, and on a 3.9 runner every one of
          # them died at import:
          #   from datetime import datetime, UTC
          #   ImportError: cannot import name 'UTC' from 'datetime'
          # UTC landed in 3.11 and cannot be polyfilled, so no amount of
          # requirements pinning helps. ensure_python.sh fetches a pinned 3.11
          # through uv and installs requirements into it.
          #
          # Its stdout is the interpreter path. Put that venv's bin first so
          # the plain `python3` calls below resolve to it -- GITHUB_PATH only
          # affects later steps, and this all runs in one.
          E2E_PY="$(bash "$GITHUB_WORKSPACE/e2e/scripts/ensure_python.sh" --requirements "$GITHUB_WORKSPACE/e2e/requirements.txt")"
          export PATH="$(dirname "${E2E_PY}"):${PATH}"
          python3 -V

          export CLUSTER_ID="${{ env.CLUSTER_ID }}"
          export CLUSTER_SECRET="${{ env.CLUSTER_SECRET }}"
          export K8S_LOCAL_KUBECTL=1
          export SBCLI_CMD=sbctl

          TESTNAME=""
          if [ -n "${{ github.event.inputs.testname }}" ]; then
            TESTNAME="--testname ${{ github.event.inputs.testname }}"
          fi

          PRESERVE_ARG=""
          if [ "${{ github.event.inputs.preserve_resources_on_failure }}" = "true" ]; then
            PRESERVE_ARG="--preserve_resources_on_failure True"
          fi

          CASE_ARG=""
          if [ -n "${TEST_CASE:-}" ]; then
            CASE_ARG="--case ${TEST_CASE}"
          fi
          if [ -n "${RESUME:-}" ]; then
            echo "RESUME=1: adopting the objects left by the previous run on this cluster"
          fi

          python3 -u stress.py $TESTNAME \
            --ndcs $NDCS --npcs $NPCS --bs $BS --chunk_bs $CHUNK_BS \
            --run_k8s True --tls_enabled true $PRESERVE_ARG $CASE_ARG 2>&1 | tee output.log
        env:
          NDCS: ${{ env.NDCS }}
          NPCS: ${{ env.NPCS }}
          BS: ${{ env.BS }}
          CHUNK_BS: ${{ env.CHUNK_BS }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          # The md5 gate depends on the hardware. GCP pd-balanced disks
          # are the genuinely non-4K-atomic devices these tests exist
          # for; elsewhere the drives do give a 4K atomic write, so an
          # md5 mismatch is a real defect and must fail, not warn.
          CLUSTER_ENV: ${{ github.event.inputs.cluster_environment || 'local' }}
          CLIENT_IP: ${{ github.event.inputs.client_ips }}
          SKIP_NFS: ${{ github.event.inputs.skip_nfs || 'false' }}
          RUN_DIR_FILE: ${{ env.RUN_DIR_FILE }}
          # Read by stress.py directly. Empty means a normal run.
          RESUME: ${{ github.event.inputs.resume == 'true' && '1' || '' }}
          TEST_CASE: ${{ github.event.inputs.test_case }}

      # ── Post-test: timing, logs, notifications ──────────────────────────────

      - name: Export RUN_BASE_DIR from RUN_DIR_FILE
        if: always()
        run: |
          test -f "${RUN_DIR_FILE}" || (echo "RUN_DIR_FILE not found — skipping"; exit 0)
          RUN_BASE_DIR="$(cat "${RUN_DIR_FILE}" | tr -d '\r\n')"
          [[ -n "${RUN_BASE_DIR}" ]] && echo "RUN_BASE_DIR=${RUN_BASE_DIR}" >> "$GITHUB_ENV" || true

      - name: Copy raw output.log to each test's NFS folder
        if: always()
        shell: bash
        run: |
          set +e
          out_log="$GITHUB_WORKSPACE/e2e/output.log"
          if [ ! -f "${out_log}" ]; then
            echo "No output.log found, skipping"
            exit 0
          fi
          echo "output.log size: $(stat --printf='%s' "${out_log}" 2>/dev/null || echo '?') bytes"
          mapfile -t log_paths < <(
            grep 'Logs Path:' "${out_log}" 2>/dev/null \
              | sed 's/\x1b\[[0-9;]*m//g' \
              | sed 's/.*Logs Path: *//' \
              | sed 's/[[:space:]]*$//' || true
          )
          if [ ${#log_paths[@]} -eq 0 ]; then
            echo "No 'Logs Path:' entries found in output.log"
            if [ -n "${RUN_BASE_DIR:-}" ] && [ -d "${RUN_BASE_DIR}" ]; then
              cp "${out_log}" "${RUN_BASE_DIR}/github_raw_output.log" || true
              echo "Saved to ${RUN_BASE_DIR}/github_raw_output.log"
            fi
            exit 0
          fi
          for path in "${log_paths[@]}"; do
            if [ -d "${path}" ]; then
              cp "${out_log}" "${path}/github_raw_output.log" || true
              echo "Saved output.log -> ${path}/github_raw_output.log"
            else
              echo "WARN: path does not exist: ${path}"
            fi
          done

      - name: Record Test End Time
        if: always()
        run: echo "TEST_END_TIME=$(date +%s)" >> $GITHUB_ENV

      - name: Calculate Total Time Taken
        if: always()
        run: |
          TEST_TIME=$(($TEST_END_TIME - $TEST_START_TIME))
          TEST_TIME_HOURS=$(($TEST_TIME / 3600))
          TEST_TIME_MINS=$((($TEST_TIME % 3600) / 60))
          TEST_TIME_SECS=$(($TEST_TIME % 60))
          echo "Test runtime: ${TEST_TIME_HOURS}h ${TEST_TIME_MINS}m ${TEST_TIME_SECS}s"
          echo "TEST_TIME_HOURS=$TEST_TIME_HOURS" >> $GITHUB_ENV
          echo "TEST_TIME_MINS=$TEST_TIME_MINS" >> $GITHUB_ENV
          echo "TEST_TIME_SECS=$TEST_TIME_SECS" >> $GITHUB_ENV

          # Log collection timeout: half the test runtime, minimum 30 minutes
          LOG_COLLECT_TIMEOUT_MINS=$(( (TEST_TIME + 119) / 120 ))
          [ "$LOG_COLLECT_TIMEOUT_MINS" -lt 30 ] && LOG_COLLECT_TIMEOUT_MINS=30
          echo "LOG_COLLECT_TIMEOUT_MINS=$LOG_COLLECT_TIMEOUT_MINS" >> $GITHUB_ENV

      - name: Write Job Summary
        if: always()
        shell: bash
        run: |
          set +e
          out_log="$GITHUB_WORKSPACE/e2e/output.log"

          dur_fmt="${TEST_TIME_HOURS:-0}h ${TEST_TIME_MINS:-0}m ${TEST_TIME_SECS:-0}s"

          # Extract test-specific log path from output.log
          TEST_LOG_PATH="$(grep 'Logs Path:' "${out_log}" 2>/dev/null \
            | tail -n 1 | sed 's/\x1b\[[0-9;]*m//g' | sed 's/.*Logs Path: *//' \
            | sed 's/[[:space:]]*$//' || true)"

          # --- test result counts ---
          total_cases="$(grep -E 'Number of Total Cases:' "${out_log}" 2>/dev/null | tail -n 1 | grep -oE '[0-9]+$' || echo '?')"
          passed_cnt="$(grep -E 'Number of Passed Cases:' "${out_log}" 2>/dev/null | tail -n 1 | grep -oE '[0-9]+$' || echo '?')"
          failed_cnt="$(grep -E 'Number of Failed Cases:' "${out_log}" 2>/dev/null | tail -n 1 | grep -oE '[0-9]+$' || echo '?')"
          skipped_cnt="$(grep -E 'Number of Skipped Cases:' "${out_log}" 2>/dev/null | tail -n 1 | grep -oE '[0-9]+$' || echo '0')"
          test_wise="$(grep -E '(PASSED|FAILED|SKIPPED) CASE' "${out_log}" 2>/dev/null \
            | sed 's/\x1b\[[0-9;]*m//g' | sed 's/.*INFO - //' || true)"

          # --- failure reason ---
          failure_summary="(unknown)"
          log_tail=""
          if [[ -f "${out_log}" ]]; then
            failure_summary="$(grep -oE 'MultipleExceptions: .+|SkippedTestsException: .+' "${out_log}" \
              | tail -n 1 | sed 's/\x1b\[[0-9;]*m//g' || true)"
            if [[ -z "${failure_summary}" ]]; then
              failure_summary="$(grep -E 'RuntimeError:|AssertionError:|Error:' "${out_log}" \
                | tail -n 1 | sed 's/\x1b\[[0-9;]*m//g' || true)"
            fi
            [[ -z "${failure_summary}" ]] && failure_summary="(no exception line found)"
            log_tail="$(tail -n 50 "${out_log}" | sed 's/\x1b\[[0-9;]*m//g' || true)"
          fi

          conclusion="SUCCESS"
          if [[ "${{ job.status }}" != "success" ]]; then
            conclusion="FAILED"
          fi

          {
            echo "## K8s Native Stress Run Summary"
            echo ""
            echo "**Result:** ${conclusion}"
            echo ""
            echo "### Run Info"
            echo "- **Test class:** \`${TESTNAME}\`"
            echo "- **Cluster ID:** \`${CLUSTER_ID}\`"
            echo "- **Branch:** \`${{ github.ref_name }}\`"
            echo "- **Operator Repo Branch:** \`${{ github.event.inputs.operator_repo_branch }}\`"
            echo "- **NDCS/NPCS:** \`${NDCS}/${NPCS}\`"
            echo "- **BS/Chunk BS:** \`${BS}/${CHUNK_BS}\`"
            echo "- **Duration:** ${dur_fmt}"
            echo ""
            echo "### Test Results"
            echo "- **Total:** ${total_cases} | **Passed:** ${passed_cnt} | **Failed:** ${failed_cnt} | **Skipped:** ${skipped_cnt}"
            if [[ -n "${test_wise}" ]]; then
              echo '```'
              printf '%s\n' "${test_wise}"
              echo '```'
            fi
            echo ""
            echo "### Failure Reason"
            echo '```'
            printf '%s\n' "${failure_summary}"
            echo '```'
            if [[ -n "${log_tail}" ]]; then
              echo ""
              echo "<details><summary>Last 50 lines of output.log</summary>"
              echo ""
              echo '```'
              printf '%s\n' "${log_tail}"
              echo '```'
              echo "</details>"
            fi
            echo ""
            echo "### NFS Log Locations"
            echo "- **Test logs:** \`${TEST_LOG_PATH:-not detected}\`"
            echo "- **RUN_BASE_DIR:** \`${RUN_BASE_DIR:-not detected}\`"
            echo "- Graylog logs: \`${RUN_BASE_DIR:-<run_dir>}/graylog_collected/\`"
            if [[ -n "${RUN_BASE_DIR:-}" && -d "${RUN_BASE_DIR}" ]]; then
              echo ""
              echo "<details><summary>NFS directory listing</summary>"
              echo ""
              echo '```'
              ls -la "${RUN_BASE_DIR}/" 2>/dev/null || echo "(empty)"
              echo '```'
              echo "</details>"
            fi
            echo ""
            echo "> **Note:** Graylog/OpenSearch logs are currently being collected and will be available in the NFS log directory shortly."
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          TESTNAME: ${{ env.TESTNAME }}
          CLUSTER_ID: ${{ env.CLUSTER_ID }}
          NDCS: ${{ env.NDCS }}
          NPCS: ${{ env.NPCS }}
          BS: ${{ env.BS }}
          CHUNK_BS: ${{ env.CHUNK_BS }}
          RUN_BASE_DIR: ${{ env.RUN_BASE_DIR }}
          TEST_TIME_HOURS: ${{ env.TEST_TIME_HOURS }}
          TEST_TIME_MINS: ${{ env.TEST_TIME_MINS }}
          TEST_TIME_SECS: ${{ env.TEST_TIME_SECS }}

      - name: Send Slack Notification
        if: always() && (github.event.inputs.send_slack_notification || 'true') == 'true'
        shell: bash
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          JOB_STATUS: ${{ job.status }}
          SLACK_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          GITHUB_REF_NAME: ${{ github.ref_name }}
          SLACK_WF_NAME: "K8s Native Stress"
          TESTNAME: ${{ env.TESTNAME }}
          RUN_BASE_DIR: ${{ env.RUN_BASE_DIR }}
          NDCS: ${{ env.NDCS }}
          NPCS: ${{ env.NPCS }}
          TEST_START_TIME: ${{ env.TEST_START_TIME }}
          TEST_END_TIME: ${{ env.TEST_END_TIME }}
        run: |
          python3 - <<'PYEOF'
          import json, os, re, sys, urllib.request, urllib.error
          bot_token = os.environ.get("SLACK_BOT_TOKEN", "")
          channel   = os.environ.get("SLACK_CHANNEL_ID", "")
          webhook   = os.environ.get("SLACK_WEBHOOK_URL", "")
          if not bot_token and not webhook:
              print("No SLACK_BOT_TOKEN or SLACK_WEBHOOK_URL set, skipping.")
              sys.exit(0)
          out_log = os.path.join(os.environ.get("GITHUB_WORKSPACE", "."), "e2e", "output.log")
          total = passed = failed = skipped = 0
          if os.path.isfile(out_log):
              content = open(out_log).read()
              def px(pat):
                  m = re.search(pat, content)
                  return int(m.group(1)) if m else 0
              total   = px(r'Number of Total Cases:\s*(\d+)')
              passed  = px(r'Number of Passed Cases:\s*(\d+)')
              failed  = px(r'Number of Failed Cases:\s*(\d+)')
              skipped = px(r'Number of Skipped Cases:\s*(\d+)')
          pass_pct = (passed * 100 // total) if total > 0 else 0
          s    = int(os.environ.get("TEST_START_TIME", "0") or "0")
          e    = int(os.environ.get("TEST_END_TIME",   "0") or "0")
          secs = max(0, e - s) if e >= s > 0 else 0
          dur  = f"{secs//3600}h {(secs%3600)//60}m {secs%60}s"
          run_url  = os.environ.get("SLACK_RUN_URL",   "")
          log_dir  = os.environ.get("RUN_BASE_DIR",    "N/A")
          ndcs     = os.environ.get("NDCS",            "?")
          npcs     = os.environ.get("NPCS",            "?")
          test_cls = os.environ.get("TESTNAME",        "") or "all"
          branch   = os.environ.get("GITHUB_REF_NAME", "?")
          wf_name  = os.environ.get("SLACK_WF_NAME",   "Run")
          ok       = os.environ.get("JOB_STATUS",      "") == "success"
          icon    = ":white_check_mark:" if ok else ":x:"
          status  = "SUCCESS" if ok else "FAILURE"
          mention = "" if ok else " <!channel>"
          lines = [
              f"{icon} *SimplyBlock {wf_name}*{mention}",
              f"*Status:* {status}  |  *Duration:* {dur}",
              f"*Branch:* `{branch}`  |  *NDCS/NPCS:* `{ndcs}/{npcs}`  |  *Test class:* `{test_cls}`",
              "",
          ]
          if total > 0:
              lines += [
                  f":white_check_mark: *Passed:*  {passed}/{total}  ({pass_pct}%)",
                  f":x: *Failed:*  {failed}",
                  f":fast_forward: *Skipped:*  {skipped}",
              ]
          else:
              lines.append("_(test counts not found in log)_")
          # --- Per-test results ---
          test_log_paths = []
          if os.path.isfile(out_log):
              ansi_re = re.compile(r'\x1b\[[0-9;]*m')
              test_results = []
              for raw_line in content.splitlines():
                  cl = ansi_re.sub('', raw_line)
                  if 'Logs Path:' in cl:
                      p = cl.split('Logs Path:')[-1].strip()
                      if p:
                          test_log_paths.append(p)
                  if not re.search(r'(PASSED|FAILED|SKIPPED) CASE', cl):
                      continue
                  m = re.search(r'Test[A-Za-z0-9_]+', cl)
                  if not m:
                      continue
                  name = m.group(0)
                  if   'PASSED CASE'  in cl: test_results.append(('PASSED',  name))
                  elif 'FAILED CASE'  in cl: test_results.append(('FAILED',  name))
                  elif 'SKIPPED CASE' in cl: test_results.append(('SKIPPED', name))
              if test_results:
                  lines.append("")
                  lines.append("*Test Results:*")
                  icons = {'PASSED': ':white_check_mark:', 'FAILED': ':x:', 'SKIPPED': ':fast_forward:'}
                  for st, nm in test_results:
                      lines.append(f"{icons.get(st, ':grey_question:')} `{nm}`")

          lines += [""]
          if test_log_paths:
              for tlp in test_log_paths:
                  lines.append(f":open_file_folder: *Test Logs:* `{tlp}`")
          lines += [
              f":file_folder: *E2E Run Dir:* `{log_dir}`",
              f":scroll: *Graylog:* `{log_dir}/graylog_collected/`",
              f":link: *Run:* <{run_url}|View on GitHub>",
              f":hourglass_flowing_sand: _Logs are being collected and will be available shortly._",
          ]
          # --- Send ---
          gh_env = os.environ.get("GITHUB_ENV", "")
          text   = "\n".join(lines)

          if bot_token and channel:
              api_payload = json.dumps({"channel": channel, "text": text}).encode()
              req = urllib.request.Request(
                  "https://slack.com/api/chat.postMessage",
                  data=api_payload,
                  headers={
                      "Content-Type": "application/json; charset=utf-8",
                      "Authorization": f"Bearer {bot_token}",
                  },
              )
              try:
                  resp = urllib.request.urlopen(req, timeout=15)
                  body = json.loads(resp.read().decode())
                  if body.get("ok"):
                      ts = body.get("ts", "")
                      print(f"Slack notification sent via Bot API (ts={ts}).")
                      if gh_env and ts:
                          with open(gh_env, "a") as f:
                              f.write(f"SLACK_MSG_TS={ts}\n")
                  else:
                      print(f"WARN: Slack API error: {body.get('error')}", file=sys.stderr)
              except Exception as exc:
                  print(f"WARN: Slack Bot API failed: {exc}", file=sys.stderr)
          elif webhook:
              req = urllib.request.Request(
                  webhook,
                  data=json.dumps({"text": text}).encode(),
                  headers={"Content-Type": "application/json"},
              )
              try:
                  urllib.request.urlopen(req, timeout=15)
                  print("Slack notification sent via webhook (no thread support).")
              except Exception as exc:
                  print(f"WARN: Slack webhook failed: {exc}", file=sys.stderr)
          else:
              print("No SLACK_BOT_TOKEN or SLACK_WEBHOOK_URL set, skipping.")
          PYEOF



      - name: Analyze SPDK core dumps (gdb backtraces)
        if: always()
        continue-on-error: true
        timeout-minutes: 30
        shell: bash
        run: |
          set -uo pipefail
          # For every SPDK core on a storage node, stage it inside that node's
          # snode-spdk pod (where the matching bdts binary and symbols live),
          # run `bt` and `thread apply all bt full`, and save all three
          # artifacts next to the run logs. Script and rationale:
          # e2e/scripts/analyze_core_dumps_k8s.sh
          CORE_SCRIPT="${GITHUB_WORKSPACE}/e2e/scripts/analyze_core_dumps_k8s.sh"
          if [[ ! -f "${CORE_SCRIPT}" ]]; then
            echo "WARN: ${CORE_SCRIPT} not found; skipping core-dump analysis"
            exit 0
          fi
          OUT_DIR="${RUN_BASE_DIR:-}"
          if [[ -z "${OUT_DIR}" && -n "${RUN_DIR_FILE:-}" && -f "${RUN_DIR_FILE}" ]]; then
            OUT_DIR="$(tr -d '\r\n' < "${RUN_DIR_FILE}")"
          fi
          if [[ -z "${OUT_DIR}" ]]; then
            OUT_DIR="${NFS_MOUNTPOINT:-/mnt/nfs_share}/core_backtraces-$(date -u '+%Y%m%d-%H%M%S')"
            echo "WARN: no run dir found, falling back to ${OUT_DIR}"
          fi
          echo "Core backtraces -> ${OUT_DIR}/core_backtraces"
          bash "${CORE_SCRIPT}" "${OUT_DIR}" "${NAMESPACE:-simplyblock}" || echo "WARN: core-dump analysis failed"

      - name: Collect Graylog/OpenSearch logs
        if: '!cancelled()'
        timeout-minutes: ${{ fromJSON(env.LOG_COLLECT_TIMEOUT_MINS || '480') }}
        run: |
          set +e
          echo "=== Collecting Graylog/OpenSearch logs (per-hour chunks) ==="
          NAMESPACE=simplyblock

          if [ -z "${TEST_START_TIME}" ] || [ -z "${TEST_END_TIME}" ]; then
            echo "WARN: TEST_START_TIME or TEST_END_TIME not set, skipping"
            exit 0
          fi

          ELAPSED=$((TEST_END_TIME - TEST_START_TIME))
          if [ "${ELAPSED}" -le 0 ]; then
            echo "WARN: Elapsed time is zero or negative, skipping"
            exit 0
          fi

          # Total window: 1h before test start → 1h after test end
          WINDOW_START=$((TEST_START_TIME - 3600))
          WINDOW_END=$((TEST_END_TIME + 3600))
          TOTAL_SECONDS=$((WINDOW_END - WINDOW_START))
          TOTAL_HOURS=$(( (TOTAL_SECONDS + 3599) / 3600 ))
          echo "  Total window: ${TOTAL_HOURS} hour(s) to collect"

          # Resolve admin pod
          ADMIN_POD=""
          for i in $(seq 1 12); do
            ADMIN_POD=$(kubectl -n ${NAMESPACE} get pods \
              -l app=simplyblock-admin-control \
              -o jsonpath='{.items[0].metadata.name}' 2>/dev/null) || true
            if [ -n "${ADMIN_POD}" ]; then
              PHASE=$(kubectl -n ${NAMESPACE} get pod "${ADMIN_POD}" \
                -o jsonpath='{.status.phase}' 2>/dev/null) || true
              [ "${PHASE}" = "Running" ] && break
              ADMIN_POD=""
            fi
            sleep 10
          done
          if [ -z "${ADMIN_POD}" ]; then
            echo "ERROR: No running admin pod found, skipping"
            exit 0
          fi
          echo "  Admin pod: ${ADMIN_POD}"

          # Deploy updated collect_logs.py to admin pod (use /tmp since package dir is read-only)
          BUILTIN_SCRIPT="/usr/local/lib/python3.12/site-packages/simplyblock_core/scripts/collect_logs.py"
          DEPLOYED_SCRIPT="/tmp/collect_logs.py"
          SCRIPT_SRC="${GITHUB_WORKSPACE}/scripts/collect_logs.py"
          if [ -f "${SCRIPT_SRC}" ]; then
            kubectl -n ${NAMESPACE} cp "${SCRIPT_SRC}" "${ADMIN_POD}:${DEPLOYED_SCRIPT}" 2>/dev/null || \
              echo "WARN: failed to deploy updated collect_logs.py, using built-in version"
          fi
          # Determine which script to use
          COLLECT_SCRIPT="${BUILTIN_SCRIPT}"
          if kubectl -n ${NAMESPACE} exec "${ADMIN_POD}" -- test -f "${DEPLOYED_SCRIPT}" 2>/dev/null; then
            COLLECT_SCRIPT="${DEPLOYED_SCRIPT}"
            echo "  Using deployed script: ${COLLECT_SCRIPT}"
          else
            echo "  Using built-in script: ${COLLECT_SCRIPT}"
          fi

          # Get Graylog service ClusterIP for mgmt-ip
          MGMT_IP=$(kubectl get svc -n ${NAMESPACE} | grep graylog | awk '{print $3}')
          echo "  Graylog IP: ${MGMT_IP}"
          OPENSEARCH_IP=$(kubectl get svc opensearch-cluster-master -n ${NAMESPACE} -o jsonpath='{.spec.clusterIP}' 2>/dev/null || echo "")
          echo "  OpenSearch IP: ${OPENSEARCH_IP}"

          # Determine output dir from RUN_BASE_DIR
          OUTPUT_DIR=""
          if [ -n "${RUN_BASE_DIR:-}" ] && [ -d "${RUN_BASE_DIR}" ]; then
            OUTPUT_DIR="${RUN_BASE_DIR}/graylog_collected"
          else
            NFS_BASE="${NFS_MOUNTPOINT:-/mnt/nfs_share}"
            TIMESTAMP=$(date -u "+%Y%m%d-%H%M%S")
            OUTPUT_DIR="${NFS_BASE}/graylog_collected-${TIMESTAMP}"
          fi
          mkdir -p "${OUTPUT_DIR}" 2>/dev/null || true
          echo "  Output: ${OUTPUT_DIR}"

          # Helper: convert epoch to ISO-8601
          epoch_to_iso() {
            local ep=$1
            local iso
            iso=$(date -u -d "@${ep}" "+%Y-%m-%dT%H:%M:%S" 2>/dev/null)
            if [ -z "${iso}" ]; then
              iso=$(python3 -c "from datetime import datetime,timezone; print(datetime.fromtimestamp(${ep},tz=timezone.utc).strftime('%Y-%m-%dT%H:%M:%S'))")
            fi
            echo "${iso}"
          }

          # Build chunk boundaries, then iterate in REVERSE order (newest first)
          # so the most critical logs (end of test) are captured first.
          _CHUNK_STARTS=()
          _C=${WINDOW_START}
          while [ ${_C} -lt ${WINDOW_END} ]; do
            _CHUNK_STARTS+=(${_C})
            _C=$((_C + 3600))
          done
          NUM_CHUNKS=${#_CHUNK_STARTS[@]}

          # Helper: run collect_logs.py with optional extra flags
          run_collect() {
            local iso=$1 mins=$2 outdir=$3 extra_flag=${4:-}
            local mgmt_ip_to_use="${MGMT_IP}"
            if [[ "${extra_flag}" == *"--use-opensearch"* ]] && [ -n "${OPENSEARCH_IP}" ]; then
              mgmt_ip_to_use="${OPENSEARCH_IP}"
            fi
            kubectl -n ${NAMESPACE} exec "${ADMIN_POD}" -- \
              python3 "${COLLECT_SCRIPT}" \
                "${iso}" "${mins}" \
                --mode kubernetes \
                --namespace "${NAMESPACE}" \
                --monitoring-secret "${MON_SECRET}" \
                --output-dir "${outdir}" \
                ${extra_flag} \
                ${mgmt_ip_to_use:+--mgmt-ip "${mgmt_ip_to_use}"} \
                ${CLUSTER_ID:+--cluster-id "${CLUSTER_ID}"} \
            2>&1
            local rc=$?
            [ $rc -ne 0 ] && return $rc
            local has_content
            has_content=$(kubectl -n ${NAMESPACE} exec "${ADMIN_POD}" -- \
              find "${outdir}" -name "*.tar.gz" -size +0 2>/dev/null | head -1)
            if [ -z "${has_content}" ]; then
              echo "  WARN: collect_logs.py succeeded but no .tar.gz output found"
              return 1
            fi
          }

          # Adaptive collection: try full window, on failure split into
          # 5-min sub-windows, then 1-min if those also fail.
          collect_adaptive() {
            local start_epoch=$1 end_epoch=$2 outdir=$3 extra_flag=${4:-}
            local duration=$((end_epoch - start_epoch))
            local mins=$(( (duration + 59) / 60 ))
            local iso=$(epoch_to_iso ${start_epoch})
            if run_collect "${iso}" "${mins}" "${outdir}" "${extra_flag}"; then
              return 0
            fi
            echo "  WARN: ${mins}m window failed, retrying with 5-min sub-windows..."
            local sub_start=${start_epoch}
            while [ ${sub_start} -lt ${end_epoch} ]; do
              local sub_end=$((sub_start + 300))
              [ ${sub_end} -gt ${end_epoch} ] && sub_end=${end_epoch}
              local sub_mins=$(( ((sub_end - sub_start) + 59) / 60 ))
              local sub_iso=$(epoch_to_iso ${sub_start})
              if ! run_collect "${sub_iso}" "${sub_mins}" "${outdir}" "${extra_flag}"; then
                echo "  WARN: 5-min window at ${sub_iso} failed, retrying with 1-min windows..."
                local micro_start=${sub_start}
                while [ ${micro_start} -lt ${sub_end} ]; do
                  local micro_end=$((micro_start + 60))
                  [ ${micro_end} -gt ${sub_end} ] && micro_end=${sub_end}
                  local micro_mins=$(( ((micro_end - micro_start) + 59) / 60 ))
                  local micro_iso=$(epoch_to_iso ${micro_start})
                  run_collect "${micro_iso}" "${micro_mins}" "${outdir}" "${extra_flag}" || \
                    echo "  WARN: 1-min window at ${micro_iso} also failed"
                  micro_start=${micro_end}
                done
              fi
              sub_start=${sub_end}
            done
          }

          # Auto-detect preferred log backend on the first (newest) chunk:
          # try OpenSearch; if it works use it for all chunks, else use Graylog.
          PREFER_OPENSEARCH=""
          CHUNK=0

          for (( _IDX=NUM_CHUNKS-1; _IDX>=0; _IDX-- )); do
            CHUNK=$((CHUNK + 1))
            CHUNK_START=${_CHUNK_STARTS[$_IDX]}
            CHUNK_END=$((CHUNK_START + 3600))
            if [ ${CHUNK_END} -gt ${WINDOW_END} ]; then
              CHUNK_END=${WINDOW_END}
            fi
            CHUNK_MINUTES=$(( ((CHUNK_END - CHUNK_START) + 59) / 60 ))
            CHUNK_ISO=$(epoch_to_iso ${CHUNK_START})

            echo ""
            echo "--- Chunk ${CHUNK}/${NUM_CHUNKS}: ${CHUNK_ISO} for ${CHUNK_MINUTES}m (newest-first) ---"

            POD_OUTPUT_DIR="/tmp/graylog_collect_chunk${CHUNK}"
            kubectl -n ${NAMESPACE} exec "${ADMIN_POD}" -- mkdir -p "${POD_OUTPUT_DIR}" 2>/dev/null || true

            if [ -z "${PREFER_OPENSEARCH}" ]; then
              # First chunk: probe OpenSearch availability
              echo "  Probing OpenSearch availability..."
              if run_collect "${CHUNK_ISO}" "${CHUNK_MINUTES}" "${POD_OUTPUT_DIR}" "--use-opensearch"; then
                PREFER_OPENSEARCH=true
                echo "  OpenSearch works — using it for all chunks"
              else
                PREFER_OPENSEARCH=false
                echo "  OpenSearch unavailable — using Graylog for all chunks"
                kubectl -n ${NAMESPACE} exec "${ADMIN_POD}" -- rm -rf "${POD_OUTPUT_DIR}" 2>/dev/null || true
                kubectl -n ${NAMESPACE} exec "${ADMIN_POD}" -- mkdir -p "${POD_OUTPUT_DIR}" 2>/dev/null || true
                collect_adaptive ${CHUNK_START} ${CHUNK_END} "${POD_OUTPUT_DIR}" || \
                  echo "WARN: Graylog also failed for chunk ${CHUNK}"
              fi
            elif [ "${PREFER_OPENSEARCH}" = "true" ]; then
              collect_adaptive ${CHUNK_START} ${CHUNK_END} "${POD_OUTPUT_DIR}" "--use-opensearch" || {
                echo "WARN: OpenSearch failed for chunk ${CHUNK}, falling back to Graylog..."
                collect_adaptive ${CHUNK_START} ${CHUNK_END} "${POD_OUTPUT_DIR}" || \
                  echo "WARN: Graylog fallback also failed for chunk ${CHUNK}"
              }
            else
              collect_adaptive ${CHUNK_START} ${CHUNK_END} "${POD_OUTPUT_DIR}" || {
                echo "WARN: Graylog failed for chunk ${CHUNK}, falling back to OpenSearch..."
                collect_adaptive ${CHUNK_START} ${CHUNK_END} "${POD_OUTPUT_DIR}" "--use-opensearch" || \
                  echo "WARN: OpenSearch fallback also failed for chunk ${CHUNK}"
              }
            fi

            # Copy tarballs from pod to NFS for this chunk
            TARBALLS=$(kubectl -n ${NAMESPACE} exec "${ADMIN_POD}" -- \
              find "${POD_OUTPUT_DIR}" -name "*.tar.gz" -type f 2>/dev/null) || true
            if [ -n "${TARBALLS}" ]; then
              for TB in ${TARBALLS}; do
                TB_NAME=$(basename "${TB}")
                echo "  Copying ${TB_NAME}..."
                kubectl -n ${NAMESPACE} cp "${ADMIN_POD}:${TB}" "${OUTPUT_DIR}/${TB_NAME}" 2>&1 || true
              done
              for TB_FILE in "${OUTPUT_DIR}"/*.tar.gz; do
                [ -f "${TB_FILE}" ] && tar -xzf "${TB_FILE}" -C "${OUTPUT_DIR}/" 2>/dev/null || true
              done
            else
              echo "WARN: No tarballs found for chunk ${CHUNK}"
            fi

            # Cleanup this chunk in pod
            kubectl -n ${NAMESPACE} exec "${ADMIN_POD}" -- rm -rf "${POD_OUTPUT_DIR}" 2>/dev/null || true
          done

          echo ""
          echo "=== Log collection complete (${CHUNK} chunks, newest-first): ${OUTPUT_DIR} ==="
          ls -la "${OUTPUT_DIR}/" 2>/dev/null || true
        env:
          CLUSTER_ID: ${{ env.CLUSTER_ID }}
          MON_SECRET: ${{ secrets.MON_SECRET }}

      - name: Notify Slack log collection complete
        if: always() && (github.event.inputs.send_slack_notification || 'true') == 'true'
        shell: bash
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}
          SLACK_CHANNEL_ID: ${{ secrets.SLACK_CHANNEL_ID }}
          SLACK_MSG_TS: ${{ env.SLACK_MSG_TS }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          SLACK_WF_NAME: "K8s Native Stress"
          RUN_BASE_DIR: ${{ env.RUN_BASE_DIR }}
        run: |
          MSG=":white_check_mark: *Log collection complete* for *SimplyBlock ${SLACK_WF_NAME}*\n:file_folder: \`${RUN_BASE_DIR:-N/A}/graylog_collected/\`\n:link: <${SLACK_RUN_URL}|View Run>"
          if [ -n "${SLACK_BOT_TOKEN:-}" ] && [ -n "${SLACK_CHANNEL_ID:-}" ] && [ -n "${SLACK_MSG_TS:-}" ]; then
            curl -s -X POST "https://slack.com/api/chat.postMessage" \
              -H "Authorization: Bearer ${SLACK_BOT_TOKEN}" \
              -H "Content-Type: application/json; charset=utf-8" \
              -d "{\"channel\":\"${SLACK_CHANNEL_ID}\",\"thread_ts\":\"${SLACK_MSG_TS}\",\"text\":\"${MSG}\"}" || true
          elif [ -n "${SLACK_WEBHOOK_URL:-}" ]; then
            curl -s -X POST "${SLACK_WEBHOOK_URL}" \
              -H "Content-Type: application/json" \
              -d "{\"text\":\"${MSG}\"}" || true
          fi

      - name: Cleanup build folder
        if: always()
        run: |
          rm -rf ./* || true
          rm -rf ./.??* || true
          rm -f "$HOME/.kube/config-${{ github.run_id }}"
