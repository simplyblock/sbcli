name: Security Scan

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:

env:
  IMAGE_NAME: simplyblock/simplyblock

jobs:
  scan:
    name: Security Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # The shared layer cache lives in a Docker Hub repository, so log in to read
      # it even though this workflow publishes nothing.
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: hamdysimplyblock
          password: ${{ secrets.DOCKER_PASS }}

      # Built through docker/docker-bake.hcl's `scan` target, which is the same
      # stage and the same build args as the published image -- only the tag and the
      # platform differ -- so the scan reports on the artifact that would ship
      # rather than on a freshly resolved one that would give a false green.
      #
      # bake-action rather than a raw `run:` step because the GitHub Actions cache
      # token is only exposed to the action. cache-from reads the cache
      # build-images.yml populates; cache-to is explicitly empty so this workflow
      # never writes it.
      #
      # NOTE: CACHE_KEY buckets weekly, so this daily scan reports on a base-os
      # layer that may be up to six days old. A vulnerability fixed upstream
      # mid-week stays visible here until the bucket rolls over; to pick it up
      # immediately, dispatch build-images.yml with the `cache_key` input set.
      - name: Build image for scanning (linux/amd64 only)
        uses: docker/bake-action@v7
        with:
          files: docker/docker-bake.hcl
          targets: scan
          load: true
          set: |
            scan.tags=${{ env.IMAGE_NAME }}:scan
            *.platform=linux/amd64
            *.cache-from=type=registry,ref=simplyblock/simplyblock-buildcache:main-amd64
            *.cache-from=type=gha,scope=amd64
            *.cache-to=

      # Grype uses Red Hat's Security Data API — much more current than Trivy's OVAL source.
      - name: Run Grype vulnerability scan (Red Hat advisories)
        id: grype
        uses: anchore/scan-action@v6
        with:
          image: ${{ env.IMAGE_NAME }}:scan
          severity-cutoff: medium
          fail-build: true
          only-fixed: true
          output-format: table

      - name: Run Trivy vulnerability scan (Python packages + secrets)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln,secret

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:scan
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.cdx.json
          retention-days: 90

      - name: Notify Slack on scan failure
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rotating_light: *Security scan failed* — vulnerabilities found in `${{ github.repository }}`. If the fix is already published upstream, the weekly CACHE_KEY bucket may be holding a stale base layer: dispatch `Build images` with the `cache_key` input set to force a cold rebuild.",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    { "title": "Branch",   "value": "${{ github.ref_name }}", "short": true },
                    { "title": "Commit",   "value": "${{ github.sha }}", "short": true },
                    { "title": "Workflow", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>", "short": false }
                  ]
                }
              ]
            }
