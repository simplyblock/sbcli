name: Security Scan

# Scans the images we actually ship, not a fresh build from source -- a CVE
# disclosed after a release went out has to show up here without needing a
# new push to the branch. One matrix entry per supported branch; each entry
# resolves to the published image for that branch's latest release (main has
# no release, so it uses the branch-build image docker-image.yml already
# publishes on every push to main).

on:
  schedule:
    - cron: '0 6 * * *'  # Daily at 06:00 UTC
  workflow_dispatch:

env:
  IMAGE_NAME: simplyblock/simplyblock

jobs:
  scan:
    name: Security Scan (${{ matrix.branch }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # Every currently supported release line (>=26.3; anything older is
        # legacy and unmanaged here), plus main. Add a branch the day its
        # release line becomes supported, remove it the day support ends.
        # Dev/beta branches (e.g. R26.4-Beta) don't belong here -- they're
        # snapshots off main, not a release anyone runs in production.
        branch:
          - main
          - R26.3

    steps:
      # Each branch keeps its own .grype.yaml, so checking it out (rather
      # than scanning from a fixed ref) is what makes per-branch exceptions
      # work: a release branch's exceptions start identical to main's and
      # diverge from there through ordinary commits, same as any other file.
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: ${{ matrix.branch }}

      - name: Resolve image tag for this branch
        id: image
        run: |
          branch="${{ matrix.branch }}"
          if [[ "$branch" == main ]]; then
            tag=main
          else
            prefix="${branch#R}"
            escaped="$(printf '%s' "$prefix" | sed 's/\./\\./g')"
            tag="$(git ls-remote --tags --refs origin \
                     | sed 's#.*refs/tags/##' \
                     | grep -E "^${escaped}(\.|$)" \
                     | sort -V | tail -1)"
            if [[ -z "$tag" ]]; then
              echo "No release tag found for branch '$branch' (prefix '$prefix')." >&2
              exit 1
            fi
            # Defensive: refuse to scan a resolved tag that doesn't match the
            # shape release.yml's own validation enforces at publish time --
            # catches a stray legacy-style tag matching the prefix by accident.
            if [[ ! "$tag" =~ ^[0-9]+(\.[0-9]+){1,3}(-[A-Za-z0-9]+)?$ ]]; then
              echo "Resolved tag '$tag' for branch '$branch' doesn't match the expected release-tag shape -- refusing to scan it." >&2
              exit 1
            fi
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: hamdysimplyblock
          password: ${{ secrets.DOCKER_PASS }}

      - name: Pull published image
        run: docker pull --platform linux/amd64 ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}

      # Grype uses Red Hat's Security Data API — much more current than Trivy's OVAL source.
      - name: Run Grype vulnerability scan (Red Hat advisories)
        id: grype
        uses: anchore/scan-action@v6
        with:
          image: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
          severity-cutoff: medium
          fail-build: true
          only-fixed: true
          output-format: table

      - name: Run Trivy vulnerability scan (Python packages + secrets)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
          format: table
          severity: CRITICAL,HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: '1'
          scanners: vuln,secret

      - name: Generate SBOM (CycloneDX)
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}
          format: cyclonedx
          output: sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.branch }}-${{ steps.image.outputs.tag }}
          path: sbom.cdx.json
          retention-days: 90

      - name: Notify Slack on scan failure
        if: failure()
        uses: slackapi/slack-github-action@v2
        with:
          webhook: ${{ secrets.SLACK_CONTROL_PLANE_WEBHOOK }}
          webhook-type: incoming-webhook
          payload: |
            {
              "text": ":rotating_light: *Security scan failed* — vulnerabilities found in `${{ github.repository }}`",
              "attachments": [
                {
                  "color": "danger",
                  "fields": [
                    { "title": "Branch",   "value": "${{ matrix.branch }}", "short": true },
                    { "title": "Image",    "value": "${{ env.IMAGE_NAME }}:${{ steps.image.outputs.tag }}", "short": true },
                    { "title": "Workflow", "value": "<${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|View run>", "short": false }
                  ]
                }
              ]
            }
