name: Lab reservation
description: Reserve a lab cluster with labreservation.simplyblock.ai for the life of this job.

inputs:
  cluster:
    description: >-
      One or more cluster names, space- or comma-separated, spelled as the
      reservations console spells them. A lane's hosts are often several
      clusters: the docker lab is baremetal plus host_210 plus a client
      each. Give this or `kind`, never both.
    required: false
    default: ""
  kind:
    description: Ask for any free cluster of this kind instead of naming one. The server picks, so you are not racing someone else's listing.
    required: false
    default: ""
  duration:
    description: 1h, 3h, 6h, 12h or 24h. A bare number means hours.
    required: false
    default: "6h"
  clean:
    description: Have the service wipe the hosts before the reservation reports ready. Our own workflows do their own cleanup, so this is off.
    required: false
    default: "false"
  bootstrap:
    description: Have k3s stood up after the wipe. Implies clean. Not for lanes that deploy their own Kubernetes.
    required: false
    default: "false"
  expect-hosts:
    description: Hosts this job will actually touch. Checked against the reservation and reported if the group does not cover them.
    required: false
    default: ""
  require-hosts:
    description: Fail rather than warn when `expect-hosts` is not covered.
    required: false
    default: "false"
  ready-timeout:
    description: Seconds to wait for the reservation to report ready.
    required: false
    default: "900"
  on-existing:
    description: >-
      What to do when this account already holds a live reservation for the
      cluster being asked for. `release` (the default) gives it back and books
      a fresh one, because by the time a later run reaches this step the older
      booking is the previous run's leftover and this run is about to wipe
      those hosts anyway. `reuse` keeps it, which is right for a lane sharing a
      booking with an earlier job in the same chain, or when a person is
      holding the lab deliberately.
    required: false
    default: "release"
  disabled:
    description: Emergency bypass. Skips the reservation and warns.
    required: false
    default: "false"

outputs:
  id:
    description: Comma-separated reservation ids, for extending or releasing by hand.
  cluster:
    description: The clusters that were reserved, space-separated.
  hosts:
    description: Space-separated hosts of that cluster.
  expires-at:
    description: When the FIRST of the reservations runs out, RFC3339 -- the one that bounds the run.
  created:
    description: Comma-separated ids of the bookings THIS job made, which are the only ones released when it ends. Empty when every cluster was already reserved to this account and reused.

runs:
  # JavaScript rather than composite, for the same reason lab-lock is: only a
  # JS action gets `post`.
  #
  # `post` no longer releases. A run that ends does not hand the lab back,
  # because the hosts are usually not in a state anyone should take them in --
  # a failed stress run leaves a cluster at 4 of 6 nodes with its resources
  # preserved for debugging, and a reservation released at that moment reports
  # the lab free when what is free is a wreck. The booking is cleared instead
  # by the NEXT run, immediately before it books and wipes those hosts.
  #
  # The post step still runs, to say what is held and how to give it back.
  using: node20
  main: main.js
  post: post.js
  post-if: always()
